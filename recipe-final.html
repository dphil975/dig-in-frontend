<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="frontend/css/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIG-IN · Recipes</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DotGothic16', monospace;
            background: linear-gradient(135deg, #FFF8F0 0%, #FFE4D6 100%);
            color: #3a2a30;
            min-height: 100vh;
            padding: 20px;
        }

        /* ── Meal type filter bar ─────────────────────────────────── */
        .meal-filter-bar {
            max-width: 900px;
            margin: 0 auto 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .meal-filter-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: #8b5e3c;
            margin-right: 4px;
            letter-spacing: 1px;
        }
        .meal-pill {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            padding: 9px 14px;
            border: 3px solid #1c1c1c;
            border-radius: 20px;
            background: #fff0e0;
            color: #8b5e3c;
            cursor: pointer;
            box-shadow: 2px 2px 0 #1c1c1c;
            transition: transform .08s, box-shadow .08s;
        }
        .meal-pill:hover:not(.active) { background: #ffe0d0; }
        .meal-pill.active {
            background: #c8455f;
            color: #fff;
            box-shadow: 2px 2px 0 #8b2a40;
        }

        /* ── Recipe grid (browse) ─────────────────────────────────── */
        #recipeBrowser {
            max-width: 900px;
            margin: 0 auto 24px;
            display: none;
        }
        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        .recipe-thumb {
            background: white;
            border: 3px solid #1c1c1c;
            border-radius: 12px;
            box-shadow: 3px 3px 0 #1c1c1c;
            padding: 16px 14px;
            cursor: pointer;
            transition: transform .1s, box-shadow .1s;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .recipe-thumb:hover {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #1c1c1c;
        }
        .recipe-thumb-name {
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            color: #3a2a30;
            line-height: 1.5;
        }
        .recipe-thumb-meta {
            font-size: 11px;
            color: #8b5e3c;
        }
        .recipe-thumb-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            padding: 6px 10px;
            background: #c8455f;
            color: white;
            border: 2px solid #1c1c1c;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            margin-top: auto;
        }
        .browse-back {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            padding: 8px 14px;
            background: #fff0e0;
            color: #8b5e3c;
            border: 3px solid #1c1c1c;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 2px 2px 0 #1c1c1c;
            margin-bottom: 14px;
            display: inline-block;
        }
        .browse-back:hover { background: #ffe0d0; }

        /* ── Recipe Card ──────────────────────────────────────────── */
        .recipe-card-final {
            background: white;
            border-radius: 16px;
            border: 4px solid #1c1c1c;
            box-shadow: 5px 5px 0 #1c1c1c;
            max-width: 900px;
            margin: 0 auto;
            overflow: hidden;
        }
        .card-header {
            background: #fdf5f0;
            border-bottom: 4px solid #1c1c1c;
            padding: 24px 20px;
            text-align: center;
            position: relative;
        }
        .card-header-left { margin-bottom: 16px; }
        .card-header-left h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 13px;
            color: #3a2a30;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            line-height: 1.6;
        }
        .card-header-left p { font-size: 12px; color: #6a5550; margin-bottom: 12px; font-style: italic; }
        .card-meta { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .meta-badge {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            background: #fff0e0;
            border: 3px solid #1c1c1c;
            padding: 8px 14px;
            border-radius: 20px;
            color: #8b5e3c;
            box-shadow: 2px 2px 0 #1c1c1c;
        }
        .card-header-right { position: absolute; top: 24px; right: 20px; }
        .dish-emoji-big { font-size: 80px; line-height: 1; }

        /* ── Card Body ────────────────────────────────────────────── */
        .card-body { padding: 28px 32px 24px; }

        /* ── View Tabs ────────────────────────────────────────────── */
        .view-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0;
            border-bottom: 3px solid #1c1c1c;
            margin-bottom: 20px;
        }
        .view-tab {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            padding: 10px 16px;
            background: #f5e8e0;
            color: #8b5e3c;
            border: 3px solid #1c1c1c;
            border-bottom: none;
            border-radius: 6px 6px 0 0;
            margin-right: 4px;
            cursor: pointer;
            transition: background .15s;
        }
        .view-tab:hover { background: #ffe0d0; }
        .view-tab.active {
            background: #c8455f;
            color: white;
            position: relative;
            top: 3px;
            z-index: 1;
        }

        /* ── Ingredients ──────────────────────────────────────────── */
        .ing-list { list-style: none; padding: 0; }
        .ing-list li {
            display: flex;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #f0e0d8;
            font-size: 14px;
            align-items: flex-start;
        }
        .ing-list li:last-child { border-bottom: none; }
        .ing-check {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            border: 2px solid #c8455f;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
            transition: background .15s;
        }
        .ing-check.checked { background: #c8455f; color: white; font-size: 10px; }

        /* ── Step view toggle ─────────────────────────────────────── */
        .step-mode-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            padding: 10px 12px;
            background: #fff8f0;
            border: 3px solid #f0d0b8;
            border-radius: 10px;
            border-left: 4px solid #c8455f;
        }
        .mode-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            padding: 9px 14px;
            border: 3px solid #1c1c1c;
            border-radius: 8px;
            background: #f5e8e0;
            color: #8b5e3c;
            cursor: pointer;
            box-shadow: 2px 2px 0 #1c1c1c;
            transition: transform .08s;
        }
        .mode-btn:hover { background: #ffe0d0; }
        .mode-btn.active { background: #c8455f; color: white; }

        /* ── Step list ────────────────────────────────────────────── */
        #stepList { display: block; }
        .step-item {
            display: flex;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid #f0e0d8;
            cursor: pointer;
            user-select: none;
        }
        .step-item:last-child { border-bottom: none; }
        .step-item.done .step-text { text-decoration: line-through; color: #b09090; }
        .step-num-badge {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            background: #8b5e3c;
            color: white;
            border-radius: 50%;
            border: 2px solid #1c1c1c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            margin-top: 2px;
        }
        .step-text { font-size: 14px; line-height: 1.6; color: #3a2a30; flex: 1; }

        /* ── Carousel ─────────────────────────────────────────────── */
        #carouselContainer { display: none; }
        .carousel-viewport { overflow: hidden; border-radius: 12px; margin-bottom: 14px; }
        .carousel-track { display: flex; transition: transform 0.3s cubic-bezier(.4,0,.2,1); }
        .flip-card {
            min-width: 100%;
            flex-shrink: 0;
            perspective: 900px;
            height: 300px;
            cursor: pointer;
        }
        .flip-inner {
            position: relative; width: 100%; height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.45s cubic-bezier(.4,0,.2,1);
        }
        .flip-card.flipped .flip-inner { transform: rotateY(180deg); }
        .flip-front, .flip-back {
            position: absolute; inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border: 4px solid #1c1c1c;
            border-radius: 12px;
            padding: 18px 22px;
            box-shadow: 4px 4px 0 #1c1c1c;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .flip-front { background: #fdf5f0; gap: 10px; }
        .flip-back {
            background: #1c1c1c; color: #fff;
            transform: rotateY(180deg);
            align-items: center; justify-content: center;
            text-align: center; gap: 8px;
        }
        .flip-step-header {
            font-family: 'Press Start 2P', monospace;
            font-size: 8px; color: #c8455f; letter-spacing: 1px;
        }
        .flip-step-text { font-size: 13px; line-height: 1.6; color: #3a2a30; flex: 1; }
        .flip-hint {
            font-family: 'Press Start 2P', monospace;
            font-size: 5px; color: #c8455f; letter-spacing: 1px;
            text-align: right; margin-top: auto;
        }
        .flip-stage-emoji { font-size: 64px; line-height: 1; }
        .flip-stage-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px; color: #f4a924; letter-spacing: 1px;
        }
        .flip-visual-text { font-size: 13px; color: #d0b8a8; line-height: 1.6; max-width: 230px; }
        .carousel-nav {
            display: flex; align-items: center; justify-content: center;
            gap: 14px; margin-top: 14px;
        }
        .carousel-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px; padding: 10px 18px;
            background: #c8455f; color: white;
            border: 3px solid #1c1c1c; border-radius: 8px;
            cursor: pointer; box-shadow: 3px 3px 0 #1c1c1c;
            transition: transform .08s, box-shadow .08s;
        }
        .carousel-btn:hover:not(:disabled) { transform: translate(1px,1px); box-shadow: 2px 2px 0 #1c1c1c; }
        .carousel-btn:disabled { background: #e0c8c0; color: #b09090; cursor: default; box-shadow: 2px 2px 0 #ccc; }
        .carousel-indicator {
            font-family: 'Press Start 2P', monospace;
            font-size: 8px; color: #8b5e3c; min-width: 56px; text-align: center;
        }

        /* ── Adapt tab ────────────────────────────────────────────── */
        .adapt-intro {
            font-family: 'DotGothic16', monospace;
            font-size: 13px; color: #6a5550; line-height: 1.7;
            margin-bottom: 16px; padding: 10px 14px;
            background: #fff8f0; border-radius: 8px;
            border-left: 4px solid #8b5e3c;
        }
        .adapt-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px; margin-bottom: 14px;
        }
        .adapt-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px; padding: 14px 10px;
            border: 3px solid #1c1c1c; border-radius: 10px;
            background: white; color: #3a2a30;
            cursor: pointer; text-align: center;
            box-shadow: 3px 3px 0 #1c1c1c;
            transition: transform .08s, box-shadow .08s;
        }
        .adapt-btn:hover { transform: translate(1px,1px); box-shadow: 2px 2px 0 #1c1c1c; }
        .adapt-btn.active { background: #c8455f; color: white; box-shadow: 3px 3px 0 #8b2a40; }
        .adapt-results {
            background: white; border: 2px solid #d0b8a0;
            border-radius: 8px; padding: 12px 14px;
            display: none; line-height: 1.7;
        }
        .adapt-results.show { display: block; }
        .adapt-row {
            display: flex; gap: 10px; align-items: flex-start;
            padding: 8px 0; border-bottom: 1px solid #f0e0d8;
        }
        .adapt-row:last-child { border-bottom: none; }
        .adapt-row-icon { font-size: 18px; flex-shrink: 0; }
        .adapt-row-text { font-size: 13px; color: #3a2a30; line-height: 1.6; }
        .adapt-row-text strong { color: #c8455f; }

        /* ── Drinks ───────────────────────────────────────────────── */
        .drinks-flavor-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .drink-cat-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
        .drink-pill {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px; padding: 7px 12px;
            border: 2px solid #d0b8a0; border-radius: 20px;
            background: white; color: #8b5e3c;
            cursor: pointer; transition: all .15s;
        }
        .drink-pill:hover, .drink-pill.active {
            background: #8b5e3c; color: white; border-color: #8b5e3c;
        }
        .drinks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
        }
        .drink-card {
            background: white;
            border: 3px solid #1c1c1c;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 3px 3px 0 #1c1c1c;
            cursor: pointer;
            transition: transform .1s, box-shadow .1s;
        }
        .drink-card:hover { transform: translate(1px,1px); box-shadow: 2px 2px 0 #1c1c1c; }
        .drink-card.featured { border-color: #f4a924; box-shadow: 3px 3px 0 #c8a000; }
        .drink-card-head {
            padding: 9px 12px;
            background: #3a2a30;
            color: white;
            display: flex; align-items: center; gap: 8px;
        }
        .drink-card.featured .drink-card-head { background: #8b5e3c; }
        .drink-card-name {
            font-family: 'Press Start 2P', monospace;
            font-size: 6px; line-height: 1.5; flex: 1;
        }
        .drink-card-body { padding: 10px 12px; font-size: 11px; color: #555; line-height: 1.5; }
        .drink-card-price {
            padding: 0 12px 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: 7px; color: #c8455f;
        }
        .drinks-remix-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px; padding: 10px 16px; margin-top: 12px;
            background: #fff0e0; color: #8b5e3c;
            border: 3px solid #1c1c1c; border-radius: 8px;
            cursor: pointer; box-shadow: 2px 2px 0 #1c1c1c;
        }
        .drinks-remix-btn:hover { background: #ffe0d0; }

        /* ── Action buttons ───────────────────────────────────────── */
        .action-buttons { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
        .btn-primary {
            flex: 1; min-width: 140px;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px; padding: 14px 22px;
            background: #c8455f; color: white;
            border: 3px solid #1c1c1c; border-radius: 8px;
            cursor: pointer; box-shadow: 4px 4px 0 #1c1c1c;
            transition: transform .08s, box-shadow .08s;
        }
        .btn-primary:hover { transform: translate(2px,2px); box-shadow: 2px 2px 0 #1c1c1c; }
        .btn-primary:active { transform: translate(4px,4px); box-shadow: none; }
        .btn-secondary {
            flex-shrink: 0;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px; padding: 12px 18px;
            background: #fff0f4; color: #c8455f;
            border: 3px solid #1c1c1c; border-radius: 8px;
            cursor: pointer; box-shadow: 3px 3px 0 #1c1c1c;
            transition: transform .08s, box-shadow .08s;
        }
        .btn-secondary:hover { transform: translate(1px,1px); box-shadow: 2px 2px 0 #1c1c1c; }
        .btn-secondary.saved { background: #c8455f; color: white; }

        /* ── Drink steps modal ────────────────────────────────────── */
        .drink-modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px;
        }
        .drink-modal {
            background: white;
            border: 4px solid #1c1c1c;
            border-radius: 14px;
            box-shadow: 6px 6px 0 #1c1c1c;
            max-width: 480px; width: 100%;
            max-height: 85vh; overflow-y: auto;
        }
        .drink-modal-header {
            background: #3a2a30; color: white;
            padding: 16px 20px;
            display: flex; align-items: center; gap: 12px;
        }
        .drink-modal-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px; flex: 1; line-height: 1.5;
        }
        .drink-modal-close {
            background: none; border: none;
            color: white; font-size: 20px; cursor: pointer;
        }
        .drink-modal-body { padding: 20px; }
        .drink-modal-desc { font-size: 13px; color: #555; line-height: 1.6; margin-bottom: 14px; }
        .drink-modal-steps { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
        .drink-modal-steps li {
            display: flex; gap: 12px; align-items: flex-start;
            padding: 10px 12px;
            background: #fdf5f0;
            border: 2px solid #e0c8b0;
            border-radius: 8px;
            font-size: 13px; line-height: 1.6;
        }
        .drink-step-num {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px; color: #c8455f;
            min-width: 20px; padding-top: 2px;
        }
        .drink-modal-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
        .drink-modal-tag {
            font-size: 10px; padding: 3px 10px;
            background: #fff0e0; color: #8b5e3c;
            border: 2px solid #d0b8a0; border-radius: 20px;
        }
        .drink-modal-price {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px; color: #c8455f; margin-top: 12px;
        }

        /* ── Empty state ──────────────────────────────────────────── */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #a08070;
            font-size: 13px;
            line-height: 1.7;
        }
        .empty-state-icon { font-size: 40px; margin-bottom: 12px; }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .card-body { padding: 18px 16px; }
            .adapt-options { grid-template-columns: 1fr; }
            .dish-emoji-big { font-size: 50px; }
            .card-header-right { position: static; margin-top: 10px; }
        }
    </style>
</head>
<body>

    <!-- Meal Type Filter Bar -->
    <div class="meal-filter-bar">
        <span class="meal-filter-label">FILTER:</span>
        <button class="meal-pill active" data-meal="all">✦ ALL</button>
        <button class="meal-pill" data-meal="breakfast">🍳 BREAKFAST</button>
        <button class="meal-pill" data-meal="lunch">🥗 LUNCH</button>
        <button class="meal-pill" data-meal="dinner">🍽 DINNER</button>
        <button class="meal-pill" data-meal="desserts">🍰 DESSERTS</button>
        <button class="meal-pill" data-meal="vegetarianRecipes">🥦 VEGETARIAN</button>
        <button class="meal-pill" data-meal="drinks">🥤 DRINKS</button>
    </div>

    <!-- Recipe Browser (shown when a meal type filter is active) -->
    <div id="recipeBrowser">
        <button class="browse-back" id="browseBack">← BACK TO RECIPE</button>
        <div class="recipe-grid" id="recipeGrid"></div>
    </div>

    <!-- Recipe Card -->
    <div class="recipe-card-final" id="recipeCard">
        <div class="card-header">
            <div class="card-header-left">
                <h1 id="recipeName">Select a recipe above</h1>
                <p id="recipeCountry">Use the filters to browse meals</p>
                <div class="card-meta">
                    <span class="meta-badge" id="diffBadge">● Easy</span>
                    <span class="meta-badge" id="timeBadge">⏱ — min</span>
                    <span class="meta-badge" id="servBadge">🍽 — servings</span>
                </div>
            </div>
            <div class="card-header-right">
                <div class="dish-emoji-big" id="recipeEmoji">🍳</div>
            </div>
        </div>

        <div class="card-body">
            <!-- View Tabs -->
            <div class="view-tabs">
                <button class="view-tab active" data-view="ingredients">Ingredients</button>
                <button class="view-tab" data-view="instructions">Instructions</button>
                <button class="view-tab" data-view="adapt">✦ Adapt</button>
                <button class="view-tab" data-view="drinks">🥤 Drinks</button>
            </div>

            <!-- Ingredients -->
            <div id="view-ingredients" class="view-content">
                <ul class="ing-list" id="ingredientsList">
                    <li><span class="ing-check">✓</span><span>Select a recipe to see ingredients</span></li>
                </ul>
            </div>

            <!-- Instructions -->
            <div id="view-instructions" class="view-content" style="display:none">
                <div class="step-mode-bar">
                    <button class="mode-btn active" data-mode="list">☰ LIST</button>
                    <button class="mode-btn" data-mode="carousel">⧉ CAROUSEL</button>
                </div>
                <div id="stepList"></div>
                <div id="carouselContainer">
                    <div class="carousel-viewport">
                        <div class="carousel-track" id="carouselTrack"></div>
                    </div>
                    <div class="carousel-nav">
                        <button class="carousel-btn" id="prevBtn">← PREV</button>
                        <span class="carousel-indicator" id="stepIndicator">1 / —</span>
                        <button class="carousel-btn" id="nextBtn">NEXT →</button>
                    </div>
                </div>
            </div>

            <!-- Adapt -->
            <div id="view-adapt" class="view-content" style="display:none">
                <p class="adapt-intro">Choose a goal and we'll rework the recipe to match.</p>
                <div class="adapt-options">
                    <button class="adapt-btn" data-adapt="protein">🥩 Boost Protein</button>
                    <button class="adapt-btn" data-adapt="fiber">🌾 Add Fiber</button>
                    <button class="adapt-btn" data-adapt="carbs">🥬 Lower Carbs</button>
                    <button class="adapt-btn" data-adapt="veggies">🥦 Boost Veggies</button>
                </div>
                <div class="adapt-results" id="adaptResults"></div>
            </div>

            <!-- Drinks -->
            <div id="view-drinks" class="view-content" style="display:none">
                <div class="drinks-flavor-strip" id="drinksFlavorStrip"></div>
                <div class="drink-cat-pills" id="drinkCatPills"></div>
                <div class="drinks-grid" id="drinksGrid"></div>
                <button class="drinks-remix-btn" id="remixBtn">🔀 Remix Pairings</button>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="btn-primary" id="startBtn">▶ START COOKING</button>
                <button class="btn-secondary" id="saveBtn">♡ SAVE</button>
            </div>
        </div>
    </div>

    <!-- Drink Steps Modal -->
    <div class="drink-modal-overlay" id="drinkModal" style="display:none">
        <div class="drink-modal">
            <div class="drink-modal-header">
                <span id="drinkModalEmoji" style="font-size:24px"></span>
                <div class="drink-modal-title" id="drinkModalTitle"></div>
                <button class="drink-modal-close" id="drinkModalClose">✕</button>
            </div>
            <div class="drink-modal-body">
                <p class="drink-modal-desc" id="drinkModalDesc"></p>
                <ol class="drink-modal-steps" id="drinkModalSteps"></ol>
                <div class="drink-modal-tags" id="drinkModalTags"></div>
                <div class="drink-modal-price" id="drinkModalPrice"></div>
            </div>
        </div>
    </div>

    <script>
        /* ── State ──────────────────────────────────────────────────── */
        let allData = null;           // loaded country JSON data
        let currentRecipe = null;     // currently displayed recipe
        let activeMealType = 'all';
        let drinksData = null;        // think-coffee-menu.json
        let activeDrinkCat = 'all';
        let drinkSeed = Date.now();
        let carouselStep = 0;
        let savedRecipes = JSON.parse(localStorage.getItem('dig_in_saved') || '[]');

        /* ── Flavor detection (for drink pairing) ──────────────────── */
        const FLAVOR_KW = {
            spicy:  ['spicy','chili','jalapeño','sriracha','pepper','hot sauce','cayenne'],
            sweet:  ['sugar','honey','maple','caramel','chocolate','vanilla','coconut','fruit','mango','berry','banana'],
            savory: ['soy sauce','miso','umami','mushroom','anchovy','parmesan','bacon','broth'],
            rich:   ['butter','cream','cheese','beef','pork','lamb','duck','coconut milk'],
            light:  ['salad','lemon','lime','citrus','herb','mint','cucumber','spring','greens'],
            earthy: ['mushroom','truffle','lentil','bean','root','beet','squash','potato'],
            smoky:  ['smoked','barbecue','chipotle','paprika','charcoal','grill','roasted'],
            tangy:  ['vinegar','pickle','lemon','lime','yogurt','tamarind','fermented','kimchi'],
        };
        const FLAVOR_DRINK = {
            spicy:  ['cooling','refreshing','milk-based','fruity','sweet'],
            sweet:  ['bitter','coffee','tea','light','floral'],
            savory: ['acidic','sparkling','light','citrus','refreshing'],
            rich:   ['acidic','sparkling','bitter','coffee'],
            light:  ['floral','tea','citrus','sparkling','light'],
            earthy: ['coffee','roasted','tea','spiced'],
            smoky:  ['bold','roasted','malty'],
            tangy:  ['sweet','fruity','sparkling','refreshing'],
        };

        function detectFlavors(recipe) {
            const text = [recipe.name || '',
                ...(recipe.ingredients || []),
                ...(recipe.instructions || [])
            ].join(' ').toLowerCase();
            return Object.entries(FLAVOR_KW)
                .filter(([, kws]) => kws.some(kw => text.includes(kw)))
                .map(([f]) => f);
        }

        function scoreDrink(drink, flavors) {
            const tags = (drink.pairingTags || drink.flavorProfile || []).map(t => t.toLowerCase());
            const desc = (drink.description || '').toLowerCase();
            let score = 0;
            flavors.forEach(f => {
                (FLAVOR_DRINK[f] || []).forEach(t => { if (tags.includes(t) || desc.includes(t)) score += 2; });
            });
            score += (drinkSeed * 7 + (drink.name.charCodeAt(0) || 0)) % 5 * 0.1;
            return score;
        }

        /* ── ADAPT suggestions ──────────────────────────────────────── */
        const ADAPT = {
            protein: [
                { icon: '🍗', text: '<strong>Swap or add</strong> a lean protein: chicken breast, tofu, tempeh, or canned chickpeas' },
                { icon: '🥚', text: '<strong>Add eggs</strong> on the side or stir them in scrambled for extra protein' },
                { icon: '🫘', text: '<strong>Fold in beans or lentils</strong> — they double as fiber and protein' },
                { icon: '💪', text: '<strong>Increase your protein portion</strong> by 30–40% to hit your goal' },
            ],
            fiber: [
                { icon: '🥦', text: '<strong>Steam broccoli, spinach, or kale</strong> and fold into the dish' },
                { icon: '🥕', text: '<strong>Grate carrots or zucchini</strong> into the mix — they disappear but add fiber' },
                { icon: '🫘', text: '<strong>Replace half the protein</strong> with black beans or lentils' },
                { icon: '🌾', text: '<strong>Swap white rice/pasta</strong> for brown rice, quinoa, or whole wheat' },
            ],
            carbs: [
                { icon: '🥬', text: '<strong>Replace rice or pasta</strong> with cauliflower rice or zucchini noodles' },
                { icon: '🥗', text: '<strong>Serve over a salad bed</strong> instead of a grain base' },
                { icon: '🧀', text: '<strong>Skip sugary sauces</strong> — use olive oil, lemon, or vinegar instead' },
                { icon: '🍳', text: '<strong>Increase fat slightly</strong> (olive oil, avocado) to stay satiated' },
            ],
            veggies: [
                { icon: '🫑', text: '<strong>Sauté bell peppers and onions</strong> as a base layer' },
                { icon: '🥦', text: '<strong>Add broccoli or green beans</strong> in the last few minutes of cooking' },
                { icon: '🍅', text: '<strong>Finish with fresh tomatoes or cherry tomatoes</strong> for brightness' },
                { icon: '🥕', text: '<strong>Roast a mix of root vegetables</strong> and serve alongside' },
            ],
        };

        /* ── Emoji map ──────────────────────────────────────────────── */
        const EMOJI_MAP = {
            pasta: '🍝', spaghetti: '🍝', noodle: '🍜', ramen: '🍜', soup: '🍲', stew: '🍲',
            rice: '🍚', sushi: '🍣', taco: '🌮', burrito: '🌯', pizza: '🍕', burger: '🍔',
            sandwich: '🥪', bread: '🍞', cake: '🎂', cookie: '🍪', pie: '🥧',
            salad: '🥗', chicken: '🍗', beef: '🥩', pork: '🥓', fish: '🐟', shrimp: '🍤',
            curry: '🍛', indian: '🍛', japanese: '🍜', thai: '🫕', mexican: '🌮',
            italian: '🍝', french: '🥐', chinese: '🥢', american: '🍔', default: '🍽️'
        };
        function getEmoji(recipe) {
            const text = (recipe.name + ' ' + (recipe.cuisine || '') + ' ' + (recipe.type || '')).toLowerCase();
            for (const [k, v] of Object.entries(EMOJI_MAP)) {
                if (text.includes(k)) return v;
            }
            return EMOJI_MAP.default;
        }

        /* ── Load data ──────────────────────────────────────────────── */
        async function loadData() {
            // Try URL param ?data=filename.json or sessionStorage
            const params = new URLSearchParams(window.location.search);
            let dataFile = params.get('data');

            // Try to use session recipe data (set by other pages)
            const sessionRecipe = JSON.parse(sessionStorage.getItem('dig_in_current_recipe') || 'null');

            if (dataFile) {
                try {
                    const res = await fetch(`data/${dataFile}`);
                    const raw = await res.json();
                    allData = Object.values(raw)[0];
                } catch (e) { console.warn('Could not load', dataFile, e); }
            }

            // If no country file, build a synthetic allData from sessionStorage + localStorage
            if (!allData) {
                const lsRecipes = JSON.parse(localStorage.getItem('dig_in_recipes') || '[]');
                if (lsRecipes.length || sessionRecipe) {
                    const combined = sessionRecipe ? [sessionRecipe, ...lsRecipes.filter(r => r.name !== sessionRecipe.name)] : lsRecipes;
                    allData = {
                        country: 'My Recipes',
                        breakfast: combined.filter(r => (r.mealType || r.meal_type || '').toLowerCase().includes('breakfast')),
                        lunch:     combined.filter(r => (r.mealType || r.meal_type || '').toLowerCase().includes('lunch')),
                        dinner:    combined.filter(r => (r.mealType || r.meal_type || '').toLowerCase().includes('dinner')),
                        desserts:  combined.filter(r => (r.mealType || r.meal_type || '').toLowerCase().includes('dessert')),
                        vegetarianRecipes: combined.filter(r => r.vegetarian || r.dietary?.includes('v')),
                        all: combined,
                    };
                    // Show session recipe in card right away
                    if (sessionRecipe) renderRecipeCard(sessionRecipe);
                }
            }

            // Load drinks data
            try {
                const dRes = await fetch('data/think-coffee-menu.json');
                drinksData = await dRes.json();
            } catch (e) { console.warn('Could not load drinks', e); }
        }

        /* ── Render recipe card ─────────────────────────────────────── */
        function renderRecipeCard(recipe) {
            currentRecipe = recipe;
            document.getElementById('recipeName').textContent = recipe.name || 'Unnamed Recipe';
            document.getElementById('recipeCountry').textContent = recipe.country ? `From ${recipe.country}` : '';
            const diff = recipe.difficulty || '—';
            document.getElementById('diffBadge').textContent = `● ${diff}`;
            const totalTime = (recipe.prepTime || 0) + (recipe.cookTime || 0);
            document.getElementById('timeBadge').textContent = `⏱ ${totalTime || '—'} min`;
            document.getElementById('servBadge').textContent = `🍽 ${recipe.servings || '—'} servings`;
            document.getElementById('recipeEmoji').textContent = getEmoji(recipe);

            // Ingredients
            const ings = recipe.ingredients || [];
            document.getElementById('ingredientsList').innerHTML = ings.length
                ? ings.map((ing, i) => `
                    <li>
                        <span class="ing-check" data-idx="${i}"></span>
                        <span>${typeof ing === 'object' ? ing.text || ing.name : ing}</span>
                    </li>`).join('')
                : '<li><span>No ingredients listed.</span></li>';

            document.querySelectorAll('.ing-check').forEach(box => {
                box.addEventListener('click', () => box.classList.toggle('checked'));
                box.textContent = '';
            });

            // Steps (list)
            const steps = recipe.instructions || recipe.steps || [];
            document.getElementById('stepList').innerHTML = steps.length
                ? steps.map((s, i) => `
                    <div class="step-item" data-idx="${i}">
                        <div class="step-num-badge">${i + 1}</div>
                        <div class="step-text">${s}</div>
                    </div>`).join('')
                : '<p style="color:#a08070;font-size:13px;padding:16px 0">No steps listed.</p>';

            document.querySelectorAll('.step-item').forEach(item => {
                item.addEventListener('click', () => item.classList.toggle('done'));
            });

            // Carousel
            const track = document.getElementById('carouselTrack');
            const STAGE_LABELS = ['PREP', 'BUILDING', 'COOKING', 'FINISHING', 'PLATING'];
            track.innerHTML = steps.map((s, i) => {
                const ratio = i / Math.max(steps.length - 1, 1);
                const stage = STAGE_LABELS[Math.min(Math.floor(ratio * STAGE_LABELS.length), STAGE_LABELS.length - 1)];
                return `
                <div class="flip-card" data-idx="${i}">
                    <div class="flip-inner">
                        <div class="flip-front">
                            <div class="flip-step-header">STEP ${i + 1} OF ${steps.length}</div>
                            <div class="flip-step-text">${s}</div>
                            <div class="flip-hint">👆 TAP TO FLIP</div>
                        </div>
                        <div class="flip-back">
                            <div class="flip-stage-emoji">${getEmoji(recipe)}</div>
                            <div class="flip-stage-label">${stage}</div>
                            <div class="flip-visual-text">You're in the ${stage.toLowerCase()} phase — keep going!</div>
                        </div>
                    </div>
                </div>`;
            }).join('');

            carouselStep = 0;
            document.getElementById('stepIndicator').textContent = `1 / ${steps.length || 1}`;
            document.getElementById('prevBtn').disabled = true;
            document.getElementById('nextBtn').disabled = steps.length <= 1;

            track.querySelectorAll('.flip-card').forEach(card => {
                card.addEventListener('click', () => card.classList.toggle('flipped'));
            });

            // Save button state
            const isSaved = savedRecipes.some(r => r.name === recipe.name);
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.textContent = isSaved ? '♥ SAVED' : '♡ SAVE';
            saveBtn.classList.toggle('saved', isSaved);

            // Drinks for this recipe
            renderDrinksTab(recipe);

            // Show card, hide browser
            document.getElementById('recipeBrowser').style.display = 'none';
            document.getElementById('recipeCard').style.display = '';

            // Reset to ingredients tab
            switchTab('ingredients');
        }

        /* ── Tab switching ──────────────────────────────────────────── */
        function switchTab(view) {
            document.querySelectorAll('.view-tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
            document.querySelectorAll('.view-content').forEach(v => v.style.display = 'none');
            const el = document.getElementById(`view-${view}`);
            if (el) el.style.display = 'block';
        }

        /* ── Drinks tab ─────────────────────────────────────────────── */
        function renderDrinksTab(recipe) {
            if (!drinksData) return;
            const flavors = detectFlavors(recipe);
            const strip = document.getElementById('drinksFlavorStrip');
            strip.innerHTML = flavors.length
                ? flavors.map(f => `<span style="display:inline-block;background:#c8455f;color:#fff;border-radius:20px;padding:4px 12px;font-size:7px;font-family:'Press Start 2P',monospace;margin:2px">${f.toUpperCase()}</span>`).join('')
                : '<span style="font-size:12px;color:#a08070">Neutral profile — all drinks pair well!</span>';

            const cats = [{ id: 'all', label: '✦ ALL' }, ...(drinksData.drinkCategories || []).map(c => ({ id: c.id, label: (c.emoji || '') + ' ' + c.label }))];
            document.getElementById('drinkCatPills').innerHTML = cats.map(c =>
                `<button class="drink-pill${c.id === activeDrinkCat ? ' active' : ''}" data-cat="${c.id}">${c.label.toUpperCase()}</button>`
            ).join('');

            document.querySelectorAll('.drink-pill').forEach(btn => {
                btn.addEventListener('click', () => {
                    activeDrinkCat = btn.dataset.cat;
                    renderDrinkCards(recipe, flavors);
                    document.querySelectorAll('.drink-pill').forEach(b => b.classList.toggle('active', b.dataset.cat === activeDrinkCat));
                });
            });

            renderDrinkCards(recipe, flavors);
        }

        function renderDrinkCards(recipe, flavors) {
            let drinks = (drinksData.drinks || []).filter(d => d.available !== false);
            if (activeDrinkCat !== 'all') {
                drinks = drinks.filter(d => (d.category || d.section || '') === activeDrinkCat ||
                                            (d.categories || []).includes(activeDrinkCat));
            }
            drinks = drinks
                .map(d => ({ ...d, _score: scoreDrink(d, flavors) }))
                .sort((a, b) => b._score - a._score)
                .slice(0, 9);

            const grid = document.getElementById('drinksGrid');
            grid.innerHTML = drinks.map(d => `
                <div class="drink-card${d.featured ? ' featured' : ''}" data-id="${d.id}">
                    <div class="drink-card-head">
                        <span style="font-size:16px">${d.emoji || '🥤'}</span>
                        <span class="drink-card-name">${d.name}</span>
                        <span style="font-size:11px">${d.temperature === 'hot' ? '☕' : d.temperature === 'cold' ? '🧊' : ''}</span>
                    </div>
                    <div class="drink-card-body">${d.description || ''}</div>
                    ${d.price ? `<div class="drink-card-price">$${d.price.toFixed(2)}</div>` : ''}
                </div>`).join('') || '<p style="color:#a08070;font-size:13px;padding:10px 0">No drinks match this filter.</p>';

            grid.querySelectorAll('.drink-card').forEach(card => {
                card.addEventListener('click', () => {
                    const id = card.dataset.id;
                    const drink = (drinksData.drinks || []).find(d => d.id === id);
                    if (drink) showDrinkModal(drink);
                });
            });
        }

        /* ── Drink modal ────────────────────────────────────────────── */
        function showDrinkModal(drink) {
            document.getElementById('drinkModalEmoji').textContent = drink.emoji || '🥤';
            document.getElementById('drinkModalTitle').textContent = drink.name;
            document.getElementById('drinkModalDesc').textContent = drink.description || '';

            // Generate steps from drink data
            const steps = generateDrinkSteps(drink);
            document.getElementById('drinkModalSteps').innerHTML = steps.map((s, i) => `
                <li><span class="drink-step-num">${i + 1}.</span><span>${s}</span></li>`).join('');

            const tags = [...(drink.flavorProfile || []), ...(drink.pairingTags || [])].slice(0, 6);
            document.getElementById('drinkModalTags').innerHTML = tags.map(t =>
                `<span class="drink-modal-tag">${t}</span>`).join('');

            document.getElementById('drinkModalPrice').textContent = drink.price ? `$${drink.price.toFixed(2)}` : '';
            document.getElementById('drinkModal').style.display = 'flex';
        }

        function generateDrinkSteps(drink) {
            const name = drink.name.toLowerCase();
            const isIced = drink.temperature === 'cold' || name.includes('iced') || name.includes('cold');
            const isEspresso = name.includes('espresso') || name.includes('americano') || name.includes('latte') || name.includes('cappuccino');
            const isTea = name.includes('tea') || name.includes('matcha') || name.includes('chai');
            const isJuice = name.includes('juice') || name.includes('smoothie');
            const isChocolate = name.includes('chocolate') || name.includes('mocha') || name.includes('cocoa');

            if (isEspresso && !isIced) return [
                'Pull a fresh espresso shot using finely ground beans, about 25–30 seconds.',
                'Steam milk to 65°C (150°F) with a silky microfoam texture.',
                `Combine espresso and milk in the correct ratio for a ${drink.name}.`,
                'Serve immediately while hot.',
            ];
            if (isEspresso && isIced) return [
                'Pull 1–2 fresh espresso shots and let cool for 1 minute.',
                'Fill a glass with ice cubes.',
                'Pour espresso over ice.',
                isIced && name.includes('latte') ? 'Add cold milk to taste.' : 'Add cold water or milk and serve.',
            ];
            if (isTea) return [
                'Heat water to the correct temperature (80°C for green tea, 95°C for black tea).',
                `Steep ${drink.name} for 2–4 minutes depending on strength preference.`,
                isIced ? 'Pour over ice and sweeten if desired.' : 'Remove tea and serve hot.',
            ];
            if (isJuice) return [
                'Gather and wash your fresh ingredients.',
                'Juice or blend until smooth.',
                'Strain if desired, then pour over ice.',
                'Serve immediately for the best flavor.',
            ];
            if (isChocolate) return [
                'Heat milk until steaming but not boiling.',
                'Add high-quality cocoa powder or melted dark chocolate and whisk until combined.',
                'Sweeten to taste with sugar or honey.',
                'Top with whipped cream or marshmallows and serve.',
            ];
            return [
                `Prepare all ingredients for ${drink.name}.`,
                'Combine in the correct proportions as per the recipe.',
                'Stir or shake gently to blend flavors.',
                'Serve at the appropriate temperature and enjoy.',
            ];
        }

        /* ── Recipe browser ─────────────────────────────────────────── */
        function showMealBrowser(mealType) {
            if (!allData && mealType !== 'all') {
                alert("No recipe data loaded. Add ?data=mexico-recipes.json to the URL to load a country's recipes.");
                return;
            }

            let recipes = [];
            if (mealType === 'all') {
                const cats = ['breakfast', 'lunch', 'dinner', 'desserts', 'vegetarianRecipes', 'all'];
                const seen = new Set();
                cats.forEach(cat => {
                    ((allData || {})[cat] || []).forEach(r => {
                        if (!seen.has(r.name || r.id)) { seen.add(r.name || r.id); recipes.push(r); }
                    });
                });
            } else if (mealType === 'drinks') {
                // Show drinks browser (switch to drinks tab on card)
                if (currentRecipe) switchTab('drinks');
                return;
            } else {
                recipes = (allData || {})[mealType] || [];
            }

            const grid = document.getElementById('recipeGrid');
            grid.innerHTML = recipes.length
                ? recipes.map(r => `
                    <div class="recipe-thumb" data-id="${r.id || r.name}">
                        <div style="font-size:32px;text-align:center">${getEmoji(r)}</div>
                        <div class="recipe-thumb-name">${r.name || 'Recipe'}</div>
                        <div class="recipe-thumb-meta">
                            ${r.difficulty ? `● ${r.difficulty}` : ''}
                            ${(r.prepTime || 0) + (r.cookTime || 0) ? ` · ⏱ ${(r.prepTime||0)+(r.cookTime||0)} min` : ''}
                        </div>
                        <div class="recipe-thumb-btn">VIEW RECIPE →</div>
                    </div>`).join('')
                : `<div class="empty-state">
                    <div class="empty-state-icon">🍽️</div>
                    No ${mealType} recipes loaded yet.<br>
                    Add <code>?data=mexico-recipes.json</code> to the URL.
                  </div>`;

            grid.querySelectorAll('.recipe-thumb').forEach((card, idx) => {
                card.addEventListener('click', () => renderRecipeCard(recipes[idx]));
            });

            document.getElementById('recipeBrowser').style.display = 'block';
            document.getElementById('recipeCard').style.display = currentRecipe ? '' : 'none';
        }

        /* ── Event wiring ───────────────────────────────────────────── */
        function setupEvents() {
            // Meal type filter pills
            document.querySelectorAll('.meal-pill').forEach(pill => {
                pill.addEventListener('click', () => {
                    document.querySelectorAll('.meal-pill').forEach(p => p.classList.remove('active'));
                    pill.classList.add('active');
                    activeMealType = pill.dataset.meal;
                    if (activeMealType === 'all' && currentRecipe) {
                        document.getElementById('recipeBrowser').style.display = 'none';
                        document.getElementById('recipeCard').style.display = '';
                    } else {
                        showMealBrowser(activeMealType);
                    }
                });
            });

            // Back button
            document.getElementById('browseBack').addEventListener('click', () => {
                document.getElementById('recipeBrowser').style.display = 'none';
                document.getElementById('recipeCard').style.display = currentRecipe ? '' : 'none';
                document.querySelectorAll('.meal-pill').forEach(p => p.classList.toggle('active', p.dataset.meal === 'all'));
                activeMealType = 'all';
            });

            // View tabs
            document.querySelectorAll('.view-tab').forEach(tab => {
                tab.addEventListener('click', () => switchTab(tab.dataset.view));
            });

            // Step mode toggle
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const mode = btn.dataset.mode;
                    document.getElementById('stepList').style.display = mode === 'list' ? 'block' : 'none';
                    document.getElementById('carouselContainer').style.display = mode === 'carousel' ? 'block' : 'none';
                    if (mode === 'carousel') gotoStep(carouselStep);
                });
            });

            // Carousel nav
            document.getElementById('prevBtn').addEventListener('click', () => {
                document.querySelectorAll('.flip-card')[carouselStep]?.classList.remove('flipped');
                gotoStep(carouselStep - 1);
            });
            document.getElementById('nextBtn').addEventListener('click', () => {
                document.querySelectorAll('.flip-card')[carouselStep]?.classList.remove('flipped');
                gotoStep(carouselStep + 1);
            });

            // Adapt buttons
            document.querySelectorAll('.adapt-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const key = btn.dataset.adapt;
                    document.querySelectorAll('.adapt-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const rows = ADAPT[key] || [];
                    const el = document.getElementById('adaptResults');
                    el.innerHTML = rows.map(r => `
                        <div class="adapt-row">
                            <span class="adapt-row-icon">${r.icon}</span>
                            <span class="adapt-row-text">${r.text}</span>
                        </div>`).join('');
                    el.classList.add('show');
                });
            });

            // Start Cooking
            document.getElementById('startBtn').addEventListener('click', () => {
                switchTab('instructions');
                document.getElementById('view-instructions').scrollIntoView({ behavior: 'smooth', block: 'start' });
            });

            // Save Recipe
            document.getElementById('saveBtn').addEventListener('click', () => {
                if (!currentRecipe) return;
                const btn = document.getElementById('saveBtn');
                const idx = savedRecipes.findIndex(r => r.name === currentRecipe.name);
                if (idx === -1) {
                    savedRecipes.push(currentRecipe);
                    btn.textContent = '♥ SAVED';
                    btn.classList.add('saved');
                } else {
                    savedRecipes.splice(idx, 1);
                    btn.textContent = '♡ SAVE';
                    btn.classList.remove('saved');
                }
                localStorage.setItem('dig_in_saved', JSON.stringify(savedRecipes));
            });

            // Remix drinks
            document.getElementById('remixBtn').addEventListener('click', () => {
                drinkSeed = Date.now() + Math.random() * 9999;
                if (currentRecipe) renderDrinksTab(currentRecipe);
            });

            // Drink modal close
            document.getElementById('drinkModalClose').addEventListener('click', () => {
                document.getElementById('drinkModal').style.display = 'none';
            });
            document.getElementById('drinkModal').addEventListener('click', (e) => {
                if (e.target.id === 'drinkModal') document.getElementById('drinkModal').style.display = 'none';
            });
        }

        function gotoStep(idx) {
            const cards = document.querySelectorAll('.flip-card');
            const total = cards.length;
            if (!total) return;
            carouselStep = Math.max(0, Math.min(idx, total - 1));
            document.getElementById('carouselTrack').style.transform = `translateX(-${carouselStep * 100}%)`;
            document.getElementById('stepIndicator').textContent = `${carouselStep + 1} / ${total}`;
            document.getElementById('prevBtn').disabled = carouselStep === 0;
            document.getElementById('nextBtn').disabled = carouselStep === total - 1;
        }

        /* ── Boot ───────────────────────────────────────────────────── */
        async function boot() {
            setupEvents();
            await loadData();

            // If we have a session recipe already rendered above, we're done
            if (currentRecipe) return;

            // Otherwise show the browser with all available recipes
            if (allData) {
                showMealBrowser('all');
            }
        }

        boot();
    </script>
</body>
</html>
