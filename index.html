<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Pixel-art NYC food app — discover local bodegas and grocery stores, cook from your pantry, earn coins and badges." />
    <meta name="theme-color" content="#f4a924" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dig In" />
    <!-- The two web fonts are self-hosted (src/styles/fonts.css); preload the Latin
         files so text paints in them the first time instead of swapping later. -->
    <link rel="preload" href="/fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dotgothic16-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <!-- The manifest <link> is injected automatically by vite-plugin-pwa
         (→ /manifest.webmanifest). A manual /manifest.json link here was wrong:
         that file doesn't exist, so it 404'd in prod and was served as HTML in
         dev, which the browser reported as "Manifest: Syntax error". -->
    <title>Dig In — Pixel Recipe Generator</title>
  </head>
  <body style="background-color:#F3EADA;margin:0">
    <div id="root"></div>
    <script type="module" src="/src/app/main.jsx"></script>
  </body>
</html>
