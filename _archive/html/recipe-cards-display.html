<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIG-IN · Recipe Cards</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DotGothic16', Arial, sans-serif;
            background: #8D7B9E;
            color: #2d1b13;
            min-height: 100vh;
            padding: 24px 20px 48px;
        }

        /* ── Page header ────────────────────────────────────────────── */
        .page-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .page-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 22px;
            color: #fff;
            text-shadow: 3px 3px 0 #4A2E25;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .page-sub {
            font-size: 13px;
            color: rgba(255,255,255,0.75);
        }

        /* ── Filter bar ─────────────────────────────────────────────── */
        .filter-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 28px;
        }
        .filter-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: rgba(255,255,255,0.7);
            letter-spacing: 1px;
            margin-right: 4px;
        }
        .filter-pill {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            padding: 9px 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 20px;
            background: rgba(255,255,255,0.15);
            color: #fff;
            cursor: pointer;
            transition: background .15s, border-color .15s;
        }
        .filter-pill:hover { background: rgba(255,255,255,0.25); }
        .filter-pill.active {
            background: #FAEBD7;
            color: #6B6FBB;
            border-color: #FAEBD7;
        }

        /* ── Recipe count ───────────────────────────────────────────── */
        .recipe-count {
            text-align: center;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        /* ── Cards grid ─────────────────────────────────────────────── */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 28px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ── Recipe card ────────────────────────────────────────────── */
        .recipe-card {
            background: #FAEBD7;
            border: 2px solid rgba(107,70,60,0.35);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 6px 24px rgba(0,0,0,0.22);
            transition: transform .18s, box-shadow .18s;
            display: flex;
            flex-direction: column;
        }
        .recipe-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 40px rgba(0,0,0,0.3);
        }

        /* Card header — purple gradient */
        .rc-header {
            background: linear-gradient(135deg, #6B6FBB 0%, #585B9E 100%);
            padding: 22px 22px 36px;
            position: relative;
        }
        .rc-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 13px;
            color: #fff;
            line-height: 1.6;
            margin-bottom: 6px;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
        }
        .rc-subtitle {
            font-size: 12px;
            color: rgba(255,255,255,0.8);
            font-style: italic;
            margin-bottom: 14px;
        }
        .rc-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .rc-tag {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 5px 10px;
            border-radius: 6px;
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            color: #fff;
            letter-spacing: 0.5px;
        }
        .rc-hit-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            padding: 4px 10px;
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            color: #fff;
        }

        /* Card body — beige, overlaps header */
        .rc-body {
            background: #FAEBD7;
            border-radius: 18px 18px 0 0;
            margin-top: -18px;
            padding: 20px 22px 22px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.06);
        }

        .rc-description {
            font-size: 13px;
            color: rgba(45,27,19,0.75);
            line-height: 1.6;
        }

        /* Stats 2×2 grid */
        .rc-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .rc-stat {
            background: #fff;
            border: 1px solid rgba(212,188,165,0.5);
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 64px;
            justify-content: space-between;
        }
        .rc-stat-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            color: #6B6FBB;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .rc-stat-value {
            font-size: 13px;
            font-weight: 700;
            color: #2d1b13;
        }

        /* Ingredients */
        .rc-section {
            background: #fff;
            border: 1px solid rgba(212,188,165,0.5);
            border-radius: 12px;
            padding: 14px 16px;
        }
        .rc-section-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: #6B6FBB;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }
        .rc-ingredients {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px 12px;
        }
        .rc-ingredient {
            display: flex;
            align-items: flex-start;
            gap: 7px;
            font-size: 12px;
            color: #2d1b13;
            line-height: 1.4;
        }
        .rc-ingredient-dot {
            color: #6B6FBB;
            font-size: 16px;
            line-height: 1;
            flex-shrink: 0;
            margin-top: -1px;
        }
        .rc-ing-more {
            font-size: 11px;
            color: #6B6FBB;
            font-style: italic;
            margin-top: 6px;
            cursor: pointer;
        }

        /* Drink pairings */
        .rc-drinks-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .rc-drink-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border: 2px solid #6B463C;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: #2d1b13;
            background: transparent;
            cursor: pointer;
            transition: background .15s;
        }
        .rc-drink-chip:hover { background: rgba(107,70,60,0.08); }

        /* Actions */
        .rc-actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }
        .rc-btn-steps {
            flex: 1;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 13px 10px;
            background: #6B6FBB;
            color: #fff;
            border: none;
            border-bottom: 3px solid #4A4D80;
            border-radius: 10px;
            cursor: pointer;
            transition: background .15s, transform .08s;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .rc-btn-steps:hover { background: #585B9E; }
        .rc-btn-steps:active { transform: translateY(2px); border-bottom-width: 1px; }
        .rc-btn-drinks {
            flex: 2;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 13px 10px;
            background: #4A2E25;
            color: #fff;
            border: none;
            border-bottom: 3px solid #2D1B13;
            border-radius: 10px;
            cursor: pointer;
            transition: background .15s, transform .08s;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .rc-btn-drinks:hover { background: #3A241D; }
        .rc-btn-drinks:active { transform: translateY(2px); border-bottom-width: 1px; }
        .rc-btn-heart {
            width: 46px;
            height: 46px;
            background: #fff;
            border: 1px solid rgba(212,188,165,0.6);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: background .15s, transform .08s;
            flex-shrink: 0;
        }
        .rc-btn-heart:hover { background: #fff0e0; }
        .rc-btn-heart.liked { color: #e03050; }

        /* ── Empty state ─────────────────────────────────────────────── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.6);
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            line-height: 2;
            grid-column: 1 / -1;
        }
        .empty-icon { font-size: 40px; display: block; margin-bottom: 16px; }

        /* ── Steps modal ─────────────────────────────────────────────── */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.72);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px;
        }
        .modal-box {
            background: #FAEBD7;
            border: 3px solid #6B6FBB;
            border-radius: 18px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.4);
            max-width: 520px; width: 100%;
            max-height: 88vh; overflow-y: auto;
            display: flex; flex-direction: column;
        }
        .modal-head {
            background: linear-gradient(135deg, #6B6FBB 0%, #585B9E 100%);
            padding: 18px 22px;
            display: flex; align-items: center; gap: 12px;
            border-radius: 15px 15px 0 0;
            flex-shrink: 0;
        }
        .modal-head-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: #fff;
            flex: 1;
            line-height: 1.6;
        }
        .modal-close {
            background: rgba(255,255,255,0.2);
            border: none; color: #fff;
            font-size: 20px; cursor: pointer;
            width: 36px; height: 36px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .modal-close:hover { background: rgba(255,255,255,0.3); }
        .modal-body { padding: 22px; }

        /* Mode toggle */
        .mode-bar {
            display: flex; gap: 8px;
            margin-bottom: 16px;
            padding: 10px 12px;
            background: #fff;
            border: 2px solid rgba(212,188,165,0.5);
            border-left: 4px solid #6B6FBB;
            border-radius: 10px;
        }
        .mode-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px; padding: 8px 14px;
            border: 2px solid #6B6FBB;
            border-radius: 8px;
            background: #FAEBD7; color: #6B6FBB;
            cursor: pointer;
        }
        .mode-btn.active { background: #6B6FBB; color: #fff; }

        /* Step list */
        .step-list { display: flex; flex-direction: column; gap: 10px; }
        .step-item {
            display: flex; gap: 12px; align-items: flex-start;
            padding: 12px 14px;
            background: #fff; border: 1px solid rgba(212,188,165,0.5);
            border-radius: 10px; cursor: pointer; user-select: none;
        }
        .step-item.done .step-text { text-decoration: line-through; color: #b09090; }
        .step-num {
            flex-shrink: 0; width: 26px; height: 26px;
            background: #6B6FBB; color: #fff;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Press Start 2P', monospace; font-size: 7px;
            margin-top: 1px;
        }
        .step-text { font-size: 13px; line-height: 1.6; color: #2d1b13; flex: 1; }

        /* Carousel */
        .carousel-viewport { overflow: hidden; border-radius: 12px; margin-bottom: 12px; }
        .carousel-track { display: flex; transition: transform 0.3s cubic-bezier(.4,0,.2,1); }
        .flip-card {
            min-width: 100%; flex-shrink: 0;
            perspective: 900px; height: 280px; cursor: pointer;
        }
        .flip-inner {
            position: relative; width: 100%; height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.45s cubic-bezier(.4,0,.2,1);
        }
        .flip-card.flipped .flip-inner { transform: rotateY(180deg); }
        .flip-front, .flip-back {
            position: absolute; inset: 0;
            backface-visibility: hidden; -webkit-backface-visibility: hidden;
            border: 3px solid #6B6FBB; border-radius: 12px;
            padding: 18px 22px;
            display: flex; flex-direction: column;
        }
        .flip-front { background: #fff; gap: 10px; }
        .flip-back {
            background: #6B6FBB; color: #fff;
            transform: rotateY(180deg);
            align-items: center; justify-content: center;
            text-align: center; gap: 10px;
        }
        .flip-step-header {
            font-family: 'Press Start 2P', monospace;
            font-size: 8px; color: #6B6FBB; letter-spacing: 1px;
        }
        .flip-step-text { font-size: 13px; line-height: 1.6; color: #2d1b13; flex: 1; }
        .flip-hint {
            font-family: 'Press Start 2P', monospace;
            font-size: 5px; color: #6B6FBB; text-align: right; margin-top: auto;
        }
        .flip-stage-emoji { font-size: 56px; line-height: 1; }
        .flip-stage-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 8px; color: rgba(255,255,255,0.8); letter-spacing: 1px;
        }
        .flip-visual-text { font-size: 12px; color: rgba(255,255,255,0.7); line-height: 1.6; max-width: 220px; }
        .carousel-nav {
            display: flex; align-items: center; justify-content: center;
            gap: 14px; margin-top: 10px;
        }
        .carousel-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px; padding: 9px 16px;
            background: #6B6FBB; color: #fff;
            border: none; border-bottom: 2px solid #4A4D80; border-radius: 8px;
            cursor: pointer;
        }
        .carousel-btn:disabled { background: #ccc; color: #999; cursor: default; border-bottom-color: #bbb; }
        .carousel-indicator {
            font-family: 'Press Start 2P', monospace;
            font-size: 8px; color: #6B6FBB; min-width: 56px; text-align: center;
        }

        /* ── Drinks modal ─────────────────────────────────────────────── */
        .drinks-modal-box {
            background: #FAEBD7;
            border: 3px solid #4A2E25;
            border-radius: 18px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.4);
            max-width: 560px; width: 100%;
            max-height: 88vh; overflow-y: auto;
        }
        .drinks-modal-head {
            background: linear-gradient(135deg, #4A2E25 0%, #2D1B13 100%);
            padding: 18px 22px;
            display: flex; align-items: center; gap: 12px;
            border-radius: 15px 15px 0 0;
        }
        .drinks-modal-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px; color: #FAEBD7; flex: 1; line-height: 1.6;
        }
        .drinks-cat-bar {
            display: flex; flex-wrap: wrap; gap: 6px;
            padding: 16px 22px 0;
        }
        .drinks-cat-pill {
            font-family: 'Press Start 2P', monospace;
            font-size: 6px; padding: 6px 12px;
            border: 2px solid #d4bca5; border-radius: 20px;
            background: #fff; color: #6B463C;
            cursor: pointer;
        }
        .drinks-cat-pill.active { background: #6B463C; color: #fff; border-color: #6B463C; }
        .drinks-flavor-strip {
            display: flex; flex-wrap: wrap; gap: 6px;
            padding: 12px 22px 0;
        }
        .flavor-tag {
            display: inline-block; background: #6B6FBB; color: #fff;
            border-radius: 20px; padding: 4px 12px;
            font-family: 'Press Start 2P', monospace; font-size: 6px;
        }
        .drinks-grid-modal {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 14px 22px 22px;
        }
        .drink-modal-card {
            background: #fff;
            border: 2px solid #4A2E25;
            border-radius: 10px; overflow: hidden;
            cursor: pointer; transition: transform .1s;
        }
        .drink-modal-card:hover { transform: translateY(-2px); }
        .drink-modal-card.featured { border-color: #f4a924; }
        .dmc-head {
            background: #4A2E25; color: #FAEBD7;
            padding: 8px 12px;
            display: flex; align-items: center; gap: 8px;
        }
        .drink-modal-card.featured .dmc-head { background: #6B463C; }
        .dmc-name {
            font-family: 'Press Start 2P', monospace;
            font-size: 6px; line-height: 1.5; flex: 1;
        }
        .dmc-body { padding: 8px 12px; font-size: 11px; color: #555; line-height: 1.4; }
        .dmc-price {
            padding: 0 12px 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: 7px; color: #6B6FBB;
        }
        .drinks-remix-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px; padding: 10px 16px;
            margin: 0 22px 20px;
            background: rgba(107,70,60,0.1); color: #4A2E25;
            border: 2px solid #4A2E25; border-radius: 8px;
            cursor: pointer; display: block;
        }
        .drinks-remix-btn:hover { background: rgba(107,70,60,0.2); }

        /* Drink detail modal */
        .drink-detail-box {
            background: #fff;
            border: 3px solid #4A2E25;
            border-radius: 18px;
            max-width: 440px; width: 100%;
            max-height: 80vh; overflow-y: auto;
        }
        .drink-detail-head {
            background: #4A2E25; color: #FAEBD7;
            padding: 16px 20px;
            display: flex; align-items: center; gap: 12px;
            border-radius: 15px 15px 0 0;
        }
        .drink-detail-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px; flex: 1; line-height: 1.5;
        }
        .drink-detail-body { padding: 18px 20px; }
        .drink-detail-desc { font-size: 13px; color: #555; line-height: 1.6; margin-bottom: 14px; }
        .drink-detail-steps { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .drink-detail-steps li {
            display: flex; gap: 10px; align-items: flex-start;
            padding: 9px 12px; background: #FAEBD7;
            border: 1px solid rgba(107,70,60,0.25);
            border-radius: 8px; font-size: 13px; line-height: 1.5;
        }
        .drink-step-num {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px; color: #6B6FBB; min-width: 20px; padding-top: 2px;
        }
        .drink-detail-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
        .drink-detail-tag {
            font-size: 10px; padding: 3px 10px;
            background: #FAEBD7; color: #6B463C;
            border: 1px solid rgba(107,70,60,0.3); border-radius: 20px;
        }
        .drink-detail-price {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px; color: #6B6FBB; margin-top: 10px;
        }

        @media (max-width: 500px) {
            .cards-grid { grid-template-columns: 1fr; }
            .rc-ingredients { grid-template-columns: 1fr; }
            .drinks-grid-modal { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useRef } = React;

        /* ── Constants & Helpers ─────────────────────────────────────── */
        const COUNTRY_FILES = [
            'algeria-authentic-recipes.json',
            'afghanistan-authentic-recipes.json',
            'albania-authentic-recipes.json',
            'italy-authentic-recipes.json',
        ];
        const MEAL_KEYS = ['breakfast', 'lunch', 'dinner', 'snacks', 'desserts'];

        const EMOJI_MAP = {
            pasta: '🍝', soup: '🍲', stew: '🍲', rice: '🍚', bread: '🍞',
            cake: '🎂', cookie: '🍪', pie: '🥧', salad: '🥗',
            chicken: '🍗', beef: '🥩', fish: '🐟', shrimp: '🍤',
            curry: '🍛', noodle: '🍜', ramen: '🍜', taco: '🌮',
            burger: '🍔', sandwich: '🥪', default: '🍽️'
        };

        const FLAVOR_KW = {
            spicy:  ['spicy','chili','jalapeño','pepper','hot sauce','cayenne'],
            sweet:  ['sugar','honey','maple','chocolate','vanilla','fruit','mango','berry'],
            savory: ['soy sauce','miso','umami','mushroom','broth'],
            rich:   ['butter','cream','cheese','beef','pork','lamb','coconut milk'],
            light:  ['salad','lemon','lime','citrus','herb','mint','cucumber'],
            earthy: ['lentil','bean','root','beet','squash','potato'],
            smoky:  ['smoked','barbecue','chipotle','paprika','grill','roasted'],
            tangy:  ['vinegar','pickle','yogurt','tamarind','fermented'],
        };

        const FLAVOR_DRINK = {
            spicy:  ['cooling','refreshing','milk-based','fruity','sweet'],
            sweet:  ['bitter','coffee','tea','light','floral'],
            savory: ['acidic','sparkling','light','citrus'],
            rich:   ['acidic','sparkling','bitter','coffee'],
            light:  ['floral','tea','citrus','sparkling'],
            earthy: ['coffee','roasted','tea','spiced'],
            smoky:  ['bold','roasted','malty'],
            tangy:  ['sweet','fruity','sparkling'],
        };

        const STAGE_LABELS = ['PREP', 'BUILDING', 'COOKING', 'FINISHING', 'PLATING'];

        function mergeCountryData(dataObjects) {
            const merged = { breakfast: [], lunch: [], dinner: [], desserts: [] };
            for (const d of dataObjects) {
                if (!d) continue;
                merged.breakfast.push(...(d.breakfast || []));
                merged.lunch.push(...(d.lunch || []));
                merged.dinner.push(...(d.dinner || []));
                merged.desserts.push(...(d.desserts || d.snacks || []));
            }
            return merged;
        }

        function hasRecipes(d) {
            return d && MEAL_KEYS.some(k => (d[k] || []).length > 0);
        }

        function getEmoji(recipe) {
            const text = ((recipe.name || '') + ' ' + (recipe.cuisine || '')).toLowerCase();
            for (const [k, v] of Object.entries(EMOJI_MAP)) {
                if (k !== 'default' && text.includes(k)) return v;
            }
            return EMOJI_MAP.default;
        }

        function detectFlavors(recipe) {
            const text = [recipe.name || '', ...(recipe.ingredients || []), ...(recipe.instructions || [])].join(' ').toLowerCase();
            return Object.entries(FLAVOR_KW).filter(([, kws]) => kws.some(kw => text.includes(kw))).map(([f]) => f);
        }

        function scoreDrink(drink, flavors, seed) {
            const tags = (drink.pairingTags || drink.flavorProfile || []).map(t => t.toLowerCase());
            const desc = (drink.description || '').toLowerCase();
            let score = 0;
            flavors.forEach(f => {
                (FLAVOR_DRINK[f] || []).forEach(t => { if (tags.includes(t) || desc.includes(t)) score += 2; });
            });
            score += (seed * 7 + (drink.name.charCodeAt(0) || 0)) % 5 * 0.1;
            return score;
        }

        function generateDrinkSteps(drink) {
            const name = drink.name.toLowerCase();
            const isIced = drink.temperature === 'cold' || name.includes('iced') || name.includes('cold');
            const isEspresso = name.includes('espresso') || name.includes('americano') || name.includes('latte') || name.includes('cappuccino');
            const isTea = name.includes('tea') || name.includes('matcha') || name.includes('chai');
            const isJuice = name.includes('juice') || name.includes('smoothie');
            const isChocolate = name.includes('chocolate') || name.includes('mocha') || name.includes('cocoa');
            if (isEspresso && !isIced) return ['Pull a fresh espresso shot, about 25–30 seconds.', 'Steam milk to 65°C with silky microfoam.', `Combine in the correct ratio for a ${drink.name}.`, 'Serve immediately while hot.'];
            if (isEspresso && isIced) return ['Pull 1–2 espresso shots and cool for 1 minute.', 'Fill a glass with ice.', 'Pour espresso over ice.', name.includes('latte') ? 'Add cold milk to taste.' : 'Add cold water or milk and serve.'];
            if (isTea) return ['Heat water to the correct temperature.', `Steep ${drink.name} for 2–4 minutes.`, isIced ? 'Pour over ice and sweeten if desired.' : 'Remove tea and serve hot.'];
            if (isJuice) return ['Gather and wash ingredients.', 'Juice or blend until smooth.', 'Strain if desired, pour over ice.', 'Serve immediately.'];
            if (isChocolate) return ['Heat milk until steaming.', 'Whisk in cocoa powder or melted chocolate.', 'Sweeten to taste.', 'Top with whipped cream and serve.'];
            return [`Prepare all ingredients for ${drink.name}.`, 'Combine in the correct proportions.', 'Stir or shake gently.', 'Serve at the appropriate temperature.'];
        }

        /* ── StepItem ───────────────────────────────────────────────── */
        function StepItem({ step, index }) {
            const [done, setDone] = useState(false);
            return (
                <div className={`step-item${done ? ' done' : ''}`} onClick={() => setDone(!done)}>
                    <div className="step-num">{index + 1}</div>
                    <div className="step-text">{step}</div>
                </div>
            );
        }

        /* ── FlipCard ───────────────────────────────────────────────── */
        function FlipCard({ step, index, total, recipe, isActive }) {
            const [flipped, setFlipped] = useState(false);

            useEffect(() => {
                if (!isActive) setFlipped(false);
            }, [isActive]);

            const ratio = index / Math.max(total - 1, 1);
            const stage = STAGE_LABELS[Math.min(Math.floor(ratio * STAGE_LABELS.length), STAGE_LABELS.length - 1)];
            const emoji = getEmoji(recipe);

            return (
                <div className={`flip-card${flipped ? ' flipped' : ''}`} onClick={() => setFlipped(!flipped)}>
                    <div className="flip-inner">
                        <div className="flip-front">
                            <div className="flip-step-header">STEP {index + 1} OF {total}</div>
                            <div className="flip-step-text">{step}</div>
                            <div className="flip-hint">👆 TAP TO FLIP</div>
                        </div>
                        <div className="flip-back">
                            <div className="flip-stage-emoji">{emoji}</div>
                            <div className="flip-stage-label">{stage}</div>
                            <div className="flip-visual-text">You're in the {stage.toLowerCase()} phase — keep going!</div>
                        </div>
                    </div>
                </div>
            );
        }

        /* ── StepsModal ─────────────────────────────────────────────── */
        function StepsModal({ recipe, onClose }) {
            const [mode, setMode] = useState('list');
            const [carouselStep, setCarouselStep] = useState(0);
            const steps = recipe.instructions || recipe.steps || [];

            useEffect(() => {
                const handler = (e) => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', handler);
                return () => window.removeEventListener('keydown', handler);
            }, [onClose]);

            const gotoStep = (idx) => {
                setCarouselStep(Math.max(0, Math.min(idx, steps.length - 1)));
            };

            return (
                <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
                    <div className="modal-box">
                        <div className="modal-head">
                            <div className="modal-head-title">{recipe.name || 'Steps'}</div>
                            <button className="modal-close" onClick={onClose}>✕</button>
                        </div>
                        <div className="modal-body">
                            <div className="mode-bar">
                                <button className={`mode-btn${mode === 'list' ? ' active' : ''}`} onClick={() => setMode('list')}>☰ LIST</button>
                                <button className={`mode-btn${mode === 'carousel' ? ' active' : ''}`} onClick={() => setMode('carousel')}>⧉ CAROUSEL</button>
                            </div>

                            {mode === 'list' ? (
                                <div className="step-list">
                                    {steps.length
                                        ? steps.map((s, i) => <StepItem key={i} step={s} index={i} />)
                                        : <p style={{color:'#999',fontSize:'13px'}}>No steps available.</p>
                                    }
                                </div>
                            ) : (
                                <div>
                                    <div className="carousel-viewport">
                                        <div className="carousel-track" style={{transform: `translateX(-${carouselStep * 100}%)`}}>
                                            {steps.map((s, i) => (
                                                <FlipCard
                                                    key={i}
                                                    step={s}
                                                    index={i}
                                                    total={steps.length}
                                                    recipe={recipe}
                                                    isActive={i === carouselStep}
                                                />
                                            ))}
                                        </div>
                                    </div>
                                    <div className="carousel-nav">
                                        <button className="carousel-btn" disabled={carouselStep === 0} onClick={() => gotoStep(carouselStep - 1)}>← PREV</button>
                                        <span className="carousel-indicator">{carouselStep + 1} / {steps.length || 1}</span>
                                        <button className="carousel-btn" disabled={carouselStep >= steps.length - 1} onClick={() => gotoStep(carouselStep + 1)}>NEXT →</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        /* ── DrinkDetailModal ───────────────────────────────────────── */
        function DrinkDetailModal({ drink, onClose }) {
            const steps = generateDrinkSteps(drink);
            const tags = [...(drink.flavorProfile || []), ...(drink.pairingTags || [])].slice(0, 6);

            useEffect(() => {
                const handler = (e) => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', handler);
                return () => window.removeEventListener('keydown', handler);
            }, [onClose]);

            return (
                <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
                    <div className="drink-detail-box">
                        <div className="drink-detail-head">
                            <span style={{fontSize:'22px'}}>{drink.emoji || '🥤'}</span>
                            <div className="drink-detail-title">{drink.name}</div>
                            <button className="modal-close" onClick={onClose}>✕</button>
                        </div>
                        <div className="drink-detail-body">
                            <p className="drink-detail-desc">{drink.description || ''}</p>
                            <ol className="drink-detail-steps">
                                {steps.map((s, i) => (
                                    <li key={i}>
                                        <span className="drink-step-num">{i + 1}.</span>
                                        <span>{s}</span>
                                    </li>
                                ))}
                            </ol>
                            <div className="drink-detail-tags">
                                {tags.map(t => <span key={t} className="drink-detail-tag">{t}</span>)}
                            </div>
                            {drink.price && <div className="drink-detail-price">${drink.price.toFixed(2)}</div>}
                        </div>
                    </div>
                </div>
            );
        }

        /* ── DrinksModal ────────────────────────────────────────────── */
        function DrinksModal({ recipe, drinksData, onClose, onDrinkClick }) {
            const [activeCat, setActiveCat] = useState('all');
            const [drinkSeed, setDrinkSeed] = useState(Date.now());

            useEffect(() => {
                const handler = (e) => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', handler);
                return () => window.removeEventListener('keydown', handler);
            }, [onClose]);

            const flavors = detectFlavors(recipe);
            const cats = [
                { id: 'all', label: '✦ ALL' },
                ...(drinksData?.drinkCategories || []).map(c => ({ id: c.id, label: (c.emoji || '') + ' ' + c.label }))
            ];

            let drinks = (drinksData?.drinks || []).filter(d => d.available !== false);
            if (activeCat !== 'all') {
                drinks = drinks.filter(d =>
                    (d.category || d.section || '') === activeCat || (d.categories || []).includes(activeCat)
                );
            }
            drinks = drinks
                .map(d => ({ ...d, _score: scoreDrink(d, flavors, drinkSeed) }))
                .sort((a, b) => b._score - a._score)
                .slice(0, 9);

            return (
                <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
                    <div className="drinks-modal-box">
                        <div className="drinks-modal-head">
                            <div className="drinks-modal-title">☕ DRINKS · {recipe.name}</div>
                            <button className="modal-close" onClick={onClose}>✕</button>
                        </div>

                        <div className="drinks-flavor-strip">
                            {flavors.length
                                ? flavors.map(f => <span key={f} className="flavor-tag">{f.toUpperCase()}</span>)
                                : <span style={{fontSize:'12px',color:'rgba(250,235,215,0.7)'}}>Neutral — all drinks pair well</span>
                            }
                        </div>

                        <div className="drinks-cat-bar">
                            {cats.map(c => (
                                <button
                                    key={c.id}
                                    className={`drinks-cat-pill${c.id === activeCat ? ' active' : ''}`}
                                    onClick={() => setActiveCat(c.id)}
                                >
                                    {c.label.toUpperCase()}
                                </button>
                            ))}
                        </div>

                        <div className="drinks-grid-modal">
                            {drinks.length ? drinks.map(d => (
                                <div
                                    key={d.id}
                                    className={`drink-modal-card${d.featured ? ' featured' : ''}`}
                                    onClick={() => onDrinkClick(d)}
                                >
                                    <div className="dmc-head">
                                        <span style={{fontSize:'16px'}}>{d.emoji || '🥤'}</span>
                                        <span className="dmc-name">{d.name}</span>
                                        <span style={{fontSize:'10px'}}>{d.temperature === 'hot' ? '☕' : d.temperature === 'cold' ? '🧊' : ''}</span>
                                    </div>
                                    <div className="dmc-body">{d.description || ''}</div>
                                    {d.price && <div className="dmc-price">${d.price.toFixed(2)}</div>}
                                </div>
                            )) : (
                                <p style={{color:'#999',fontSize:'12px',padding:'10px'}}>No drinks match this filter.</p>
                            )}
                        </div>

                        <button className="drinks-remix-btn" onClick={() => setDrinkSeed(Date.now() + Math.random() * 9999)}>
                            🔀 Remix Pairings
                        </button>
                    </div>
                </div>
            );
        }

        /* ── RecipeCard ─────────────────────────────────────────────── */
        function RecipeCard({ recipe, drinksData, hits, savedRecipes, onHit, onSave, onStepsClick, onAllDrinksClick, onDrinkChipClick }) {
            const saved = savedRecipes.some(r => r.name === recipe.name);
            const h = hits[recipe.id || recipe.name] || 0;
            const ings = recipe.ingredients || [];
            const steps = recipe.instructions || recipe.steps || [];
            const flavors = detectFlavors(recipe);
            const totalTime = (recipe.prepTime || 0) + (recipe.cookTime || 0);
            const emoji = getEmoji(recipe);

            const cardSeed = useRef(Date.now()).current;
            const previewDrinks = drinksData
                ? (drinksData.drinks || [])
                    .map(d => ({ ...d, _score: scoreDrink(d, flavors, cardSeed) }))
                    .sort((a, b) => b._score - a._score)
                    .slice(0, 3)
                : [];

            return (
                <div className="recipe-card">
                    <div className="rc-header">
                        {h > 0 && <div className="rc-hit-badge">🔥 {h} view{h !== 1 ? 's' : ''}</div>}
                        <div className="rc-title">{recipe.name || 'Recipe'}</div>
                        <div className="rc-subtitle">{recipe.country || recipe.cuisine || ''}</div>
                        <div className="rc-tags"> 
                            {recipe.difficulty && <span className="rc-tag">● {recipe.difficulty}</span>}
                            {totalTime > 0 && <span className="rc-tag">⏱ {totalTime} MIN</span>}
                            {recipe.servings && <span className="rc-tag">🍽 {recipe.servings}</span>}
                            {steps.length > 0 && <span className="rc-tag">📋 {steps.length} STEPS</span>}
                            {emoji !== '🍽️' && <span className="rc-tag">{emoji}</span>}
                        </div>
                    </div>

                    <div className="rc-body">
                        {recipe.description && <p className="rc-description">{recipe.description}</p>}

                        <div className="rc-stats">
                            <div className="rc-stat">
                                <div className="rc-stat-label">Prep</div>
                                <div className="rc-stat-value">{recipe.prepTime ? recipe.prepTime + ' min' : '—'}</div>
                            </div>
                            <div className="rc-stat">
                                <div className="rc-stat-label">Cook</div>
                                <div className="rc-stat-value">{recipe.cookTime ? recipe.cookTime + ' min' : '—'}</div>
                            </div>
                            <div className="rc-stat">
                                <div className="rc-stat-label">Difficulty</div>
                                <div className="rc-stat-value">{recipe.difficulty || '—'}</div>
                            </div>
                            <div className="rc-stat">
                                <div className="rc-stat-label">Steps</div>
                                <div className="rc-stat-value">{steps.length || '—'}</div>
                            </div>
                        </div>

                        {ings.length > 0 && (
                            <div className="rc-section">
                                <div className="rc-section-title">Key Ingredients</div>
                                <div className="rc-ingredients">
                                    {ings.slice(0, 6).map((ing, i) => (
                                        <div key={i} className="rc-ingredient">
                                            <span className="rc-ingredient-dot">•</span>
                                            <span>{typeof ing === 'object' ? ing.text || ing.name : ing}</span>
                                        </div>
                                    ))}
                                </div>
                                {ings.length > 6 && <div className="rc-ing-more">+ {ings.length - 6} more ingredients</div>}
                            </div>
                        )}

                        {previewDrinks.length > 0 && (
                            <div className="rc-section">
                                <div className="rc-section-title">☕ Pairs With</div>
                                {flavors.length > 0 && (
                                    <div style={{display:'flex',flexWrap:'wrap',gap:'4px',marginBottom:'10px'}}>
                                        {flavors.map(f => (
                                            <span key={f} style={{background:'#6B6FBB',color:'#fff',borderRadius:'20px',padding:'3px 9px',fontSize:'10px'}}>{f}</span>
                                        ))}
                                    </div>
                                )}
                                <div className="rc-drinks-row">
                                    {previewDrinks.map(d => (
                                        <button key={d.id} className="rc-drink-chip" onClick={() => onDrinkChipClick(d)}>
                                            {d.emoji || '☕'} {d.name}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        <div className="rc-actions">
                            <button className="rc-btn-steps" onClick={() => { onHit(recipe); onStepsClick(recipe); }}>
                                VIEW STEPS ▾
                            </button>
                            <button className="rc-btn-drinks" onClick={() => onAllDrinksClick(recipe)}>
                                ☕ ALL DRINKS
                            </button>
                            <button className={`rc-btn-heart${saved ? ' liked' : ''}`} onClick={() => onSave(recipe)}>
                                {saved ? '♥' : '♡'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        /* ── App ────────────────────────────────────────────────────── */
        const MEAL_FILTERS = [
            { key: 'all',       label: '✦ ALL' },
            { key: 'breakfast', label: '🍳 BREAKFAST' },
            { key: 'lunch',     label: '🥗 LUNCH' },
            { key: 'dinner',    label: '🍽 DINNER' },
            { key: 'desserts',  label: '🍿 SNACKS' },
        ];

        function App() {
            const [allData, setAllData]         = useState(null);
            const [drinksData, setDrinksData]   = useState(null);
            const [loading, setLoading]         = useState(true);
            const [activeMeal, setActiveMeal]   = useState('all');
            const [hits, setHits]               = useState(() => JSON.parse(localStorage.getItem('dig_in_hits') || '{}'));
            const [saved, setSaved]             = useState(() => JSON.parse(localStorage.getItem('dig_in_saved') || '[]'));
            const [stepsRecipe, setStepsRecipe] = useState(null);
            const [drinksRecipe, setDrinksRecipe] = useState(null);
            const [drinkDetail, setDrinkDetail] = useState(null);

            useEffect(() => { boot(); }, []);

            async function boot() {
                let data = null;
                const params = new URLSearchParams(window.location.search);
                const dataFile = params.get('data');

                if (dataFile) {
                    try {
                        const res = await fetch(`data/${dataFile}`);
                        const raw = await res.json();
                        data = Object.values(raw)[0];
                    } catch(e) {}
                }

                if (!hasRecipes(data)) {
                    const fetches = await Promise.allSettled(
                        COUNTRY_FILES.map(f => fetch(`data/${f}`).then(r => r.json()).then(raw => Object.values(raw)[0]))
                    );
                    data = mergeCountryData(fetches.filter(r => r.status === 'fulfilled').map(r => r.value));
                }

                if (!hasRecipes(data)) {
                    const lsRecipes = JSON.parse(localStorage.getItem('dig_in_recipes') || '[]');
                    const sessionRecipe = JSON.parse(sessionStorage.getItem('dig_in_current_recipe') || 'null');
                    const combined = sessionRecipe ? [sessionRecipe, ...lsRecipes.filter(r => r.name !== sessionRecipe.name)] : lsRecipes;
                    if (combined.length) {
                        data = {
                            breakfast: combined.filter(r => (r.mealType || '').toLowerCase().includes('breakfast')),
                            lunch:     combined.filter(r => (r.mealType || '').toLowerCase().includes('lunch')),
                            dinner:    combined.filter(r => (r.mealType || '').toLowerCase().includes('dinner')),
                            desserts:  combined.filter(r => (r.mealType || '').toLowerCase().includes('dessert')),
                        };
                    }
                }

                setAllData(data);

                try {
                    const dRes = await fetch('data/think-coffee-menu.json');
                    setDrinksData(await dRes.json());
                } catch(e) {}

                setLoading(false);
            }

            function recordHit(recipe) {
                const key = recipe.id || recipe.name;
                const newHits = { ...hits, [key]: (hits[key] || 0) + 1 };
                setHits(newHits);
                localStorage.setItem('dig_in_hits', JSON.stringify(newHits));
            }

            function toggleSave(recipe) {
                const idx = saved.findIndex(r => r.name === recipe.name);
                const newSaved = idx === -1 ? [...saved, recipe] : saved.filter((_, i) => i !== idx);
                setSaved(newSaved);
                localStorage.setItem('dig_in_saved', JSON.stringify(newSaved));
            }

            function getRecipes() {
                if (!allData) return [];
                const getH = r => hits[r.id || r.name] || 0;
                const sort = arr => [...arr].sort((a, b) => getH(b) - getH(a));
                if (activeMeal === 'all') {
                    return sort([
                        ...(allData.breakfast || []),
                        ...(allData.lunch || []),
                        ...(allData.dinner || []),
                        ...(allData.desserts || []),
                    ]);
                }
                return sort(allData[activeMeal] || []);
            }

            const recipes = getRecipes();

            return (
                <>
                    <div className="page-header">
                        <div className="page-title">DIG-IN RECIPES</div>
                        <div className="page-sub">Explore world cuisines · click to cook</div>
                    </div>

                    <div className="filter-bar">
                        <span className="filter-label">TRENDING:</span>
                        {MEAL_FILTERS.map(f => (
                            <button
                                key={f.key}
                                className={`filter-pill${activeMeal === f.key ? ' active' : ''}`}
                                onClick={() => setActiveMeal(f.key)}
                            >
                                {f.label}
                            </button>
                        ))}
                    </div>

                    <div className="recipe-count">
                        {loading ? 'LOADING...' : `${recipes.length} RECIPE${recipes.length !== 1 ? 'S' : ''}`}
                    </div>

                    <div className="cards-grid">
                        {!loading && recipes.length === 0 && (
                            <div className="empty-state">
                                <span className="empty-icon">🍽️</span>
                                No recipes found for this filter.
                            </div>
                        )}
                        {recipes.map((recipe, i) => (
                            <RecipeCard
                                key={recipe.id || recipe.name || i}
                                recipe={recipe}
                                drinksData={drinksData}
                                hits={hits}
                                savedRecipes={saved}
                                onHit={recordHit}
                                onSave={toggleSave}
                                onStepsClick={setStepsRecipe}
                                onAllDrinksClick={setDrinksRecipe}
                                onDrinkChipClick={setDrinkDetail}
                            />
                        ))}
                    </div>

                    {stepsRecipe && (
                        <StepsModal recipe={stepsRecipe} onClose={() => setStepsRecipe(null)} />
                    )}

                    {drinksRecipe && (
                        <DrinksModal
                            recipe={drinksRecipe}
                            drinksData={drinksData}
                            onClose={() => setDrinksRecipe(null)}
                            onDrinkClick={(drink) => { setDrinksRecipe(null); setDrinkDetail(drink); }}
                        />
                    )}

                    {drinkDetail && (
                        <DrinkDetailModal drink={drinkDetail} onClose={() => setDrinkDetail(null)} />
                    )}
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
