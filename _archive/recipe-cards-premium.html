<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dig In - Premium Recipe Cards</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="analytics-tracker.js"></script>
    <script src="user-metrics-tracker.js"></script>
    <script src="market-metrics-tracker.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 2.5em;
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .header-subtitle {
            font-size: 1em;
            color: #aaa;
            margin-bottom: 30px;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        input[type="text"], select {
            padding: 10px 15px;
            border: 2px solid #ffd700;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-family: 'Arial', sans-serif;
            font-size: 0.9em;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        button {
            padding: 10px 20px;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 6px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.65em;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #ffed4e;
            transform: scale(1.05);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .recipe-card {
            background: #1a1a2e;
            border: 3px solid #c9a961;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        .recipe-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(201, 169, 97, 0.3);
            border-color: #ffd700;
        }

        .card-header {
            background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
            padding: 20px;
            border-bottom: 2px solid #c9a961;
        }

        .recipe-name {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.3em;
            color: #fff;
            margin-bottom: 8px;
        }

        .recipe-origin {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 12px;
        }

        .recipe-quick-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.8);
            flex-wrap: wrap;
            gap: 8px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-body {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .recipe-description {
            font-size: 0.85em;
            color: #bbb;
            margin-bottom: 20px;
            line-height: 1.4;
            border-bottom: 1px solid rgba(201, 169, 97, 0.3);
            padding-bottom: 15px;
        }

        .recipe-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .info-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .info-item {
            border-left: 3px solid #5a67d8;
            padding-left: 12px;
        }

        .info-label {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.65em;
            color: #5a67d8;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 0.95em;
            color: #fff;
        }

        .ingredients-section {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(201, 169, 97, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .ingredients-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.65em;
            color: #5a67d8;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ingredients-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.8em;
            color: #ccc;
        }

        .ingredients-list li {
            list-style: none;
            padding: 4px 0;
            border-bottom: 1px solid rgba(201, 169, 97, 0.2);
        }

        .ingredients-list li:before {
            content: "• ";
            color: #ffd700;
            margin-right: 6px;
        }

        .pairings-section {
            background: linear-gradient(135deg, rgba(201, 169, 97, 0.1) 0%, rgba(201, 169, 97, 0.05) 100%);
            border: 1px solid #c9a961;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .pairings-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.65em;
            color: #c9a961;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pairing-type {
            font-size: 0.7em;
            color: #999;
            font-family: 'Arial', sans-serif;
        }

        .pairing-chips {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pairing-chip {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #c9a961;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.75em;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .pairing-chip:hover {
            background: #c9a961;
            color: #000;
        }

        .pairing-icon {
            font-size: 1em;
        }

        .customization-section {
            background: rgba(90, 103, 216, 0.1);
            border: 1px solid #5a67d8;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .customization-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.65em;
            color: #5a67d8;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .remix-formats {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .remix-chip {
            background: rgba(90, 103, 216, 0.3);
            border: 1px solid #5a67d8;
            border-radius: 16px;
            padding: 4px 10px;
            font-size: 0.7em;
            color: #5a67d8;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .remix-chip:hover {
            background: #5a67d8;
            color: #fff;
        }

        .time-variants-select {
            width: 100%;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #5a67d8;
            border-radius: 4px;
            color: #fff;
            font-size: 0.8em;
            margin-bottom: 8px;
        }

        .dietary-options {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .dietary-chip {
            background: rgba(201, 169, 97, 0.2);
            border: 1px solid #c9a961;
            border-radius: 16px;
            padding: 4px 10px;
            font-size: 0.7em;
            color: #c9a961;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .dietary-chip:hover {
            background: #c9a961;
            color: #000;
        }

        .dietary-chip.active {
            background: #c9a961;
            color: #000;
            font-weight: bold;
        }

        .remix-button {
            background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
            border: 1px solid #5a67d8;
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.75em;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-top: 8px;
        }

        .remix-button:hover {
            background: linear-gradient(135deg, #6b46c1 0%, #5a67d8 100%);
            box-shadow: 0 0 15px rgba(90, 103, 216, 0.5);
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
            justify-content: space-between;
        }

        .action-btn {
            flex: 1;
            padding: 10px 12px;
            background: #3d4a99;
            border: 1px solid #5a67d8;
            color: #fff;
            border-radius: 6px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.65em;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .action-btn:hover {
            background: #5a67d8;
            box-shadow: 0 0 15px rgba(90, 103, 216, 0.5);
        }

        .secondary-btn {
            background: rgba(201, 169, 97, 0.2);
            border: 1px solid #c9a961;
            color: #c9a961;
        }

        .secondary-btn:hover {
            background: #c9a961;
            color: #000;
        }

        .favorite-btn {
            background: none;
            border: 1px solid #c9a961;
            color: #c9a961;
            width: 40px;
            padding: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .favorite-btn:hover {
            background: #c9a961;
            color: #000;
        }

        .favorite-btn.active {
            background: #ff6b6b;
            border-color: #ff6b6b;
            color: #fff;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .nav-btn {
            padding: 10px 25px;
            background: rgba(201, 169, 97, 0.2);
            border: 2px solid #c9a961;
            color: #c9a961;
            border-radius: 6px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #c9a961;
            color: #000;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .recipe-counter {
            text-align: center;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.75em;
            color: #c9a961;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }

            .recipe-info-grid {
                grid-template-columns: 1fr;
            }

            .ingredients-list {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .recipe-name {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🍽️ DIG IN</h1>
        <div class="header-subtitle">Premium Global Recipe Collection</div>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search recipes...">
        <select id="countryFilter">
            <option value="">All Countries</option>
        </select>
        <select id="categoryFilter">
            <option value="">All Categories</option>
            <option value="breakfast">Breakfast</option>
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
            <option value="snacks">Snacks</option>
            <option value="desserts">Desserts</option>
            <option value="nonAlcoholicDrinks">Non-Alcoholic Drinks</option>
            <option value="alcoholicDrinks">Alcoholic Drinks</option>
        </select>
        <button onclick="shuffleRecipes()">🎲 Shuffle</button>
        <button onclick="window.location.href='analytics-dashboard.html'" style="background: #ffd700; color: #000;">📊 Analytics</button>
        <button onclick="window.location.href='user-metrics-dashboard.html'" style="background: #9c27b0; color: #fff;">👤 User Metrics</button>
        <button onclick="window.location.href='market-metrics-dashboard.html'" style="background: #667eea; color: #fff;">🌍 Market Metrics</button>
        <button onclick="window.location.href='barcode-scanner.html'" style="background: #ff6b6b; color: #fff;">📱 Scanner</button>
    </div>

    <div class="recipe-counter" id="recipeCounter">Loading recipes...</div>

    <div class="nav-buttons">
        <button id="prevBtn" class="nav-btn">← PREV</button>
        <button id="nextBtn" class="nav-btn">NEXT →</button>
    </div>

    <div class="cards-grid" id="cardsGrid"></div>

    <script>
        const API_URL = 'http://localhost:5000';
        let allRecipes = [];
        let filteredRecipes = [];
        let currentIndex = 0;
        let cardsPerPage = 3;
        let favorites = new Set();

        // Drink pairings mapping
        const drinkPairings = {
            'breakfast': [
                { icon: '☕', name: 'Matcha Arnold Palmer', type: 'coffee' },
                { icon: '🍹', name: 'Matcha Lemonade', type: 'juice' }
            ],
            'lunch': [
                { icon: '🍷', name: 'Iced Espresso', type: 'coffee' },
                { icon: '☕', name: 'Americano', type: 'coffee' }
            ],
            'dinner': [
                { icon: '🍷', name: 'Red Wine', type: 'wine' },
                { icon: '🥃', name: 'Craft Beer', type: 'beer' }
            ],
            'snacks': [
                { icon: '☕', name: 'Cold Brew', type: 'coffee' },
                { icon: '🧃', name: 'Iced Americano', type: 'coffee' }
            ],
            'desserts': [
                { icon: '☕', name: 'Espresso', type: 'coffee' },
                { icon: '🍵', name: 'Tea', type: 'tea' }
            ]
        };

        async function loadRecipes() {
            try {
                const response = await fetch(`${API_URL}/api/recipes?limit=1000`);
                const data = await response.json();
                allRecipes = data.recipes;
                filteredRecipes = allRecipes;
                updateCountries();
                displayRecipes();
                updateCounter();
            } catch (error) {
                console.error('Error loading recipes:', error);
            }
        }

        function updateCountries() {
            const countries = [...new Set(allRecipes.map(r => r.country))].sort();
            const select = document.getElementById('countryFilter');
            countries.forEach(country => {
                const option = document.createElement('option');
                option.value = country;
                option.textContent = country;
                select.appendChild(option);
            });
        }

        function filterRecipes() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const country = document.getElementById('countryFilter').value;
            const category = document.getElementById('categoryFilter').value;

            filteredRecipes = allRecipes.filter(recipe => {
                const matchSearch = recipe.name.toLowerCase().includes(search) ||
                    (recipe.description && recipe.description.toLowerCase().includes(search));
                const matchCountry = !country || recipe.country === country;
                const matchCategory = !category || recipe.category === category;
                return matchSearch && matchCountry && matchCategory;
            });

            currentIndex = 0;
            displayRecipes();
            updateCounter();

            // Track analytics
            if (search) {
                window.digInAnalytics.trackRecipeSearch(search, filteredRecipes.length);
            }
            if (country) {
                window.digInAnalytics.trackFilterUsage('country', country, filteredRecipes.length);
            }
            if (category) {
                window.digInAnalytics.trackFilterUsage('category', category, filteredRecipes.length);
            }

            // Track user metrics
            if (window.userMetricsTracker) {
                window.userMetricsTracker.trackFeatureUsage('recipeBrowsing');
            }
        }

        function displayRecipes() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            const start = currentIndex;
            const end = Math.min(start + cardsPerPage, filteredRecipes.length);

            for (let i = start; i < end; i++) {
                const recipe = filteredRecipes[i];
                grid.appendChild(createRecipeCard(recipe));
            }

            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = end >= filteredRecipes.length;
        }

        function renderCustomizationSection(recipe) {
            if (!recipe.remix_formats || !recipe.dietary_adaptations) {
                return '';
            }

            const remixIcons = {
                'salad': '🥗',
                'sandwich': '🥪',
                'soup': '🍲',
                'pasta': '🍝',
                'one_pot': '🍳',
                'smoothie_bowl': '🥣',
                'overnight_oats': '🥣',
                'wrap': '🌯',
                'parfait': '🍨'
            };

            const dietaryIcons = {
                'vegan': '🌱',
                'vegetarian': '🥬',
                'gluten_free': '🌾',
                'pescatarian': '🐟',
                'low_sodium': '🧂'
            };

            const flavorIcons = {
                'spicy': '🌶️',
                'umami': '🍜',
                'sweet': '🍯',
                'sour': '🍋',
                'aromatic': '🌿',
                'savory': '🧄',
                'earthy': '🍄',
                'fresh': '🌿'
            };

            const timeVariants = recipe.time_variants || {};
            const timeOptions = Object.entries(timeVariants)
                .map(([key, variant]) => `<option value="${key}">${variant.label} (${variant.prep_time}p + ${variant.cook_time}c)</option>`)
                .join('');

            const remixFormats = recipe.remix_formats
                .map(format => `<span class="remix-chip">${remixIcons[format] || '🍽️'} ${format.replace(/_/g, ' ')}</span>`)
                .join('');

            const dietaryOptions = recipe.dietary_adaptations
                .map(diet => `<span class="dietary-chip" onclick="toggleDietaryOption(this, '${recipe.id}', '${diet}')">${dietaryIcons[diet] || '✓'} ${diet.replace(/_/g, ' ')}</span>`)
                .join('');

            const flavorProfiles = ['spicy', 'umami', 'sweet', 'sour', 'aromatic', 'savory', 'earthy', 'fresh']
                .map(flavor => `<span class="remix-chip" onclick="toggleFlavorProfile(this, '${recipe.id}', '${flavor}')" style="cursor: pointer; border: 2px solid #667eea; color: #67d8ff;">${flavorIcons[flavor]} ${flavor}</span>`)
                .join('');

            return `
                <div class="customization-section">
                    <div class="customization-title">⚡ REMIX THIS RECIPE</div>

                    <div style="margin-bottom: 10px;">
                        <div style="font-size: 0.7em; color: #5a67d8; margin-bottom: 6px; text-transform: uppercase;">Format</div>
                        <div class="remix-formats">${remixFormats}</div>
                    </div>

                    <div style="margin-bottom: 10px;">
                        <div style="font-size: 0.7em; color: #5a67d8; margin-bottom: 6px; text-transform: uppercase;">Time</div>
                        <select class="time-variants-select" onchange="updateTimeVariant('${recipe.id}', this.value)">
                            ${timeOptions}
                        </select>
                    </div>

                    <div style="margin-bottom: 8px;">
                        <div style="font-size: 0.7em; color: #c9a961; margin-bottom: 6px; text-transform: uppercase;">Dietary Options</div>
                        <div class="dietary-options">${dietaryOptions}</div>
                    </div>

                    <div style="margin-bottom: 10px;">
                        <div style="font-size: 0.7em; color: #67d8ff; margin-bottom: 6px; text-transform: uppercase;">🌟 Flavor Profile</div>
                        <div class="flavor-profiles" style="display: flex; flex-wrap: wrap; gap: 8px;">${flavorProfiles}</div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                        <button class="remix-button" onclick="showRemixOptions('${recipe.id}')">🔄 GENERATE REMIX</button>
                        <button class="remix-button" onclick="showFlavorRemix('${recipe.id}')" style="background: #667eea; color: #fff;">✨ FLAVOR REMIX</button>
                    </div>
                </div>
            `;
        }

        function toggleDietaryOption(element, recipeId, diet) {
            element.classList.toggle('active');
            trackRemixInteraction('dietary_toggle', recipeId, diet);
        }

        function toggleFlavorProfile(element, recipeId, flavor) {
            element.classList.toggle('active');
            element.style.background = element.classList.contains('active') ? 'rgba(102, 126, 234, 0.3)' : 'transparent';
            trackRemixInteraction('flavor_toggle', recipeId, flavor);
        }

        function updateTimeVariant(recipeId, variant) {
            const recipe = allRecipes.find(r => r.id === recipeId);
            if (recipe && recipe.time_variants && recipe.time_variants[variant]) {
                const variantData = recipe.time_variants[variant];
                console.log(`Time variant selected: ${variantData.label} - ${variantData.prep_time}min prep, ${variantData.cook_time}min cook`);
                trackRemixInteraction('time_variant', recipeId, variant);
            }
        }

        async function showRemixOptions(recipeId) {
            const recipe = allRecipes.find(r => r.id === recipeId);
            if (!recipe) return;

            // Get selected dietary options
            const card = document.querySelector(`#card-${recipeId}`);
            const selectedDietary = Array.from(card.querySelectorAll('.dietary-chip.active'))
                .map(chip => {
                    const text = chip.textContent.toLowerCase();
                    return text.replace(/[^a-z_]/g, '').substring(0, 20) || text.split(' ')[1];
                });

            // Get selected time variant
            const timeSelect = card.querySelector('.time-variants-select');
            const timeVariant = timeSelect ? timeSelect.value : 'full';

            // Get selected format (use first format as default)
            const format = recipe.remix_formats ? recipe.remix_formats[0] : 'salad';

            // Show loading
            const button = card.querySelector('.remix-button');
            const originalText = button.textContent;
            button.textContent = '⏳ Generating...';
            button.disabled = true;

            try {
                // Call remix API
                const remixResponse = await fetch(`${API_URL}/api/recipes/${recipeId}/remix`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ format, dietaryOptions: selectedDietary })
                });

                if (!remixResponse.ok) throw new Error('Failed to remix recipe');
                const remixData = await remixResponse.json();
                const remixedRecipe = remixData.recipe;

                // Get time variant if needed
                let finalRecipe = remixedRecipe;
                if (timeVariant !== 'full') {
                    const timeResponse = await fetch(`${API_URL}/api/recipes/${recipeId}/time-variant`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ variant: timeVariant })
                    });
                    if (timeResponse.ok) {
                        const timeData = await timeResponse.json();
                        finalRecipe = timeData.recipe;
                    }
                }

                // Get seasoning recommendations
                const seasoningResponse = await fetch(`${API_URL}/api/recipes/${recipeId}/seasonings/${format}`);
                let seasonings = [];
                if (seasoningResponse.ok) {
                    const seasoningData = await seasoningResponse.json();
                    seasonings = seasoningData.recommended_seasonings;
                }

                // Store remixed recipe and show modal
                window.currentRemix = finalRecipe;
                window.remixSeasonings = seasonings;
                showRemixModal(finalRecipe, seasonings, selectedDietary);

                trackRemixInteraction('remix_generated', recipeId, format);
            } catch (error) {
                console.error('Error generating remix:', error);
                alert('Error generating remix. Please try again.');
            } finally {
                button.textContent = originalText;
                button.disabled = false;
            }
        }

        async function showFlavorRemix(recipeId) {
            const recipe = allRecipes.find(r => r.id === recipeId);
            if (!recipe) return;

            // Get selected flavor profile
            const card = document.querySelector(`#card-${recipeId}`);
            const selectedFlavorChip = card.querySelector('.flavor-profiles span.active');

            if (!selectedFlavorChip) {
                alert('Please select a flavor profile first!');
                return;
            }

            const flavor = selectedFlavorChip.textContent.toLowerCase().split(' ')[1] || selectedFlavorChip.textContent.split(' ')[0];
            const format = recipe.remix_formats ? recipe.remix_formats[0] : 'salad';

            // Show loading
            const button = Array.from(card.querySelectorAll('.remix-button')).find(b => b.textContent.includes('FLAVOR'));
            const originalText = button.textContent;
            button.textContent = '⏳ Transforming...';
            button.disabled = true;

            try {
                // Call flavor remix API
                const flavorResponse = await fetch(`${API_URL}/api/recipes/${recipeId}/remix-flavor`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ flavor, format })
                });

                if (!flavorResponse.ok) throw new Error('Failed to generate flavor remix');
                const flavorData = await flavorResponse.json();
                const flavorRemix = flavorData.recipe;

                // Get pairings for this flavor
                const pairingsResponse = await fetch(`${API_URL}/api/recipes/${recipeId}/pairings/${flavor}`);
                let pairings = null;
                if (pairingsResponse.ok) {
                    const pairingData = await pairingsResponse.json();
                    pairings = pairingData.pairings;
                }

                // Show flavor remix modal
                showFlavorRemixModal(flavorRemix, pairings, flavor);

                trackRemixInteraction('flavor_remix_generated', recipeId, flavor);
            } catch (error) {
                console.error('Error generating flavor remix:', error);
                alert('Error generating flavor remix. Please try again.');
            } finally {
                button.textContent = originalText;
                button.disabled = false;
            }
        }

        function showRemixModal(recipe, seasonings, dietaryOptions) {
            // Create modal for displaying remixed recipe
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0,0,0,0.8); display: flex; align-items: center;
                justify-content: center; z-index: 1000;
            `;

            const content = document.createElement('div');
            content.style.cssText = `
                background: #1a1a2e; border: 3px solid #ffd700; border-radius: 15px;
                padding: 30px; max-width: 600px; max-height: 80vh; overflow-y: auto;
                color: #fff; font-family: Arial, sans-serif;
            `;

            const title = document.createElement('h2');
            title.style.cssText = 'color: #ffd700; margin-bottom: 15px; font-family: Press Start 2P;';
            title.textContent = recipe.remix_metadata?.original_name || recipe.name;

            const subtitle = document.createElement('p');
            subtitle.style.cssText = 'color: #aaa; margin-bottom: 20px; font-size: 0.9em;';
            subtitle.textContent = `🔄 Remix: ${recipe.remix_metadata?.format || 'Custom'} ${dietaryOptions.length ? `| ${dietaryOptions.join(', ')}` : ''}`;

            const times = document.createElement('p');
            times.style.cssText = 'color: #5a67d8; margin-bottom: 15px; font-size: 0.9em;';
            times.innerHTML = `⏱️ Prep: ${recipe.prepTime}min | Cook: ${recipe.cookTime}min`;

            const description = document.createElement('p');
            description.style.cssText = 'color: #bbb; margin-bottom: 20px; line-height: 1.4;';
            description.textContent = recipe.remix_metadata?.remix_notes || recipe.description;

            if (seasonings.length > 0) {
                const seasoningLabel = document.createElement('p');
                seasoningLabel.style.cssText = 'color: #c9a961; font-weight: bold; margin-top: 15px;';
                seasoningLabel.textContent = '🧂 Recommended Seasonings:';
                content.appendChild(seasoningLabel);

                const seasoningList = document.createElement('div');
                seasoningList.style.cssText = 'display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px;';
                seasonings.forEach(s => {
                    const chip = document.createElement('span');
                    chip.style.cssText = `
                        background: rgba(201, 169, 97, 0.2); border: 1px solid #c9a961;
                        border-radius: 16px; padding: 4px 12px; font-size: 0.8em;
                        color: #c9a961;
                    `;
                    chip.textContent = s;
                    seasoningList.appendChild(chip);
                });
                content.appendChild(seasoningList);
            }

            const closeBtn = document.createElement('button');
            closeBtn.textContent = '✕ Close';
            closeBtn.style.cssText = `
                background: #5a67d8; color: #fff; border: none; padding: 10px 20px;
                border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9em;
                width: 100%; margin-top: 15px;
            `;
            closeBtn.onclick = () => modal.remove();

            content.appendChild(title);
            content.appendChild(subtitle);
            content.appendChild(times);
            content.appendChild(description);
            content.appendChild(closeBtn);

            modal.appendChild(content);
            document.body.appendChild(modal);

            // Track modal view
            if (window.userMetricsTracker) {
                window.userMetricsTracker.trackFeatureUsage('remixViewed', { recipe: recipe.name });
            }
        }

        function showFlavorRemixModal(recipe, pairings, flavor) {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0,0,0,0.8); display: flex; align-items: center;
                justify-content: center; z-index: 1000;
            `;

            const content = document.createElement('div');
            content.style.cssText = `
                background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
                border: 3px solid #667eea; border-radius: 15px;
                padding: 30px; max-width: 700px; max-height: 85vh; overflow-y: auto;
                color: #fff; font-family: Arial, sans-serif;
            `;

            const title = document.createElement('h2');
            title.style.cssText = 'color: #67d8ff; margin-bottom: 8px; font-family: Press Start 2P; font-size: 1.5em;';
            title.textContent = recipe.name;

            const flavorBadge = document.createElement('p');
            flavorBadge.style.cssText = 'color: #667eea; margin-bottom: 15px; font-size: 0.95em; font-weight: bold;';
            flavorBadge.innerHTML = `✨ ${flavor.toUpperCase()} TRANSFORMATION`;

            const transformation = document.createElement('p');
            transformation.style.cssText = 'color: #bbb; margin-bottom: 20px; line-height: 1.5; font-size: 0.9em;';
            transformation.textContent = recipe.transformation_notes || 'This dish has been transformed with new seasonings and ingredients.';

            const eatingExp = document.createElement('p');
            eatingExp.style.cssText = 'color: #c9a961; margin-bottom: 15px; font-style: italic; font-size: 0.9em; line-height: 1.4;';
            eatingExp.textContent = recipe.flavor_notes?.eating_experience || '';

            // Seasonings section
            const seasoningTitle = document.createElement('p');
            seasoningTitle.style.cssText = 'color: #67d8ff; font-weight: bold; margin-top: 20px; margin-bottom: 10px; font-size: 0.95em;';
            seasoningTitle.textContent = '🧂 DOMINANT SEASONINGS:';
            content.appendChild(seasoningTitle);

            if (recipe.flavor_notes?.dominant_seasonings) {
                const seasoningList = document.createElement('div');
                seasoningList.style.cssText = 'display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px;';
                recipe.flavor_notes.dominant_seasonings.forEach(s => {
                    const chip = document.createElement('span');
                    chip.style.cssText = `
                        background: rgba(102, 126, 234, 0.3); border: 1px solid #667eea;
                        border-radius: 16px; padding: 6px 14px; font-size: 0.85em;
                        color: #67d8ff;
                    `;
                    chip.textContent = s;
                    seasoningList.appendChild(chip);
                });
                content.appendChild(seasoningList);
            }

            // Pairings section
            if (pairings) {
                const pairingsTitle = document.createElement('p');
                pairingsTitle.style.cssText = 'color: #67d8ff; font-weight: bold; margin-top: 20px; margin-bottom: 10px; font-size: 0.95em;';
                pairingsTitle.textContent = '🥘 INGREDIENT PAIRINGS:';
                content.appendChild(pairingsTitle);

                const pairingGrid = document.createElement('div');
                pairingGrid.style.cssText = 'display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 20px;';

                // Protein
                const proteinBox = document.createElement('div');
                proteinBox.style.cssText = 'background: rgba(201, 169, 97, 0.15); border: 1px solid #c9a961; border-radius: 8px; padding: 12px;';
                proteinBox.innerHTML = `
                    <div style="color: #c9a961; font-weight: bold; font-size: 0.85em; margin-bottom: 4px;">PROTEIN</div>
                    <div style="color: #fff; font-size: 0.9em; margin-bottom: 4px;">${pairings.protein.name}</div>
                    <div style="color: #aaa; font-size: 0.75em;">${pairings.protein.reason}</div>
                `;
                pairingGrid.appendChild(proteinBox);

                // Carb
                const carbBox = document.createElement('div');
                carbBox.style.cssText = 'background: rgba(90, 103, 216, 0.15); border: 1px solid #5a67d8; border-radius: 8px; padding: 12px;';
                carbBox.innerHTML = `
                    <div style="color: #5a67d8; font-weight: bold; font-size: 0.85em; margin-bottom: 4px;">CARBS</div>
                    <div style="color: #fff; font-size: 0.9em; margin-bottom: 4px;">${pairings.carb.name}</div>
                    <div style="color: #aaa; font-size: 0.75em;">${pairings.carb.reason}</div>
                `;
                pairingGrid.appendChild(carbBox);

                // Bean
                const beanBox = document.createElement('div');
                beanBox.style.cssText = 'background: rgba(103, 216, 255, 0.15); border: 1px solid #67d8ff; border-radius: 8px; padding: 12px;';
                beanBox.innerHTML = `
                    <div style="color: #67d8ff; font-weight: bold; font-size: 0.85em; margin-bottom: 4px;">LEGUMES</div>
                    <div style="color: #fff; font-size: 0.9em; margin-bottom: 4px;">${pairings.bean.name}</div>
                    <div style="color: #aaa; font-size: 0.75em;">${pairings.bean.reason}</div>
                `;
                pairingGrid.appendChild(beanBox);

                content.appendChild(pairingGrid);

                // Pairing scores
                if (pairings.pairing_scores) {
                    const scoresTitle = document.createElement('p');
                    scoresTitle.style.cssText = 'color: #667eea; font-weight: bold; margin-top: 15px; margin-bottom: 10px; font-size: 0.85em;';
                    scoresTitle.textContent = '⭐ HARMONY SCORES:';
                    content.appendChild(scoresTitle);

                    const scoresList = document.createElement('div');
                    scoresList.style.cssText = 'font-size: 0.85em; line-height: 1.8;';
                    scoresList.innerHTML = `
                        <div style="color: #bbb;">
                            Protein Match: <span style="color: #ffd700; font-weight: bold;">${(pairings.pairing_scores.protein_flavor_match * 100).toFixed(0)}%</span>
                        </div>
                        <div style="color: #bbb;">
                            Carb Match: <span style="color: #ffd700; font-weight: bold;">${(pairings.pairing_scores.carb_flavor_match * 100).toFixed(0)}%</span>
                        </div>
                        <div style="color: #bbb;">
                            Bean Match: <span style="color: #ffd700; font-weight: bold;">${(pairings.pairing_scores.bean_flavor_match * 100).toFixed(0)}%</span>
                        </div>
                        <div style="color: #bbb; margin-top: 8px; border-top: 1px solid #333; padding-top: 8px;">
                            Overall Harmony: <span style="color: #67d8ff; font-weight: bold;">${(pairings.pairing_scores.overall_harmony * 100).toFixed(0)}%</span>
                        </div>
                    `;
                    content.appendChild(scoresList);
                }
            }

            // Beverage pairings
            if (recipe.flavor_notes?.pairing_drinks) {
                const drinkTitle = document.createElement('p');
                drinkTitle.style.cssText = 'color: #67d8ff; font-weight: bold; margin-top: 20px; margin-bottom: 10px; font-size: 0.95em;';
                drinkTitle.textContent = '🍷 BEVERAGE PAIRINGS:';
                content.appendChild(drinkTitle);

                const drinkList = document.createElement('div');
                drinkList.style.cssText = 'display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px;';
                recipe.flavor_notes.pairing_drinks.forEach(drink => {
                    const chip = document.createElement('span');
                    chip.style.cssText = `
                        background: rgba(201, 169, 97, 0.2); border: 1px solid #c9a961;
                        border-radius: 16px; padding: 6px 14px; font-size: 0.85em;
                        color: #c9a961;
                    `;
                    chip.textContent = drink;
                    drinkList.appendChild(chip);
                });
                content.appendChild(drinkList);
            }

            const closeBtn = document.createElement('button');
            closeBtn.textContent = '✕ Close';
            closeBtn.style.cssText = `
                background: #667eea; color: #fff; border: none; padding: 12px 24px;
                border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9em;
                width: 100%; margin-top: 20px;
            `;
            closeBtn.onclick = () => modal.remove();

            content.appendChild(title);
            content.appendChild(flavorBadge);
            content.appendChild(transformation);
            if (eatingExp.textContent) content.appendChild(eatingExp);
            content.appendChild(closeBtn);

            modal.appendChild(content);
            document.body.appendChild(modal);

            // Track modal view
            if (window.userMetricsTracker) {
                window.userMetricsTracker.trackFeatureUsage('flavorRemixViewed', { flavor: flavor });
            }
        }

        function trackRemixInteraction(action, recipeId, value) {
            if (window.userMetricsTracker) {
                window.userMetricsTracker.trackFeatureUsage('remixEngine', { action, recipeId, value });
            }
            if (window.digInAnalytics) {
                window.digInAnalytics.trackInteraction('remix', action, value);
            }
        }

        function createRecipeCard(recipe) {
            const card = document.createElement('div');
            card.className = 'recipe-card';
            card.id = `card-${recipe.id}`;

            // Track recipe view
            window.digInAnalytics.trackRecipeView(recipe.id, recipe.name, recipe.country, recipe.category);

            // Track market metrics
            if (window.marketMetricsTracker) {
                window.marketMetricsTracker.trackRecipeViewMarket(recipe.id, recipe.name, recipe.country, recipe.category);
            }

            const pairings = drinkPairings[recipe.category] || drinkPairings['lunch'];
            const ingredientList = recipe.ingredients
                .slice(0, 4)
                .map(ing => `<li>${ing}</li>`)
                .join('');

            card.innerHTML = `
                <div class="card-header">
                    <div class="recipe-name">${recipe.name}</div>
                    <div class="recipe-origin">${recipe.country}</div>
                    <div class="recipe-quick-stats">
                        <span class="stat-item">🌍 ${recipe.region}</span>
                        <span class="stat-item">⏱️ ${recipe.prepTime + recipe.cookTime}min</span>
                        <span class="stat-item">👥 ${recipe.servings}</span>
                    </div>
                </div>

                <div class="card-body">
                    <p class="recipe-description">${recipe.description}</p>

                    <div class="recipe-info-grid">
                        <div class="info-column">
                            <div class="info-item">
                                <div class="info-label">PREP</div>
                                <div class="info-value">${recipe.prepTime} min</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">DIFFICULTY</div>
                                <div class="info-value">${recipe.difficulty}</div>
                            </div>
                        </div>
                        <div class="info-column">
                            <div class="info-item">
                                <div class="info-label">COOK</div>
                                <div class="info-value">${recipe.cookTime} min</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">STEPS</div>
                                <div class="info-value">${recipe.instructions.length} steps</div>
                            </div>
                        </div>
                    </div>

                    <div class="ingredients-section">
                        <div class="ingredients-title">KEY INGREDIENTS</div>
                        <ul class="ingredients-list">
                            ${ingredientList}
                        </ul>
                    </div>

                    <div class="pairings-section">
                        <div class="pairings-title">
                            PAIRS WITH
                            <span class="pairing-type">${recipe.category}</span>
                        </div>
                        <div class="pairing-chips">
                            ${pairings.map(p => `
                                <div class="pairing-chip">
                                    <span class="pairing-icon">${p.icon}</span>
                                    <span>${p.name}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    ${renderCustomizationSection(recipe)}

                    <div class="card-actions">
                        <button class="action-btn" onclick="viewSteps('${recipe.id}')">VIEW STEPS</button>
                        <button class="action-btn secondary-btn" onclick="showAllDrinks('${recipe.id}')">ALL DRINKS</button>
                        <button class="favorite-btn ${favorites.has(recipe.id) ? 'active' : ''}" onclick="toggleFavorite('${recipe.id}')">♡</button>
                    </div>
                </div>
            `;

            return card;
        }

        function viewSteps(recipeId) {
            const recipe = filteredRecipes.find(r => r.id === recipeId);

            // Track analytics
            window.digInAnalytics.trackViewSteps(recipeId, recipe.name);

            // Track user metrics
            if (window.userMetricsTracker) {
                window.userMetricsTracker.trackFeatureUsage('recipeBrowsing');
            }

            sessionStorage.setItem('currentRecipe', JSON.stringify(recipe));
            window.open('recipe-steps-viewer.html', 'RecipeSteps', 'width=1000,height=800,scrollbars=yes');
        }

        function showAllDrinks(recipeId) {
            const recipe = filteredRecipes.find(r => r.id === recipeId);

            // Track analytics
            window.digInAnalytics.track('view_all_drinks', {
                recipe_id: recipeId,
                recipe_name: recipe.name,
                category: recipe.category
            });

            alert(`Drink Pairings for ${recipe.name}:\n\nCategory: ${recipe.category}\n\nRecommended drinks:\n☕ Coffee options\n🍷 Wine selections\n🍺 Beer varieties\n🧃 Juice options`);
        }

        function toggleFavorite(recipeId) {
            const recipe = filteredRecipes.find(r => r.id === recipeId);
            const isLiking = !favorites.has(recipeId);

            if (isLiking) {
                favorites.add(recipeId);
            } else {
                favorites.delete(recipeId);
            }

            const btn = document.querySelector(`#card-${recipeId} .favorite-btn`);
            if (btn) {
                btn.classList.toggle('active');
            }

            // Track analytics
            window.digInAnalytics.trackRecipeLike(recipeId, recipe.name, isLiking);

            // Track user metrics
            if (window.userMetricsTracker) {
                window.userMetricsTracker.trackRecipeSave(recipeId, recipe.name, isLiking);
            }

            // Track market metrics
            if (window.marketMetricsTracker && recipe) {
                window.marketMetricsTracker.trackRecipeSaveMarket(recipeId, window.userMetricsTracker?.userData?.userId, isLiking);
            }
        }

        function shuffleRecipes() {
            let temp = filteredRecipes;
            for (let i = temp.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [temp[i], temp[j]] = [temp[j], temp[i]];
            }
            currentIndex = 0;
            displayRecipes();

            // Track analytics
            window.digInAnalytics.trackShuffle();
        }

        document.getElementById('searchInput').addEventListener('input', filterRecipes);
        document.getElementById('countryFilter').addEventListener('change', filterRecipes);
        document.getElementById('categoryFilter').addEventListener('change', filterRecipes);

        document.getElementById('prevBtn').addEventListener('click', () => {
            currentIndex = Math.max(0, currentIndex - cardsPerPage);
            displayRecipes();
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentIndex = Math.min(currentIndex + cardsPerPage, filteredRecipes.length - cardsPerPage);
            displayRecipes();
        });

        function updateCounter() {
            const start = currentIndex + 1;
            const end = Math.min(currentIndex + cardsPerPage, filteredRecipes.length);
            document.getElementById('recipeCounter').textContent =
                `Showing ${start}-${end} of ${filteredRecipes.length} recipes`;
        }

        loadRecipes();
    </script>
</body>
</html>
