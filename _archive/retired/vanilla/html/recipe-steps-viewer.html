<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Steps - Dig In</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .recipe-header {
            background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
            padding: 30px;
            border-radius: 15px 15px 0 0;
            margin-bottom: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .recipe-title-section h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 2em;
            margin-bottom: 10px;
            color: #fff;
        }

        .recipe-meta-line {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.9);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .recipe-container {
            background: #fff;
            max-width: 1000px;
            margin: 0 auto;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .ingredients-section {
            padding: 40px;
            border-bottom: 2px solid #f0f0f0;
        }

        .section-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.9em;
            color: #5a67d8;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .ingredients-display {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .ingredient-chip {
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            padding: 10px 16px;
            border-radius: 25px;
            font-size: 0.9em;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .ingredient-chip:hover {
            border-color: #c1409e;
            background: #fff5fa;
        }

        .ingredient-chip .remove-btn {
            background: none;
            border: none;
            color: #c1409e;
            cursor: pointer;
            font-size: 1.2em;
            padding: 0;
            display: none;
        }

        .ingredient-chip:hover .remove-btn {
            display: inline;
        }

        .add-ingredient {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        .add-ingredient input {
            flex: 1;
            border: 2px solid #e0e0e0;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9em;
            transition: all 0.2s;
        }

        .add-ingredient input:focus {
            outline: none;
            border-color: #c1409e;
            box-shadow: 0 0 0 3px rgba(193, 64, 158, 0.1);
        }

        .add-btn {
            background: #c1409e;
            border: none;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .add-btn:hover {
            background: #a83980;
            transform: scale(1.05);
        }

        .cooking-science-header {
            background: #1a1a1a;
            color: #ffd700;
            padding: 12px 40px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8em;
            letter-spacing: 2px;
            border-left: 4px solid #ffd700;
            margin: 0;
        }

        .steps-section {
            padding: 40px;
        }

        .step-container {
            display: flex;
            gap: 25px;
            margin-bottom: 35px;
            position: relative;
            padding-left: 0;
        }

        .step-number {
            background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
            color: #fff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', cursive;
            font-size: 1.3em;
            flex-shrink: 0;
        }

        .step-content {
            flex: 1;
            border: 3px solid #5a67d8;
            border-radius: 12px;
            padding: 20px;
            background: rgba(90, 103, 216, 0.02);
        }

        .step-instruction {
            font-size: 1em;
            color: #333;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .step-time {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
            color: #666;
            margin-bottom: 15px;
        }

        .tip-box {
            background: #fff9e6;
            border-left: 4px solid #ffc107;
            padding: 12px 15px;
            margin: 15px 0;
            border-radius: 4px;
        }

        .tip-label {
            font-size: 0.75em;
            color: #ffc107;
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tip-text {
            font-size: 0.85em;
            color: #cc9900;
        }

        .step-counter {
            font-size: 0.8em;
            color: #999;
            margin: 12px 0;
        }

        .done-btn {
            background: none;
            border: 2px solid #5a67d8;
            color: #5a67d8;
            padding: 10px 20px;
            border-radius: 25px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.65em;
            cursor: pointer;
            transition: all 0.2s;
            float: right;
        }

        .done-btn:hover {
            background: #5a67d8;
            color: #fff;
        }

        .done-btn.completed {
            background: #4caf50;
            border-color: #4caf50;
            color: #fff;
        }

        .step-container.completed .step-content {
            opacity: 0.6;
            background: rgba(76, 175, 80, 0.1);
        }

        .step-container.completed .step-number {
            background: #4caf50;
        }

        .bottom-actions {
            padding: 20px 40px;
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            border-top: 2px solid #f0f0f0;
        }

        .action-btn {
            padding: 12px 25px;
            border: 2px solid #5a67d8;
            background: #fff;
            color: #5a67d8;
            border-radius: 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: #5a67d8;
            color: #fff;
        }

        .action-btn.primary {
            background: #5a67d8;
            color: #fff;
        }

        .action-btn.primary:hover {
            background: #4c51bf;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #f0f0f0;
            margin-top: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #5a67d8, #6b46c1);
            transition: width 0.3s;
        }

        @media (max-width: 768px) {
            .recipe-header {
                flex-direction: column;
                gap: 20px;
            }

            .recipe-title-section h1 {
                font-size: 1.3em;
            }

            .step-container {
                gap: 15px;
            }

            .ingredients-section,
            .steps-section,
            .bottom-actions {
                padding: 20px;
            }

            .step-number {
                width: 50px;
                height: 50px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="recipe-header">
        <div class="recipe-title-section">
            <h1 id="recipeName">Carbonara</h1>
            <div class="recipe-meta-line">
                <span id="recipeOrigin">Italian</span>
                <span>•</span>
                <span id="recipeCategory">dinner</span>
                <span>•</span>
                <span id="recipeSteps">5 steps</span>
            </div>
        </div>
        <button class="close-btn" onclick="window.history.back()">✕</button>
    </div>

    <div class="recipe-container">
        <!-- Ingredients Section -->
        <div class="ingredients-section">
            <div class="section-title">Ingredients</div>
            <div class="ingredients-display" id="ingredientsList"></div>
            <div class="add-ingredient">
                <input type="text" id="newIngredient" placeholder="Add an extra ingredient...">
                <button class="add-btn" onclick="addIngredient()">+ ADD</button>
            </div>
        </div>

        <!-- Cooking Science Header -->
        <div class="cooking-science-header">🧬 COOKING SCIENCE FOR THIS RECIPE</div>

        <!-- Steps Section -->
        <div class="steps-section" id="stepsContainer"></div>

        <!-- Progress -->
        <div style="padding: 0 40px; margin-bottom: 20px;">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <!-- Bottom Actions -->
        <div class="bottom-actions">
            <button class="action-btn" onclick="window.history.back()">← BACK</button>
            <button class="action-btn primary" onclick="printRecipe()">🖨️ PRINT</button>
            <button class="action-btn primary" onclick="saveRecipe()">💾 SAVE</button>
        </div>
    </div>

    <script>
        // Sample recipe data - fallback if no recipe in sessionStorage
        const sampleRecipe = {
            id: "ita-dinner-carbonara",
            name: "Carbonara",
            country: "Italy",
            region: "Southern Europe",
            category: "dinner",
            description: "Roman pasta with eggs, guanciale, Pecorino Romano, and black pepper",
            ingredients: [
                "200g spaghetti",
                "100g guanciale",
                "2 eggs + 2 yolks",
                "50g Pecorino Romano",
                "black pepper"
            ],
            instructions: [
                "Render guanciale in pan until crispy.",
                "Cook pasta and reserve water.",
                "Whisk eggs with cheese.",
                "Off heat, combine pasta with guanciale.",
                "Toss with egg mixture, add pasta water as needed."
            ],
            tips: [
                "Never add cream - it's not authentic.",
                "Work quickly off the heat so eggs don't scramble.",
                "Use quality guanciale and Pecorino Romano.",
                "Keep pasta water for creaminess.",
                "Serve immediately while hot."
            ],
            prepTime: 10,
            cookTime: 20
        };

        let completedSteps = new Set();
        let currentRecipe = sampleRecipe;

        // Load recipe from sessionStorage if available
        function loadRecipeData() {
            try {
                const recipeData = sessionStorage.getItem('currentRecipe');
                if (recipeData) {
                    currentRecipe = JSON.parse(recipeData);
                    sessionStorage.removeItem('currentRecipe'); // Clear after reading
                }
            } catch (e) {
                console.warn('Could not load recipe from sessionStorage, using sample:', e);
            }
        }

        function initializeRecipe() {
            // Set header info
            document.getElementById('recipeName').textContent = currentRecipe.name;
            document.getElementById('recipeOrigin').textContent = currentRecipe.country;
            document.getElementById('recipeCategory').textContent = currentRecipe.category;
            document.getElementById('recipeSteps').textContent = `${currentRecipe.instructions.length} steps`;

            // Display ingredients
            const ingredientsList = document.getElementById('ingredientsList');
            ingredientsList.innerHTML = currentRecipe.ingredients
                .map((ing, idx) => `
                    <div class="ingredient-chip">
                        ${ing}
                        <button class="remove-btn" onclick="removeIngredient(${idx})">×</button>
                    </div>
                `)
                .join('');

            // Display steps
            const stepsContainer = document.getElementById('stepsContainer');
            stepsContainer.innerHTML = currentRecipe.instructions
                .map((instruction, idx) => `
                    <div class="step-container" id="step-${idx}">
                        <div class="step-number">${idx + 1}</div>
                        <div class="step-content">
                            <div class="step-instruction">${instruction}</div>
                            <div class="step-time">⏱️ ${Math.floor(Math.random() * 10) + 3} min</div>
                            ${currentRecipe.tips[idx] ? `
                                <div class="tip-box">
                                    <div class="tip-label">💡 Tip:</div>
                                    <div class="tip-text">${currentRecipe.tips[idx]}</div>
                                </div>
                            ` : ''}
                            <div class="step-counter">Step ${idx + 1} of ${currentRecipe.instructions.length}</div>
                            <button class="done-btn" onclick="toggleStepDone(${idx})">DONE</button>
                            <div style="clear: both;"></div>
                        </div>
                    </div>
                `)
                .join('');
        }

        function toggleStepDone(stepIdx) {
            if (completedSteps.has(stepIdx)) {
                completedSteps.delete(stepIdx);
            } else {
                completedSteps.add(stepIdx);
            }
            updateStepVisual(stepIdx);
            updateProgress();
        }

        function updateStepVisual(stepIdx) {
            const stepEl = document.getElementById(`step-${stepIdx}`);
            const btn = stepEl.querySelector('.done-btn');

            if (completedSteps.has(stepIdx)) {
                stepEl.classList.add('completed');
                btn.classList.add('completed');
                btn.textContent = '✓ DONE';
            } else {
                stepEl.classList.remove('completed');
                btn.classList.remove('completed');
                btn.textContent = 'DONE';
            }
        }

        function updateProgress() {
            const total = currentRecipe.instructions.length;
            const completed = completedSteps.size;
            const percentage = (completed / total) * 100;
            document.getElementById('progressFill').style.width = percentage + '%';
        }

        function addIngredient() {
            const input = document.getElementById('newIngredient');
            const ingredient = input.value.trim();

            if (ingredient) {
                currentRecipe.ingredients.push(ingredient);
                input.value = '';
                initializeRecipe();
            }
        }

        function removeIngredient(idx) {
            currentRecipe.ingredients.splice(idx, 1);
            initializeRecipe();
        }

        function printRecipe() {
            window.print();
        }

        function saveRecipe() {
            const recipeJSON = JSON.stringify(currentRecipe, null, 2);
            const blob = new Blob([recipeJSON], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentRecipe.name.replace(/\s+/g, '-').toLowerCase()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadRecipeData();
            initializeRecipe();
        });
    </script>
</body>
</html>
