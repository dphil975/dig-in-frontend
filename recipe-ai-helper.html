<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dig In - AI Recipe Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #667eea;
      --secondary: #764ba2;
      --accent: #FF5C9D;
      --success: #4CAF50;
      --warning: #FF9800;
      --danger: #F44336;
      --light-bg: #f9f9f9;
      --border-color: #e0e0e0;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      font-family: 'DotGothic16', monospace;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .page-header {
      text-align: center;
      margin-bottom: 40px;
      color: white;
    }

    .page-header h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 36px;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      letter-spacing: 2px;
    }

    .page-header p {
      font-size: 13px;
      opacity: 0.9;
      margin-bottom: 20px;
    }

    .recipe-selector {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    .recipe-selector h2 {
      font-family: 'Press Start 2P', monospace;
      color: var(--primary);
      font-size: 16px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .recipe-option {
      padding: 15px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      background: white;
    }

    .recipe-option:hover {
      border-color: var(--primary);
      background: #f0f4ff;
      transform: translateY(-2px);
    }

    .recipe-option.selected {
      border-color: var(--accent);
      background: #fff0f5;
      box-shadow: 0 0 0 3px rgba(255, 92, 157, 0.1);
    }

    .recipe-option h3 {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: var(--primary);
      margin-bottom: 5px;
      letter-spacing: 0.5px;
    }

    .recipe-option p {
      font-size: 11px;
      color: #666;
      line-height: 1.5;
    }

    /* Main Assistant Area */
    .assistant-area {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .recipe-steps {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .recipe-steps h2 {
      font-family: 'Press Start 2P', monospace;
      color: var(--primary);
      font-size: 14px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .steps-list {
      display: grid;
      gap: 12px;
    }

    .step-item {
      padding: 12px;
      border: 2px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
      background: white;
    }

    .step-item:hover {
      border-color: var(--primary);
      background: var(--light-bg);
    }

    .step-item.active {
      border-color: var(--accent);
      background: #fff0f5;
      box-shadow: inset 0 0 0 2px var(--accent);
    }

    .step-number {
      font-family: 'Press Start 2P', monospace;
      color: var(--primary);
      font-size: 10px;
      margin-bottom: 4px;
    }

    .step-text {
      font-size: 11px;
      color: #666;
      line-height: 1.5;
    }

    /* Image Upload Area */
    .image-upload-area {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
    }

    .upload-area h2 {
      font-family: 'Press Start 2P', monospace;
      color: var(--primary);
      font-size: 14px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .upload-box {
      border: 3px dashed var(--primary);
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: var(--light-bg);
      margin-bottom: 15px;
    }

    .upload-box:hover {
      border-color: var(--accent);
      background: #fff0f5;
    }

    .upload-box.drag-over {
      border-color: var(--accent);
      background: #fff0f5;
      transform: scale(1.02);
    }

    .upload-icon {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .upload-text {
      font-family: 'Press Start 2P', monospace;
      color: var(--primary);
      font-size: 12px;
      margin-bottom: 5px;
      letter-spacing: 0.5px;
    }

    .upload-subtext {
      font-size: 10px;
      color: #999;
      margin-bottom: 15px;
    }

    .file-input {
      display: none;
    }

    .upload-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn {
      padding: 10px 20px;
      border: 2px solid var(--primary);
      border-radius: 6px;
      background: white;
      color: var(--primary);
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn:hover {
      background: var(--primary);
      color: white;
    }

    .btn.primary {
      background: var(--primary);
      color: white;
    }

    .btn.primary:hover {
      background: var(--secondary);
      border-color: var(--secondary);
    }

    .btn.success {
      border-color: var(--success);
      color: var(--success);
    }

    .btn.success:hover {
      background: var(--success);
      color: white;
    }

    /* Preview & Analysis */
    .preview-section {
      margin-top: 20px;
    }

    .preview-image {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid var(--border-color);
      margin-bottom: 15px;
    }

    .analysis-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 20px;
      background: var(--light-bg);
      border-radius: 8px;
      font-size: 12px;
      color: var(--primary);
      margin-bottom: 15px;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid var(--light-bg);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Analysis Results */
    .analysis-results {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-top: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .analysis-results h3 {
      font-family: 'Press Start 2P', monospace;
      color: var(--primary);
      font-size: 12px;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    .analysis-item {
      padding: 12px;
      border-left: 4px solid var(--primary);
      background: var(--light-bg);
      margin-bottom: 12px;
      border-radius: 4px;
    }

    .analysis-label {
      font-family: 'Press Start 2P', monospace;
      color: var(--primary);
      font-size: 9px;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .analysis-text {
      font-size: 11px;
      color: #333;
      line-height: 1.6;
    }

    .analysis-item.success {
      border-left-color: var(--success);
      background: #f1f8f4;
    }

    .analysis-item.warning {
      border-left-color: var(--warning);
      background: #fff8f0;
    }

    .analysis-item.danger {
      border-left-color: var(--danger);
      background: #fef5f5;
    }

    /* Feedback Section */
    .feedback-section {
      margin-top: 20px;
      padding: 15px;
      background: var(--light-bg);
      border-radius: 8px;
    }

    .feedback-section h4 {
      font-family: 'Press Start 2P', monospace;
      color: var(--primary);
      font-size: 10px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .feedback-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .feedback-btn {
      padding: 8px 16px;
      border: 2px solid var(--border-color);
      background: white;
      border-radius: 6px;
      font-size: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .feedback-btn:hover {
      border-color: var(--primary);
    }

    .feedback-btn.correct {
      border-color: var(--success);
      color: var(--success);
    }

    .feedback-btn.incorrect {
      border-color: var(--danger);
      color: var(--danger);
    }

    /* Tips & Guidance */
    .guidance-box {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }

    .guidance-box h4 {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .guidance-tip {
      font-size: 11px;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .guidance-tip::before {
      content: "💡 ";
      margin-right: 5px;
    }

    @media (max-width: 1024px) {
      .assistant-area {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .page-header h1 {
        font-size: 20px;
      }

      .recipe-grid {
        grid-template-columns: 1fr;
      }

      .btn {
        font-size: 9px;
        padding: 8px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="page-header">
      <h1>🤖 👨‍🍳 AI Recipe Assistant</h1>
      <p>Real-time Cooking Guidance with Image Analysis</p>
    </div>

    <!-- Recipe Selector -->
    <div class="recipe-selector">
      <h2>Select a Recipe</h2>
      <div class="recipe-grid" id="recipeGrid">
        <!-- Recipes will be inserted here -->
      </div>
    </div>

    <!-- Main Assistant Area -->
    <div class="assistant-area">
      <!-- Recipe Steps -->
      <div class="recipe-steps">
        <h2>Recipe Steps</h2>
        <div class="steps-list" id="stepsList">
          <p style="color: #999; font-size: 11px;">Select a recipe to view steps</p>
        </div>
      </div>

      <!-- Image Upload -->
      <div class="image-upload-area">
        <h2>📸 Upload Photo</h2>

        <div class="upload-box" id="uploadBox">
          <div class="upload-icon">📸</div>
          <div class="upload-text">Drop Image Here</div>
          <div class="upload-subtext">or click to browse</div>
          <input type="file" id="fileInput" class="file-input" accept="image/*">
        </div>

        <div class="upload-buttons">
          <button class="btn" onclick="document.getElementById('fileInput').click()">Choose Photo</button>
          <button class="btn primary" id="analyzeBtn" disabled>Analyze</button>
        </div>

        <!-- Preview -->
        <div class="preview-section" id="previewSection" style="display: none;">
          <img id="previewImage" class="preview-image" alt="Preview">
          <div class="analysis-loading" id="analysisLoading" style="display: none;">
            <div class="spinner"></div>
            Analyzing your cooking...
          </div>
        </div>
      </div>
    </div>

    <!-- Analysis Results -->
    <div class="analysis-results" id="analysisResults" style="display: none;">
      <h3>🔍 AI Analysis</h3>
      <div id="analysisContent"></div>

      <div class="feedback-section">
        <h4>Was this analysis helpful?</h4>
        <div class="feedback-buttons">
          <button class="feedback-btn correct" onclick="submitFeedback('correct')">✅ Correct</button>
          <button class="feedback-btn incorrect" onclick="submitFeedback('incorrect')">❌ Incorrect</button>
          <button class="feedback-btn" onclick="submitFeedback('partial')">⚠️ Partially Correct</button>
        </div>
      </div>
    </div>

    <!-- Guidance -->
    <div class="guidance-box" id="guidanceBox" style="display: none;">
      <h4>👨‍🍳 Cooking Guidance</h4>
      <div id="guidanceContent"></div>
    </div>
  </div>

  <script>
    // Sample recipes data
    const recipes = [
      {
        id: 1,
        name: "Perfectly Seared Steak",
        cuisine: "Classic",
        steps: [
          { number: 1, text: "Bring steak to room temperature (30 min)", tip: "Cold meat won't sear properly" },
          { number: 2, text: "Pat completely dry with paper towels", tip: "Moisture prevents browning" },
          { number: 3, text: "Heat cast iron to smoking (450°F+)", tip: "Hot enough for sizzle sound" },
          { number: 4, text: "Sear each side 2-3 minutes for medium-rare", tip: "Don't move it—let crust develop" },
          { number: 5, text: "Rest for 5 minutes before cutting", tip: "Retains juices in meat" }
        ]
      },
      {
        id: 2,
        name: "Creamy Pasta Sauce",
        cuisine: "Italian",
        steps: [
          { number: 1, text: "Cook bacon until crispy (8-10 min)", tip: "Medium heat prevents burning" },
          { number: 2, text: "Add onions and garlic (5 min)", tip: "Don't let garlic burn—it becomes bitter" },
          { number: 3, text: "Add cream slowly on low heat", tip: "High heat can cause curdling" },
          { number: 4, text: "Grate Parmesan and stir in (2 min)", tip: "Add off heat to prevent clumping" },
          { number: 5, text: "Toss with hot pasta immediately", tip: "Heat activates emulsion" }
        ]
      },
      {
        id: 3,
        name: "Fermented Sauerkraut",
        cuisine: "German",
        steps: [
          { number: 1, text: "Slice cabbage thinly (1/4 inch)", tip: "Uniform size ensures even fermentation" },
          { number: 2, text: "Add 2% salt by weight", tip: "Creates environment for lactobacillus" },
          { number: 3, text: "Pack jar, pressing down", tip: "Vegetables must stay submerged" },
          { number: 4, text: "Cover with cloth, secure with rubber band", tip: "Anaerobic fermentation prevents mold" },
          { number: 5, text: "Ferment 3-7 days at 65-75°F", tip: "Longer = more sour, shorter = milder" }
        ]
      },
      {
        id: 4,
        name: "Mexican Chile Relleno",
        cuisine: "Mexican",
        steps: [
          { number: 1, text: "Char poblano peppers over flame", tip: "Blistering makes peeling easier" },
          { number: 2, text: "Sweat in plastic bag for 5 min", tip: "Steam loosens skin" },
          { number: 3, text: "Peel and remove seeds carefully", tip: "Keep pepper intact for filling" },
          { number: 4, text: "Stuff with cheese, seal opening", tip: "Fold edges over to close" },
          { number: 5, text: "Fry in oil until golden (2 min/side)", tip: "Maintain 350-375°F oil temperature" }
        ]
      }
    ];

    let selectedRecipe = null;
    let uploadedImage = null;

    // Initialize recipe grid
    function initializeRecipes() {
      const grid = document.getElementById('recipeGrid');
      grid.innerHTML = '';
      recipes.forEach(recipe => {
        const div = document.createElement('div');
        div.className = 'recipe-option';
        div.onclick = () => selectRecipe(recipe);
        div.innerHTML = `
          <h3>${recipe.name}</h3>
          <p>${recipe.cuisine} • ${recipe.steps.length} steps</p>
        `;
        grid.appendChild(div);
      });
    }

    // Select recipe and show steps
    function selectRecipe(recipe) {
      selectedRecipe = recipe;

      // Update UI
      document.querySelectorAll('.recipe-option').forEach(el => el.classList.remove('selected'));
      event.target.closest('.recipe-option').classList.add('selected');

      // Show steps
      const stepsList = document.getElementById('stepsList');
      stepsList.innerHTML = '';
      recipe.steps.forEach(step => {
        const div = document.createElement('div');
        div.className = 'step-item';
        div.onclick = () => selectStep(step);
        div.innerHTML = `
          <div class="step-number">Step ${step.number}</div>
          <div class="step-text">${step.text}</div>
          <div class="step-text" style="color: #999; font-size: 10px; margin-top: 4px;">💡 ${step.tip}</div>
        `;
        stepsList.appendChild(div);
      });
    }

    // Select specific step
    function selectStep(step) {
      document.querySelectorAll('.step-item').forEach(el => el.classList.remove('active'));
      event.target.closest('.step-item').classList.add('active');
    }

    // File upload handlers
    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) uploadImage(file);
    });

    const uploadBox = document.getElementById('uploadBox');
    uploadBox.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadBox.classList.add('drag-over');
    });

    uploadBox.addEventListener('dragleave', () => {
      uploadBox.classList.remove('drag-over');
    });

    uploadBox.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadBox.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) uploadImage(file);
    });

    function uploadImage(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        uploadedImage = e.target.result;

        // Show preview
        document.getElementById('previewSection').style.display = 'block';
        document.getElementById('previewImage').src = uploadedImage;
        document.getElementById('analyzeBtn').disabled = false;
      };
      reader.readAsDataURL(file);
    }

    // Analyze image
    document.getElementById('analyzeBtn').addEventListener('click', analyzeImage);

    function analyzeImage() {
      if (!uploadedImage || !selectedRecipe) {
        alert('Please select a recipe and upload an image');
        return;
      }

      // Show loading
      document.getElementById('analysisLoading').style.display = 'flex';
      document.getElementById('analysisResults').style.display = 'none';

      // Simulate AI analysis (in real app, send to backend)
      setTimeout(() => {
        document.getElementById('analysisLoading').style.display = 'none';
        showAnalysisResults();
      }, 2000);
    }

    function showAnalysisResults() {
      const results = generateAnalysis();

      const analysisContent = document.getElementById('analysisContent');
      analysisContent.innerHTML = '';

      results.items.forEach(item => {
        const div = document.createElement('div');
        div.className = `analysis-item ${item.type}`;
        div.innerHTML = `
          <div class="analysis-label">${item.label}</div>
          <div class="analysis-text">${item.text}</div>
        `;
        analysisContent.appendChild(div);
      });

      // Show guidance
      const guidanceBox = document.getElementById('guidanceBox');
      document.getElementById('guidanceContent').innerHTML = results.guidance.map(g =>
        `<div class="guidance-tip">${g}</div>`
      ).join('');
      guidanceBox.style.display = 'block';

      document.getElementById('analysisResults').style.display = 'block';
    }

    function generateAnalysis() {
      const analyses = {
        1: { // Steak
          items: [
            { type: 'success', label: 'Color', text: 'Golden-brown crust detected - excellent Maillard reaction' },
            { type: 'success', label: 'Temperature', text: 'Interior color suggests medium-rare (135°F)' },
            { type: 'warning', label: 'Resting', text: 'Consider resting 5 minutes to lock in juices' }
          ],
          guidance: [
            'Your steak has developed a perfect crust!',
            'Let it rest before cutting to redistribute juices',
            'Internal temperature: ~135°F for medium-rare'
          ]
        },
        2: { // Pasta
          items: [
            { type: 'success', label: 'Color', text: 'Sauce appears creamy and well-emulsified' },
            { type: 'warning', label: 'Texture', text: 'Watch for potential separation - keep heat low' },
            { type: 'success', label: 'Consistency', text: 'Good coating consistency for pasta' }
          ],
          guidance: [
            'Sauce looks properly creamy!',
            'Keep temperature below 180°F to prevent curdling',
            'Toss with hot pasta immediately'
          ]
        },
        3: { // Sauerkraut
          items: [
            { type: 'success', label: 'Bubbling', text: 'Active fermentation detected - good lactobacillus activity' },
            { type: 'success', label: 'Color', text: 'Pale color indicates early fermentation stage' },
            { type: 'warning', label: 'Submersion', text: 'Ensure cabbage stays under brine to prevent mold' }
          ],
          guidance: [
            'Fermentation is progressing well!',
            'Keep vegetables submerged with cloth barrier',
            'Continue fermenting 3-7 days depending on taste preference'
          ]
        },
        4: { // Chile Relleno
          items: [
            { type: 'success', label: 'Color', text: 'Golden-brown exterior indicates proper frying' },
            { type: 'success', label: 'Structure', text: 'Pepper maintains shape well - excellent technique' },
            { type: 'warning', label: 'Oil Temperature', text: 'Appears to be around 350°F - perfect range' }
          ],
          guidance: [
            'Your chile relleno is frying beautifully!',
            'Maintain consistent oil temperature at 350-375°F',
            'Fry 2-3 minutes per side for golden exterior'
          ]
        }
      };

      return analyses[selectedRecipe?.id] || {
        items: [
          { type: 'success', label: 'Image Quality', text: 'Clear, well-lit photo' },
          { type: 'warning', label: 'Analysis', text: 'Select a specific recipe for detailed feedback' }
        ],
        guidance: ['Upload a clear photo of your cooking and select the matching recipe for real-time guidance']
      };
    }

    function submitFeedback(type) {
      const messages = {
        correct: '✅ Thank you! This helps improve the AI',
        incorrect: '📝 We\'ll note this for improvement',
        partial: '⚠️ Thanks for the clarification'
      };
      alert(messages[type]);
    }

    // Initialize
    initializeRecipes();
  </script>
</body>
</html>
