<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dig In - Premium Recipe Cards</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="analytics-tracker.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 2.5em;
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .header-subtitle {
            font-size: 1em;
            color: #aaa;
            margin-bottom: 30px;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        input[type="text"], select {
            padding: 10px 15px;
            border: 2px solid #ffd700;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-family: 'Arial', sans-serif;
            font-size: 0.9em;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        button {
            padding: 10px 20px;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 6px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.65em;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #ffed4e;
            transform: scale(1.05);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .recipe-card {
            background: #1a1a2e;
            border: 3px solid #c9a961;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        .recipe-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(201, 169, 97, 0.3);
            border-color: #ffd700;
        }

        .card-header {
            background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
            padding: 20px;
            border-bottom: 2px solid #c9a961;
        }

        .recipe-name {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.3em;
            color: #fff;
            margin-bottom: 8px;
        }

        .recipe-origin {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 12px;
        }

        .recipe-quick-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.8);
            flex-wrap: wrap;
            gap: 8px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-body {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .recipe-description {
            font-size: 0.85em;
            color: #bbb;
            margin-bottom: 20px;
            line-height: 1.4;
            border-bottom: 1px solid rgba(201, 169, 97, 0.3);
            padding-bottom: 15px;
        }

        .recipe-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .info-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .info-item {
            border-left: 3px solid #5a67d8;
            padding-left: 12px;
        }

        .info-label {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.65em;
            color: #5a67d8;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 0.95em;
            color: #fff;
        }

        .ingredients-section {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(201, 169, 97, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .ingredients-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.65em;
            color: #5a67d8;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ingredients-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.8em;
            color: #ccc;
        }

        .ingredients-list li {
            list-style: none;
            padding: 4px 0;
            border-bottom: 1px solid rgba(201, 169, 97, 0.2);
        }

        .ingredients-list li:before {
            content: "• ";
            color: #ffd700;
            margin-right: 6px;
        }

        .pairings-section {
            background: linear-gradient(135deg, rgba(201, 169, 97, 0.1) 0%, rgba(201, 169, 97, 0.05) 100%);
            border: 1px solid #c9a961;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .pairings-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.65em;
            color: #c9a961;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pairing-type {
            font-size: 0.7em;
            color: #999;
            font-family: 'Arial', sans-serif;
        }

        .pairing-chips {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pairing-chip {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #c9a961;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.75em;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .pairing-chip:hover {
            background: #c9a961;
            color: #000;
        }

        .pairing-icon {
            font-size: 1em;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
            justify-content: space-between;
        }

        .action-btn {
            flex: 1;
            padding: 10px 12px;
            background: #3d4a99;
            border: 1px solid #5a67d8;
            color: #fff;
            border-radius: 6px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.65em;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .action-btn:hover {
            background: #5a67d8;
            box-shadow: 0 0 15px rgba(90, 103, 216, 0.5);
        }

        .secondary-btn {
            background: rgba(201, 169, 97, 0.2);
            border: 1px solid #c9a961;
            color: #c9a961;
        }

        .secondary-btn:hover {
            background: #c9a961;
            color: #000;
        }

        .favorite-btn {
            background: none;
            border: 1px solid #c9a961;
            color: #c9a961;
            width: 40px;
            padding: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .favorite-btn:hover {
            background: #c9a961;
            color: #000;
        }

        .favorite-btn.active {
            background: #ff6b6b;
            border-color: #ff6b6b;
            color: #fff;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .nav-btn {
            padding: 10px 25px;
            background: rgba(201, 169, 97, 0.2);
            border: 2px solid #c9a961;
            color: #c9a961;
            border-radius: 6px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #c9a961;
            color: #000;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .recipe-counter {
            text-align: center;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.75em;
            color: #c9a961;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }

            .recipe-info-grid {
                grid-template-columns: 1fr;
            }

            .ingredients-list {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .recipe-name {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🍽️ DIG IN</h1>
        <div class="header-subtitle">Premium Global Recipe Collection</div>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search recipes...">
        <select id="countryFilter">
            <option value="">All Countries</option>
        </select>
        <select id="categoryFilter">
            <option value="">All Categories</option>
            <option value="breakfast">Breakfast</option>
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
            <option value="snacks">Snacks</option>
            <option value="desserts">Desserts</option>
            <option value="nonAlcoholicDrinks">Non-Alcoholic Drinks</option>
            <option value="alcoholicDrinks">Alcoholic Drinks</option>
        </select>
        <button onclick="shuffleRecipes()">🎲 Shuffle</button>
        <button onclick="window.location.href='analytics-dashboard.html'" style="background: #ffd700; color: #000;">📊 Analytics</button>
        <button onclick="window.location.href='barcode-scanner.html'" style="background: #ff6b6b; color: #fff;">📱 Scanner</button>
    </div>

    <div class="recipe-counter" id="recipeCounter">Loading recipes...</div>

    <div class="nav-buttons">
        <button id="prevBtn" class="nav-btn">← PREV</button>
        <button id="nextBtn" class="nav-btn">NEXT →</button>
    </div>

    <div class="cards-grid" id="cardsGrid"></div>

    <script>
        const API_URL = 'http://localhost:5000';
        let allRecipes = [];
        let filteredRecipes = [];
        let currentIndex = 0;
        let cardsPerPage = 3;
        let favorites = new Set();

        // Drink pairings mapping
        const drinkPairings = {
            'breakfast': [
                { icon: '☕', name: 'Matcha Arnold Palmer', type: 'coffee' },
                { icon: '🍹', name: 'Matcha Lemonade', type: 'juice' }
            ],
            'lunch': [
                { icon: '🍷', name: 'Iced Espresso', type: 'coffee' },
                { icon: '☕', name: 'Americano', type: 'coffee' }
            ],
            'dinner': [
                { icon: '🍷', name: 'Red Wine', type: 'wine' },
                { icon: '🥃', name: 'Craft Beer', type: 'beer' }
            ],
            'snacks': [
                { icon: '☕', name: 'Cold Brew', type: 'coffee' },
                { icon: '🧃', name: 'Iced Americano', type: 'coffee' }
            ],
            'desserts': [
                { icon: '☕', name: 'Espresso', type: 'coffee' },
                { icon: '🍵', name: 'Tea', type: 'tea' }
            ]
        };

        async function loadRecipes() {
            try {
                const response = await fetch(`${API_URL}/api/recipes?limit=1000`);
                const data = await response.json();
                allRecipes = data.recipes;
                filteredRecipes = allRecipes;
                updateCountries();
                displayRecipes();
                updateCounter();
            } catch (error) {
                console.error('Error loading recipes:', error);
            }
        }

        function updateCountries() {
            const countries = [...new Set(allRecipes.map(r => r.country))].sort();
            const select = document.getElementById('countryFilter');
            countries.forEach(country => {
                const option = document.createElement('option');
                option.value = country;
                option.textContent = country;
                select.appendChild(option);
            });
        }

        function filterRecipes() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const country = document.getElementById('countryFilter').value;
            const category = document.getElementById('categoryFilter').value;

            filteredRecipes = allRecipes.filter(recipe => {
                const matchSearch = recipe.name.toLowerCase().includes(search) ||
                    (recipe.description && recipe.description.toLowerCase().includes(search));
                const matchCountry = !country || recipe.country === country;
                const matchCategory = !category || recipe.category === category;
                return matchSearch && matchCountry && matchCategory;
            });

            currentIndex = 0;
            displayRecipes();
            updateCounter();

            // Track analytics
            if (search) {
                window.digInAnalytics.trackRecipeSearch(search, filteredRecipes.length);
            }
            if (country) {
                window.digInAnalytics.trackFilterUsage('country', country, filteredRecipes.length);
            }
            if (category) {
                window.digInAnalytics.trackFilterUsage('category', category, filteredRecipes.length);
            }
        }

        function displayRecipes() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            const start = currentIndex;
            const end = Math.min(start + cardsPerPage, filteredRecipes.length);

            for (let i = start; i < end; i++) {
                const recipe = filteredRecipes[i];
                grid.appendChild(createRecipeCard(recipe));
            }

            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = end >= filteredRecipes.length;
        }

        function createRecipeCard(recipe) {
            const card = document.createElement('div');
            card.className = 'recipe-card';
            card.id = `card-${recipe.id}`;

            // Track recipe view
            window.digInAnalytics.trackRecipeView(recipe.id, recipe.name, recipe.country, recipe.category);

            const pairings = drinkPairings[recipe.category] || drinkPairings['lunch'];
            const ingredientList = recipe.ingredients
                .slice(0, 4)
                .map(ing => `<li>${ing}</li>`)
                .join('');

            card.innerHTML = `
                <div class="card-header">
                    <div class="recipe-name">${recipe.name}</div>
                    <div class="recipe-origin">${recipe.country}</div>
                    <div class="recipe-quick-stats">
                        <span class="stat-item">🌍 ${recipe.region}</span>
                        <span class="stat-item">⏱️ ${recipe.prepTime + recipe.cookTime}min</span>
                        <span class="stat-item">👥 ${recipe.servings}</span>
                    </div>
                </div>

                <div class="card-body">
                    <p class="recipe-description">${recipe.description}</p>

                    <div class="recipe-info-grid">
                        <div class="info-column">
                            <div class="info-item">
                                <div class="info-label">PREP</div>
                                <div class="info-value">${recipe.prepTime} min</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">DIFFICULTY</div>
                                <div class="info-value">${recipe.difficulty}</div>
                            </div>
                        </div>
                        <div class="info-column">
                            <div class="info-item">
                                <div class="info-label">COOK</div>
                                <div class="info-value">${recipe.cookTime} min</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">STEPS</div>
                                <div class="info-value">${recipe.instructions.length} steps</div>
                            </div>
                        </div>
                    </div>

                    <div class="ingredients-section">
                        <div class="ingredients-title">KEY INGREDIENTS</div>
                        <ul class="ingredients-list">
                            ${ingredientList}
                        </ul>
                    </div>

                    <div class="pairings-section">
                        <div class="pairings-title">
                            PAIRS WITH
                            <span class="pairing-type">${recipe.category}</span>
                        </div>
                        <div class="pairing-chips">
                            ${pairings.map(p => `
                                <div class="pairing-chip">
                                    <span class="pairing-icon">${p.icon}</span>
                                    <span>${p.name}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="card-actions">
                        <button class="action-btn" onclick="viewSteps('${recipe.id}')">VIEW STEPS</button>
                        <button class="action-btn secondary-btn" onclick="showAllDrinks('${recipe.id}')">ALL DRINKS</button>
                        <button class="favorite-btn ${favorites.has(recipe.id) ? 'active' : ''}" onclick="toggleFavorite('${recipe.id}')">♡</button>
                    </div>
                </div>
            `;

            return card;
        }

        function viewSteps(recipeId) {
            const recipe = filteredRecipes.find(r => r.id === recipeId);

            // Track analytics
            window.digInAnalytics.trackViewSteps(recipeId, recipe.name);

            sessionStorage.setItem('currentRecipe', JSON.stringify(recipe));
            window.open('recipe-steps-viewer.html', 'RecipeSteps', 'width=1000,height=800,scrollbars=yes');
        }

        function showAllDrinks(recipeId) {
            const recipe = filteredRecipes.find(r => r.id === recipeId);

            // Track analytics
            window.digInAnalytics.track('view_all_drinks', {
                recipe_id: recipeId,
                recipe_name: recipe.name,
                category: recipe.category
            });

            alert(`Drink Pairings for ${recipe.name}:\n\nCategory: ${recipe.category}\n\nRecommended drinks:\n☕ Coffee options\n🍷 Wine selections\n🍺 Beer varieties\n🧃 Juice options`);
        }

        function toggleFavorite(recipeId) {
            const recipe = filteredRecipes.find(r => r.id === recipeId);
            const isLiking = !favorites.has(recipeId);

            if (isLiking) {
                favorites.add(recipeId);
            } else {
                favorites.delete(recipeId);
            }

            const btn = document.querySelector(`#card-${recipeId} .favorite-btn`);
            if (btn) {
                btn.classList.toggle('active');
            }

            // Track analytics
            window.digInAnalytics.trackRecipeLike(recipeId, recipe.name, isLiking);
        }

        function shuffleRecipes() {
            let temp = filteredRecipes;
            for (let i = temp.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [temp[i], temp[j]] = [temp[j], temp[i]];
            }
            currentIndex = 0;
            displayRecipes();

            // Track analytics
            window.digInAnalytics.trackShuffle();
        }

        document.getElementById('searchInput').addEventListener('input', filterRecipes);
        document.getElementById('countryFilter').addEventListener('change', filterRecipes);
        document.getElementById('categoryFilter').addEventListener('change', filterRecipes);

        document.getElementById('prevBtn').addEventListener('click', () => {
            currentIndex = Math.max(0, currentIndex - cardsPerPage);
            displayRecipes();
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentIndex = Math.min(currentIndex + cardsPerPage, filteredRecipes.length - cardsPerPage);
            displayRecipes();
        });

        function updateCounter() {
            const start = currentIndex + 1;
            const end = Math.min(currentIndex + cardsPerPage, filteredRecipes.length);
            document.getElementById('recipeCounter').textContent =
                `Showing ${start}-${end} of ${filteredRecipes.length} recipes`;
        }

        loadRecipes();
    </script>
</body>
</html>
