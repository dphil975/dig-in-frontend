<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dig In — Price Intelligence</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        .header {
            background: #ff6b6b;
            padding: 24px;
            border-radius: 20px;
            margin-bottom: 32px;
            color: white;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .search-card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom: 24px;
        }

        .search-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-row input, .search-row select {
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            flex: 1;
            min-width: 150px;
        }

        .search-row button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .search-row button:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .platform-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-top: 4px solid #ddd;
        }

        .platform-card .platform-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 13px;
            border-bottom: 1px solid #f0f0f0;
        }

        .price-row .label {
            color: #888;
        }

        .price-row .value {
            font-weight: 500;
        }

        .price-row .value.highlight {
            color: #ff6b6b;
            font-weight: 600;
        }

        .price-row .value.cheapest {
            color: #4caf50;
            font-weight: 600;
        }

        .total-price {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px solid #f0f0f0;
        }

        .savings-banner {
            background: #e8f5e9;
            padding: 16px;
            border-radius: 12px;
            margin: 16px 0;
            text-align: center;
        }

        .savings-banner .savings-amount {
            font-size: 28px;
            font-weight: 700;
            color: #4caf50;
        }

        .social-feed {
            margin-top: 24px;
        }

        .social-post {
            background: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            border-left: 4px solid #ff6b6b;
        }

        .social-post .platform-tag {
            font-size: 11px;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 1px;
        }

        .social-post .post-content {
            margin: 8px 0;
        }

        .social-post .post-meta {
            font-size: 12px;
            color: #888;
        }

        .price-alert-section {
            margin-top: 24px;
            padding: 20px;
            background: #fff3e0;
            border-radius: 12px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }

        .badge.warning {
            background: #ff9800;
            color: white;
        }

        .badge.danger {
            background: #f44336;
            color: white;
        }

        .badge.success {
            background: #4caf50;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Price Intelligence</h1>
            <p>Real-time price comparison across delivery platforms — know before you order</p>
        </div>

        <div class="search-card">
            <div class="search-row">
                <input type="text" id="restaurantInput" placeholder="Restaurant (e.g., McDonald's)" value="McDonald's">
                <input type="text" id="itemInput" placeholder="Item (e.g., McDouble)" value="McDouble">
                <input type="text" id="locationInput" placeholder="Location" value="NYC">
                <button id="searchBtn">🔍 Compare Prices</button>
            </div>
        </div>

        <div id="resultsContainer"></div>

        <div class="social-feed">
            <h3 style="margin-bottom: 16px;">📱 What People Are Saying</h3>
            <div id="socialFeed"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';

        function renderPriceComparison(data) {
            const container = document.getElementById('resultsContainer');
            
            const platforms = ['uber_eats', 'doordash', 'grubhub'];
            const platformNames = {'uber_eats': 'Uber Eats', 'doordash': 'DoorDash', 'grubhub': 'GrubHub'};
            const platformColors = {'uber_eats': '#4A90D9', 'doordash': '#FF2B85', 'grubhub': '#00A8A8'};

            let platformCards = '';
            for (const platform of platforms) {
                const pData = data.platform_comparison[platform];
                if (!pData) continue;
                
                const isCheapest = platform === data.best_value;
                const totalPrice = pData.final_price;

                platformCards += `
                    <div class="platform-card" style="border-top-color: ${platformColors[platform]};">
                        <div class="platform-name">${platformNames[platform]}</div>
                        <div class="price-row">
                            <span class="label">Item Price</span>
                            <span class="value">$${pData.item_price}</span>
                        </div>
                        <div class="price-row">
                            <span class="label">Service Fee</span>
                            <span class="value">$${pData.service_fee}</span>
                        </div>
                        <div class="price-row">
                            <span class="label">Delivery Fee</span>
                            <span class="value">$${pData.delivery_fee}</span>
                        </div>
                        <div class="price-row">
                            <span class="label">Tax</span>
                            <span class="value">$${pData.tax}</span>
                        </div>
                        <div class="price-row">
                            <span class="label">Suggested Tip</span>
                            <span class="value">$${pData.tip}</span>
                        </div>
                        <div class="total-price ${isCheapest ? 'cheapest' : ''}">
                            $${totalPrice}
                            ${isCheapest ? '🏆 Best Value' : ''}
                        </div>
                        <div style="font-size: 11px; color: #888; text-align: center; margin-top: 4px;">
                            ${pData.markup_percentage}% above in-store price
                        </div>
                    </div>
                `;
            }

            container.innerHTML = `
                <div style="margin-bottom: 16px;">
                    <h2>${data.item} at ${data.restaurant}</h2>
                    <p style="color: #888;">📍 ${data.location}</p>
                </div>
                <div class="savings-banner">
                    <div style="font-size: 14px; margin-bottom: 4px;">💰 Save by picking up in-store</div>
                    <div class="savings-amount">$${data.savings_potential.total_savings}</div>
                    <div style="font-size: 13px;">${data.savings_potential.message}</div>
                </div>
                <div class="comparison-grid">${platformCards}</div>
                ${data.device_pricing.warning ? `
                    <div style="background: #fff3e0; padding: 12px; border-radius: 12px; margin-top: 16px;">
                        <span class="badge warning">⚠️ Device Alert</span>
                        <span style="font-size: 13px; margin-left: 8px;">${data.device_pricing.warning}</span>
                    </div>
                ` : ''}
                ${data.price_alert_triggers.length > 0 ? data.price_alert_triggers.map(alert => `
                    <div style="background: #ffebee; padding: 12px; border-radius: 12px; margin-top: 8px;">
                        <span class="badge danger">⚠️ ${alert.issue}</span>
                        <span style="font-size: 13px; margin-left: 8px;">${alert.message}</span>
                    </div>
                `).join('') : ''}
                <div class="price-alert-section">
                    <h4>🔔 Price Alert</h4>
                    <p style="font-size: 13px; color: #888;">Get notified when this item drops in price</p>
                    <button onclick="setPriceAlert()" style="margin-top: 8px; padding: 8px 16px; background: #ff6b6b; color: white; border: none; border-radius: 12px; cursor: pointer;">
                        Set Alert
                    </button>
                </div>
            `;
        }

        function renderSocialFeed(feedData) {
            const container = document.getElementById('socialFeed');
            
            let posts = [];
            
            if (feedData.reddit) {
                posts = posts.concat(feedData.reddit.map(p => ({
                    ...p,
                    platform: 'Reddit',
                    icon: '🔴'
                })));
            }
            
            if (feedData.twitter) {
                posts = posts.concat(feedData.twitter.map(p => ({
                    ...p,
                    platform: 'Twitter/X',
                    icon: '🐦'
                })));
            }

            container.innerHTML = posts.map(post => `
                <div class="social-post" style="border-left-color: ${post.sentiment === 'positive' ? '#4caf50' : '#ff6b6b'}">
                    <div class="platform-tag">${post.icon} ${post.platform}</div>
                    <div class="post-content">${post.title || post.tweet}</div>
                    <div class="post-meta">
                        ${post.engagement ? `❤️ ${post.engagement} interactions` : ''}
                        ${post.likes ? `❤️ ${post.likes} likes` : ''}
                        <span class="badge ${post.sentiment === 'positive' ? 'success' : 'danger'}">
                            ${post.sentiment}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        async function searchPrices() {
            const restaurant = document.getElementById('restaurantInput').value;
            const item = document.getElementById('itemInput').value;
            const location = document.getElementById('locationInput').value;

            if (!restaurant || !item) {
                alert('Please enter a restaurant and item');
                return;
            }

            const container = document.getElementById('resultsContainer');
            container.innerHTML = '<div style="text-align: center; padding: 40px;">🔍 Fetching prices...</div>';

            try {
                const response = await fetch(`${API_BASE}/price/compare?restaurant=${encodeURIComponent(restaurant)}&item=${encodeURIComponent(item)}&location=${encodeURIComponent(location)}`);
                const data = await response.json();
                renderPriceComparison(data.data);
            } catch (error) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: #888;">⚠️ Could not fetch prices. Using demo data.</div>';
                // Fallback demo data
                renderDemoData(restaurant, item, location);
            }

            // Load social feed
            try {
                const feedResponse = await fetch(`${API_BASE}/social/food-trends`);
                const feedData = await feedResponse.json();
                renderSocialFeed(feedData);
            } catch (error) {
                renderDemoSocialFeed();
            }
        }

        function renderDemoData(restaurant, item, location) {
            const data = {
                "in_store_price": 2.50,
                "platform_comparison": {
                    "uber_eats": {
                        "item_price": 3.00,
                        "service_fee": 0.45,
                        "delivery_fee": 4.99,
                        "tax": 0.27,
                        "tip": 0.45,
                        "final_price": 9.16,
                        "markup_percentage": 20.0
                    },
                    "doordash": {
                        "item_price": 2.95,
                        "service_fee": 0.44,
                        "delivery_fee": 4.99,
                        "tax": 0.26,
                        "tip": 0.44,
                        "final_price": 9.08,
                        "markup_percentage": 18.0
                    },
                    "grubhub": {
                        "item_price": 2.88,
                        "service_fee": 0.37,
                        "delivery_fee": 5.99,
                        "tax": 0.26,
                        "tip": 0.43,
                        "final_price": 9.93,
                        "markup_percentage": 15.0
                    }
                },
                "best_value": "doordash",
                "savings_potential": {
                    "average_delivery": 9.39,
                    "in_store": 2.50,
                    "total_savings": 6.89,
                    "savings_percentage": 73.4,
                    "message": "You save $6.89 by picking up in-store!"
                },
                "device_pricing": {
                    "warning": "iPhone users may pay 8-15% more on delivery apps"
                },
                "price_alert_triggers": []
            };

            renderPriceComparison(data);
        }

        function renderDemoSocialFeed() {
            const feedData = {
                "reddit": [
                    {
                        "subreddit": "r/Frugal",
                        "title": "I stopped ordering delivery and saved $200 this month",
                        "sentiment": "positive",
                        "engagement": 450
                    },
                    {
                        "subreddit": "r/fastfood",
                        "title": "McDonald's $2.50 McDouble is not a deal—it was $1 10 years ago",
                        "sentiment": "negative",
                        "engagement": 1200
                    }
                ],
                "twitter": [
                    {
                        "tweet": "DoorDash upcharges are out of control. $12 for a $9 meal? No thanks.",
                        "sentiment": "negative",
                        "likes": 5000
                    },
                    {
                        "tweet": "Just picked up my own food and saved $15. Delivery is dead to me.",
                        "sentiment": "positive",
                        "likes": 8000
                    }
                ]
            };
            renderSocialFeed(feedData);
        }

        function setPriceAlert() {
            const restaurant = document.getElementById('restaurantInput').value;
            const item = document.getElementById('itemInput').value;
            alert(`🔔 Price alert set for ${item} at ${restaurant}! We'll notify you when prices drop.`);
        }

        document.getElementById('searchBtn').addEventListener('click', searchPrices);

        // Load default data on page load
        setTimeout(searchPrices, 500);
    </script>
</body>
</html>
