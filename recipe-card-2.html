<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIG-IN · Recipe Cards</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        /* ── Base ────────────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DotGothic16', monospace;
            background: linear-gradient(135deg, #FFF8F0 0%, #FFE4D6 100%);
            color: #3a2a30;
            min-height: 100vh;
            padding: 20px;
        }

        /* ── Recipe Card ──────────────────────────────────────────────── */
        .recipe-card-final {
            background: white;
            border-radius: 16px;
            border: 4px solid #1c1c1c;
            box-shadow: 5px 5px 0 #1c1c1c;
            max-width: 900px;
            margin: 0 auto;
            overflow: hidden;
        }

        /* ── Card Header (Dish Pane Style) ────────────────────────────── */
        .card-header {
            background: #fdf5f0;
            border-bottom: 4px solid #1c1c1c;
            padding: 24px 20px;
            text-align: center;
            position: relative;
        }

        .card-header-left {
            margin-bottom: 16px;
        }

        .card-header-left h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 13px;
            color: #3a2a30;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            line-height: 1.6;
        }

        .card-header-left p {
            font-size: 12px;
            color: #6a5550;
            margin-bottom: 12px;
            font-style: italic;
        }

        .card-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .meta-badge {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            background: #fff0e0;
            border: 3px solid #1c1c1c;
            padding: 8px 14px;
            border-radius: 20px;
            color: #8b5e3c;
            box-shadow: 2px 2px 0 #1c1c1c;
        }

        .card-header-right {
            position: absolute;
            top: 24px;
            right: 20px;
        }

        .dish-emoji-big {
            font-size: 80px;
            line-height: 1;
            text-align: center;
        }

        /* ── Card Body ────────────────────────────────────────────────── */
        .card-body {
            padding: 28px 32px 24px;
        }

        /* ── Missing Indicator (Warning Style) ────────────────────────── */
        .missing-indicator {
            background: #fde8ea;
            border: 3px solid #e06070;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 20px;
            display: none;
            box-shadow: 3px 3px 0 #d0a0a8;
        }

        .missing-indicator.show { display: block; }

        .missing-indicator-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: #8b1c24;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .missing-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .missing-tag {
            background: white;
            color: #8b1c24;
            border: 2px solid #e06070;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 11px;
            display: inline-block;
        }

        /* ── View Mode Tabs (Recipe Tabs Style) ──────────────────────── */
        .view-tabs {
            display: flex;
            gap: 0;
            border-bottom: 3px solid #1c1c1c;
            margin-bottom: 20px;
        }

        .view-tab {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 12px 18px;
            background: #f5e8e0;
            color: #8b5e3c;
            border: 3px solid #1c1c1c;
            border-bottom: none;
            border-radius: 6px 6px 0 0;
            margin-right: 4px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: none;
        }

        .view-tab:hover { background: #ffe0d0; }

        .view-tab.active {
            background: #c8455f;
            color: white;
            border-color: #1c1c1c;
            transform: none;
            position: relative;
            top: 3px;
            z-index: 1;
        }

        /* ── Step View Toggle (Inline with tabs) ──────────────────────── */
        .step-view-mode-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            padding: 12px 14px;
            background: #fff8f0;
            border: 3px solid #f0d0b8;
            border-radius: 10px;
            border-left: 4px solid #c8455f;
        }

        .mode-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            padding: 9px 14px;
            border: 3px solid #1c1c1c;
            border-radius: 8px;
            background: #f5e8e0;
            color: #8b5e3c;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 2px 2px 0 #1c1c1c;
        }

        .mode-btn:hover { background: #ffe0d0; }

        .mode-btn.active {
            background: #c8455f;
            color: white;
        }

        /* ── Linear Steps View ────────────────────────────────────────── */
        .step-list {
            display: none;
        }

        .step-list.active { display: block; }

        .step-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid #f0e0d8;
            cursor: pointer;
            user-select: none;
        }

        .step-item:last-child { border-bottom: none; }

        .step-number-badge {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            background: #8b5e3c;
            color: white;
            border-radius: 50%;
            border: 2px solid #1c1c1c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            margin-top: 2px;
        }

        .step-text {
            font-family: 'DotGothic16', monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #3a2a30;
        }

        /* ── Carousel View ────────────────────────────────────────────── */
        .carousel-container {
            display: none;
        }

        .carousel-container.active { display: block; }

        .carousel-viewport {
            overflow: hidden;
            border-radius: 12px;
            margin-bottom: 14px;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.3s cubic-bezier(.4,0,.2,1);
        }

        /* ── Flip Card ────────────────────────────────────────────────── */
        .flip-card {
            min-width: 100%;
            flex-shrink: 0;
            perspective: 900px;
            height: 320px;
            cursor: pointer;
        }

        .flip-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.45s cubic-bezier(.4,0,.2,1);
        }

        .flip-card.flipped .flip-inner {
            transform: rotateY(180deg);
        }

        .flip-front, .flip-back {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border: 4px solid #1c1c1c;
            border-radius: 12px;
            padding: 18px 22px;
            box-shadow: 4px 4px 0 #1c1c1c;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .flip-front {
            background: #fdf5f0;
            gap: 10px;
        }

        .flip-back {
            background: #1c1c1c;
            color: #fff;
            transform: rotateY(180deg);
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 8px;
        }

        .flip-step-header {
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            color: #c8455f;
            letter-spacing: 1px;
        }

        .flip-step-text {
            font-family: 'DotGothic16', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #3a2a30;
            flex: 1;
            text-align: left;
        }

        .flip-hint {
            font-family: 'Press Start 2P', monospace;
            font-size: 5px;
            color: #c8455f;
            letter-spacing: 1px;
            text-align: right;
            margin-top: auto;
        }

        .flip-stage-emoji {
            font-size: 64px;
            line-height: 1;
        }

        .flip-stage-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: #f4a924;
            letter-spacing: 1px;
        }

        .flip-visual-text {
            font-family: 'DotGothic16', monospace;
            font-size: 13px;
            color: #d0b8a8;
            line-height: 1.6;
            max-width: 230px;
        }

        /* ── Carousel Controls ────────────────────────────────────────── */
        .carousel-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-top: 14px;
        }

        .carousel-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 10px 18px;
            background: #c8455f;
            color: white;
            border: 3px solid #1c1c1c;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 3px 3px 0 #1c1c1c;
            transition: transform 0.08s, box-shadow 0.08s;
        }

        .carousel-btn:hover:not(:disabled) {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0 #1c1c1c;
        }

        .carousel-btn:disabled {
            background: #e0c8c0;
            color: #b09090;
            cursor: default;
            box-shadow: 2px 2px 0 #ccc;
        }

        .carousel-indicator {
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            color: #8b5e3c;
            min-width: 56px;
            text-align: center;
        }

        /* ── Recipe Adaptation (Pantry Style) ────────────────────────── */
        .adapt-section {
            background: #fdf5f0;
            border: 3px solid #f0d0b8;
            border-radius: 10px;
            padding: 14px 16px;
            margin-top: 0;
            display: none;
            box-shadow: 3px 3px 0 #e0c0a0;
        }

        .adapt-section.show { display: block; }

        .adapt-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: #8b5e3c;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .adapt-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }

        .adapt-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            padding: 14px 10px;
            border: 3px solid #1c1c1c;
            border-radius: 10px;
            background: white;
            color: #3a2a30;
            cursor: pointer;
            text-align: center;
            transition: transform 0.08s, box-shadow 0.08s;
            box-shadow: 3px 3px 0 #1c1c1c;
        }

        .adapt-btn:hover { transform: translate(1px, 1px); box-shadow: 2px 2px 0 #1c1c1c; }

        .adapt-btn.active {
            background: #c8455f;
            color: white;
            box-shadow: 3px 3px 0 #8b2a40;
        }

        .adapt-results {
            background: white;
            border: 2px solid #d0b8a0;
            border-radius: 8px;
            padding: 10px 12px;
            display: none;
            font-size: 12px;
            color: #555;
            line-height: 1.6;
        }

        .adapt-results.show { display: block; }

        /* ── Drink Pairings (Same Style) ──────────────────────────────── */
        .drinks-section {
            background: #fdf5f0;
            border: 3px solid #f0d0b8;
            border-radius: 10px;
            padding: 14px 16px;
            box-shadow: 3px 3px 0 #e0c0a0;
        }

        .drinks-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: #8b5e3c;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .drinks-category-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .drink-pill {
            font-family: 'DotGothic16', monospace;
            font-size: 12px;
            padding: 5px 11px;
            border: 2px solid #d0b8a0;
            border-radius: 20px;
            background: white;
            color: #8b5e3c;
            cursor: pointer;
            transition: all 0.15s;
            font-weight: bold;
        }

        .drink-pill:hover,
        .drink-pill.active {
            background: #8b5e3c;
            color: white;
            border-color: #8b5e3c;
        }

        .drink-pill.disabled {
            opacity: 0.4;
            cursor: default;
            border-style: dashed;
        }

        .drinks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
        }

        .drink-card {
            background: white;
            border: 3px solid #1c1c1c;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 3px 3px 0 #1c1c1c;
        }

        .drink-card.featured {
            border-color: #f4a924;
            box-shadow: 3px 3px 0 #c8a000;
        }

        .drink-card-head {
            padding: 9px 12px;
            background: #3a2a30;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .drink-card.featured .drink-card-head {
            background: #8b5e3c;
        }

        .drink-emoji {
            font-size: 14px;
            flex-shrink: 0;
        }

        .drink-card-name {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            letter-spacing: 0.5px;
            line-height: 1.5;
            flex: 1;
        }

        .drink-card-body {
            padding: 10px 12px;
            font-family: 'DotGothic16', monospace;
            font-size: 12px;
            color: #555;
            line-height: 1.5;
        }

        /* ── Buttons ──────────────────────────────────────────────────── */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .btn-primary {
            flex: 1;
            min-width: 140px;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            padding: 14px 22px;
            background: #c8455f;
            color: white;
            border: 3px solid #1c1c1c;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 4px 4px 0 #1c1c1c;
            transition: transform 0.08s, box-shadow 0.08s;
        }

        .btn-primary:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #1c1c1c;
        }

        .btn-primary:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        .btn-secondary {
            flex-shrink: 0;
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            padding: 8px 12px;
            background: #fff0f4;
            color: #c8455f;
            border: 3px solid #1c1c1c;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 3px 3px 0 #1c1c1c;
            transition: transform 0.08s, box-shadow 0.08s;
        }

        .btn-secondary.on {
            background: #c8455f;
            color: white;
        }

        .btn-secondary:hover {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0 #1c1c1c;
        }

        /* ── Recipe Navigation Header ────────────────────────────── */
        .recipe-nav-header {
            max-width: 900px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .recipe-nav-header h2 {
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            color: #c8455f;
            letter-spacing: 1px;
        }

        .recipe-nav-info {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: #8b5e3c;
        }

        .recipe-nav-buttons {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 8px 12px;
            background: #fff0e0;
            border: 3px solid #1c1c1c;
            border-radius: 6px;
            color: #8b5e3c;
            cursor: pointer;
            box-shadow: 2px 2px 0 #1c1c1c;
            transition: all 0.1s;
        }

        .nav-btn:hover {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 #1c1c1c;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: default;
        }
    </style>
</head>
<body>
    <!-- ── Top decorations ── -->
    <div style="position: fixed; inset: 0; pointer-events: none; z-index: 0; display: none;">
        <span style="position: absolute; left: 6%; top: 8%; font-size: 18px; opacity: .18;">☁</span>
        <span style="position: absolute; left: 80%; top: 14%; font-size: 18px; opacity: .18;">☁</span>
    </div>

    <!-- Recipe Navigation Header -->
    <div class="recipe-nav-header">
        <h2>🍽️ DIG IN</h2>
        <span class="recipe-nav-info" id="recipeNavInfo">Recipe 1 of 64</span>
        <div class="recipe-nav-buttons">
            <button class="nav-btn" id="prevRecipeBtn" onclick="prevRecipe()">← PREV</button>
            <button class="nav-btn" id="nextRecipeBtn" onclick="nextRecipe()">NEXT →</button>
        </div>
    </div>

    <div class="recipe-card-final">
        <!-- Header (Dish Pane) -->
        <div class="card-header">
            <div class="card-header-left">
                <h1 id="recipeName">Loading Recipe...</h1>
                <p id="recipeCountry">From the world</p>
                <div class="card-meta">
                    <span class="meta-badge" id="diffBadge">● Easy</span>
                    <span class="meta-badge" id="timeBadge">⏱ — min</span>
                    <span class="meta-badge" id="servBadge">🍽 — servings</span>
                </div>
            </div>
            <div class="card-header-right">
                <div class="dish-emoji-big" id="recipeEmoji">🍳</div>
            </div>
        </div>

        <!-- Card Body -->
        <div class="card-body">
            <!-- Missing Indicator -->
            <div class="missing-indicator" id="missingIndicator">
                <div class="missing-indicator-title">❌ WHAT ARE YOU MISSING?</div>
                <div class="missing-items" id="missingItems"></div>
            </div>

            <!-- View Tabs -->
            <div class="view-tabs">
                <button class="view-tab active" data-view="ingredients">Ingredients</button>
                <button class="view-tab" data-view="instructions">Instructions</button>
                <button class="view-tab" data-view="adapt">Adapt Recipe</button>
                <button class="view-tab" data-view="drinks">Pair Drinks</button>
            </div>

            <!-- Ingredients View -->
            <div id="view-ingredients" class="view-content">
                <ul id="ingredientsList" style="list-style: none; padding: 0;"></ul>
            </div>

            <!-- Instructions View -->
            <div id="view-instructions" class="view-content" style="display: none;">
                <!-- Step View Mode Toggle -->
                <div class="step-view-mode-toggle">
                    <button class="mode-btn active" data-mode="linear">📋 LIST</button>
                    <button class="mode-btn" data-mode="carousel">🎞 CAROUSEL</button>
                </div>

                <!-- Linear Steps -->
                <div class="step-list active" id="stepList"></div>

                <!-- Carousel Steps -->
                <div class="carousel-container" id="carouselContainer">
                    <div class="carousel-viewport">
                        <div class="carousel-track" id="carouselTrack"></div>
                    </div>
                    <div class="carousel-nav">
                        <button class="carousel-btn" id="prevBtn">← PREV</button>
                        <span class="carousel-indicator" id="stepIndicator">1 / —</span>
                        <button class="carousel-btn" id="nextBtn">NEXT →</button>
                    </div>
                </div>
            </div>

            <!-- Adaptation View -->
            <div id="view-adapt" class="view-content" style="display: none;">
                <div class="adapt-section show">
                    <div class="adapt-title">🔧 HOW WOULD YOU LIKE TO ADAPT THIS?</div>
                    <div class="adapt-options">
                        <button class="adapt-btn" data-adapt="protein">+ PROTEIN</button>
                        <button class="adapt-btn" data-adapt="fiber">+ FIBER</button>
                        <button class="adapt-btn" data-adapt="lowcarb">🔻 CARBS</button>
                        <button class="adapt-btn" data-adapt="veggies">+ VEGGIES</button>
                    </div>
                    <div class="adapt-results" id="adaptResults"></div>
                </div>
            </div>

            <!-- Drinks View -->
            <div id="view-drinks" class="view-content" style="display: none;">
                <div class="drinks-section">
                    <div class="drinks-title">🥤 PAIR WITH A DRINK</div>
                    <div class="drinks-category-pills" id="drinkCategories"></div>
                    <div class="drinks-grid" id="drinksGrid"></div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="btn-primary" id="startBtn">▶ START COOKING</button>
                <button class="btn-secondary" id="saveBtn">♡ SAVE RECIPE</button>
            </div>
        </div>
    </div>

    <script>
        let allRecipes = [];
        let currentRecipeIndex = 0;
        let currentRecipe = null;

        // Load recipes from API
        async function loadRecipes() {
            try {
                const res = await fetch('http://localhost:5000/api/recipes?limit=100');
                const data = await res.json();
                allRecipes = data.recipes || [];
                console.log(`✓ Loaded ${allRecipes.length} recipes`);

                if (allRecipes.length > 0) {
                    currentRecipeIndex = 0;
                    displayRecipe(0);
                }
            } catch (err) {
                console.error('Error loading recipes:', err);
                alert('Could not load recipes. Make sure the API is running on http://localhost:5000');
            }
        }

        function displayRecipe(index) {
            if (allRecipes.length === 0) return;
            currentRecipeIndex = Math.max(0, Math.min(index, allRecipes.length - 1));
            currentRecipe = allRecipes[currentRecipeIndex];
            renderRecipeCard(currentRecipe);
            updateNavigation();
        }

        function updateNavigation() {
            const info = document.getElementById('recipeNavInfo');
            if (info) {
                info.textContent = `Recipe ${currentRecipeIndex + 1} of ${allRecipes.length}`;
            }

            const prevBtn = document.getElementById('prevRecipeBtn');
            const nextBtn = document.getElementById('nextRecipeBtn');
            if (prevBtn) prevBtn.disabled = currentRecipeIndex === 0;
            if (nextBtn) nextBtn.disabled = currentRecipeIndex === allRecipes.length - 1;
        }

        function nextRecipe() {
            displayRecipe(currentRecipeIndex + 1);
        }

        function prevRecipe() {
            displayRecipe(currentRecipeIndex - 1);
        }

        // Sample drinks data (for pairing)
        const sampleDrinks = {
            "hot-coffee": [
                { name: "Espresso", emoji: "☕", desc: "Bold and concentrated" },
                { name: "Cappuccino", emoji: "🍵", desc: "Creamy and smooth" }
            ],
            "tea": [
                { name: "Green Tea", emoji: "🫖", desc: "Light and fresh" },
                { name: "Black Tea", emoji: "🫖", desc: "Strong and bold" }
            ]
        };

        // Initialize
        function init() {
            loadRecipes();
            setupEventListeners();
        }

        function getEmojiForCountry(country) {
            const emojiMap = {
                'Argentina': '🇦🇷', 'Brazil': '🇧🇷', 'China': '🇨🇳', 'Afghanistan': '🇦🇫',
                'Albania': '🇦🇱', 'Algeria': '🇩🇿', 'Italy': '🍝', 'Mexico': '🌮',
                'Japan': '🍜', 'India': '🍛', 'USA': '🍔', 'France': '🥐', 'Thailand': '🫕'
            };
            return emojiMap[country] || '🍳';
        }

        function renderRecipeCard(recipe) {
            if (!recipe) return;

            // Header
            document.getElementById('recipeName').textContent = recipe.name || 'Recipe';
            document.getElementById('recipeCountry').textContent = `From ${recipe.country || 'Unknown'}`;
            document.getElementById('diffBadge').textContent = `● ${recipe.difficulty ? recipe.difficulty.charAt(0).toUpperCase() + recipe.difficulty.slice(1) : 'Easy'}`;
            document.getElementById('timeBadge').textContent = `⏱ ${(recipe.prepTime || 0) + (recipe.cookTime || 0)} min`;
            document.getElementById('servBadge').textContent = `🍽 ${recipe.servings || 4} servings`;
            document.getElementById('recipeEmoji').textContent = getEmojiForCountry(recipe.country);

            // Ingredients
            const ingList = document.getElementById('ingredientsList');
            ingList.innerHTML = recipe.ingredients.map(ing => `
                <li style="display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0e0d8;">
                    <span style="flex-shrink: 0;">✓</span>
                    <span style="flex: 1;">${ing}</span>
                </li>
            `).join('');

            // Linear Steps
            const stepList = document.getElementById('stepList');
            stepList.innerHTML = recipe.instructions.map((step, i) => `
                <div class="step-item">
                    <div class="step-number-badge">${i + 1}</div>
                    <div class="step-text">${step}</div>
                </div>
            `).join('');

            // Carousel Steps
            const instructions = recipe.instructions || [];
            const track = document.getElementById('carouselTrack');
            track.innerHTML = instructions.map((step, i) => `
                <div class="flip-card" data-step="${i}">
                    <div class="flip-inner">
                        <div class="flip-front">
                            <div class="flip-step-header">STEP ${i + 1} OF ${instructions.length}</div>
                            <div class="flip-step-text">${step}</div>
                            <div class="flip-hint">👆 TAP TO FLIP</div>
                        </div>
                        <div class="flip-back">
                            <div class="flip-stage-emoji">👨‍🍳</div>
                            <div class="flip-stage-label">COOKING</div>
                            <div class="flip-visual-text">Executing step ${i + 1} of ${instructions.length}</div>
                        </div>
                    </div>
                </div>
            `).join('');

            document.getElementById('stepIndicator').textContent = `1 / ${instructions.length}`;

            // Drinks
            renderDrinks();

            // Missing Indicator
            const missing = recipe.ingredients.filter((_, i) => i % 3 === 0); // Mock missing
            if (missing.length > 0) {
                document.getElementById('missingIndicator').classList.add('show');
                document.getElementById('missingItems').innerHTML = missing.map(item =>
                    `<span class="missing-tag">${item}</span>`
                ).join('');
            }
        }

        function renderDrinks() {
            const categories = Object.keys(sampleDrinks);
            const drinkCats = document.getElementById('drinkCategories');
            drinkCats.innerHTML = categories.map(cat => `
                <button class="drink-pill ${cat === 'hot-coffee' ? 'active' : ''}" data-cat="${cat}">
                    ${cat.replace('-', ' ').toUpperCase()}
                </button>
            `).join('');

            const drinksGrid = document.getElementById('drinksGrid');
            renderDrinkCategory('hot-coffee', drinksGrid);

            // Category filters
            document.querySelectorAll('.drink-pill').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.drink-pill').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderDrinkCategory(btn.dataset.cat, drinksGrid);
                });
            });
        }

        function renderDrinkCategory(category, grid) {
            const drinks = sampleDrinks[category] || [];
            grid.innerHTML = drinks.map((drink, i) => `
                <div class="drink-card ${i === 0 ? 'featured' : ''}">
                    <div class="drink-card-head">
                        <span class="drink-emoji">${drink.emoji}</span>
                        <span class="drink-card-name">${drink.name}</span>
                    </div>
                    <div class="drink-card-body">${drink.desc}</div>
                </div>
            `).join('');
        }

        function setupEventListeners() {
            // View tabs
            document.querySelectorAll('.view-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const view = tab.dataset.view;
                    document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.view-content').forEach(v => v.style.display = 'none');
                    tab.classList.add('active');
                    document.getElementById(`view-${view}`).style.display = 'block';
                });
            });

            // Step mode toggle
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const mode = btn.dataset.mode;
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    if (mode === 'linear') {
                        document.getElementById('stepList').classList.add('active');
                        document.getElementById('carouselContainer').classList.remove('active');
                    } else {
                        document.getElementById('stepList').classList.remove('active');
                        document.getElementById('carouselContainer').classList.add('active');
                        initCarousel();
                    }
                });
            });

            // Carousel
            let currentStep = 0;
            const totalSteps = (recipe.instructions && recipe.instructions.length) || 0;

            function initCarousel() {
                if (totalSteps === 0) return;
                const track = document.getElementById('carouselTrack');
                const steps = track.querySelectorAll('.flip-card');

                function goto(idx) {
                    currentStep = Math.max(0, Math.min(idx, totalSteps - 1));
                    track.style.transform = `translateX(-${currentStep * 100}%)`;
                    document.getElementById('stepIndicator').textContent = `${currentStep + 1} / ${totalSteps}`;
                    document.getElementById('prevBtn').disabled = currentStep === 0;
                    document.getElementById('nextBtn').disabled = currentStep === totalSteps - 1;
                }

                document.getElementById('prevBtn').addEventListener('click', () => goto(currentStep - 1));
                document.getElementById('nextBtn').addEventListener('click', () => goto(currentStep + 1));

                // Flip card on click
                steps.forEach(card => {
                    card.addEventListener('click', () => {
                        card.classList.toggle('flipped');
                    });
                });

                goto(0);
            }

            // Adapt buttons
            document.querySelectorAll('.adapt-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    btn.classList.toggle('active');
                    const adaptType = btn.dataset.adapt;
                    showAdaptResults(adaptType);
                });
            });

            // Action buttons
            document.getElementById('startBtn').addEventListener('click', () => {
                document.querySelector('[data-view="instructions"]').click();
            });

            document.getElementById('saveBtn').addEventListener('click', () => {
                document.getElementById('saveBtn').textContent = document.getElementById('saveBtn').textContent === '♡ SAVE RECIPE' ? '♥ SAVED' : '♡ SAVE RECIPE';
            });
        }

        function showAdaptResults(type) {
            const results = {
                protein: "Add 1-2 extra eggs or 100g grilled chicken breast to boost protein to 35g per serving.",
                fiber: "Use whole wheat pasta and add 1 cup of spinach for 8g extra fiber.",
                lowcarb: "Use zucchini noodles or low-carb pasta to cut carbs by 60%.",
                veggies: "Toss in 2 cups of roasted mushrooms and asparagus for veggie boost."
            };

            const activeAdapts = Array.from(document.querySelectorAll('.adapt-btn.active'))
                .map(b => b.dataset.adapt);

            const resultsEl = document.getElementById('adaptResults');
            if (activeAdapts.length > 0) {
                const adaptText = activeAdapts.map(a => `• ${results[a]}`).join('<br><br>');
                resultsEl.innerHTML = adaptText;
                resultsEl.classList.add('show');
            } else {
                resultsEl.classList.remove('show');
            }
        }

        // Start
        init();
    </script>
</body>
</html>
