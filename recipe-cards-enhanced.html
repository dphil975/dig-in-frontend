<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dig In - Global Recipe Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #ff6b6b;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .recipe-counter {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8em;
            color: #ffd700;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        input[type="text"], select {
            padding: 12px 15px;
            border: 2px solid #ff6b6b;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7em;
            cursor: pointer;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        button {
            padding: 12px 25px;
            background: #ff6b6b;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7em;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #ff5252;
            transform: scale(1.05);
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .recipe-card {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.1) 0%, rgba(255, 215, 0, 0.05) 100%);
            border: 2px solid #ff6b6b;
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .recipe-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.3);
            border-color: #ffd700;
        }

        .recipe-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }

        .recipe-card:hover::before {
            left: 100%;
        }

        .card-header {
            margin-bottom: 15px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.5);
            padding-bottom: 15px;
        }

        .recipe-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.2em;
            color: #ff6b6b;
            margin-bottom: 8px;
        }

        .recipe-origin {
            font-size: 0.8em;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .recipe-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75em;
            color: #bbb;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .recipe-description {
            font-size: 0.9em;
            color: #ddd;
            margin: 15px 0;
            line-height: 1.4;
        }

        .ingredients-section {
            background: rgba(0, 0, 0, 0.3);
            border-left: 3px solid #ffd700;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
        }

        .ingredients-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.75em;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .ingredients-list {
            list-style: none;
            font-size: 0.85em;
            color: #ccc;
        }

        .ingredients-list li {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }

        .ingredients-list li:before {
            content: "• ";
            color: #ff6b6b;
            margin-right: 8px;
        }

        .pairings-section {
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
        }

        .pairings-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.65em;
            color: #ffd700;
            margin-bottom: 8px;
        }

        .pairing-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .chip {
            background: rgba(255, 107, 107, 0.3);
            border: 1px solid #ff6b6b;
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 0.7em;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip:hover {
            background: #ff6b6b;
            transform: scale(1.05);
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .adapt-btn {
            flex: 1;
            min-width: 100px;
            padding: 10px;
            background: rgba(255, 107, 107, 0.8);
            border: 1px solid #ff6b6b;
            color: #fff;
            border-radius: 6px;
            font-size: 0.65em;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            transition: all 0.2s;
        }

        .adapt-btn:hover {
            background: #ff6b6b;
        }

        .action-btn {
            flex: 1;
            min-width: 100px;
            padding: 10px;
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid #ffd700;
            color: #ffd700;
            border-radius: 6px;
            font-size: 0.65em;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: #ffd700;
            color: #000;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            overflow-y: auto;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 3px solid #ff6b6b;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.5em;
            color: #ff6b6b;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            font-size: 2em;
            cursor: pointer;
            padding: 0;
        }

        .adapt-option {
            background: rgba(255, 215, 0, 0.05);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            cursor: pointer;
            transition: all 0.2s;
        }

        .adapt-option:hover {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }

        .adapt-option h3 {
            color: #ffd700;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .adapt-option p {
            color: #ddd;
            font-size: 0.85em;
            margin-bottom: 10px;
        }

        .modify-items {
            background: rgba(0, 0, 0, 0.3);
            border-left: 3px solid #ff6b6b;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.8em;
            color: #ccc;
        }

        .confirm-btn {
            background: #ff6b6b;
            border: none;
            color: #fff;
            padding: 12px 20px;
            border-radius: 6px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7em;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            transition: all 0.2s;
        }

        .confirm-btn:hover {
            background: #ff5252;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .nav-btn {
            padding: 12px 25px;
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid #ffd700;
            color: #ffd700;
            border-radius: 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #ffd700;
            color: #000;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .cards-container {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.5em;
            }

            .recipe-title {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🍽️ DIG IN</h1>
        <p class="recipe-counter" id="recipeCounter">Loading recipes...</p>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search recipes...">
        <select id="countryFilter">
            <option value="">All Countries</option>
        </select>
        <select id="categoryFilter">
            <option value="">All Categories</option>
            <option value="breakfast">Breakfast</option>
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
            <option value="snacks">Snacks</option>
            <option value="desserts">Desserts</option>
            <option value="nonAlcoholicDrinks">Non-Alcoholic Drinks</option>
            <option value="alcoholicDrinks">Alcoholic Drinks</option>
        </select>
        <button id="randomBtn">Random Recipe</button>
    </div>

    <div class="nav-buttons">
        <button id="prevBtn" class="nav-btn">← PREV</button>
        <button id="nextBtn" class="nav-btn">NEXT →</button>
    </div>

    <div class="cards-container" id="cardsContainer"></div>

    <div id="adaptModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Customize Recipe</span>
                <button class="close-btn" onclick="closeAdaptModal()">✕</button>
            </div>
            <div id="adaptOptions"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';
        let allRecipes = [];
        let filteredRecipes = [];
        let currentIndex = 0;
        let recipesPerPage = 6;

        async function loadRecipes() {
            try {
                const response = await fetch(`${API_URL}/api/recipes?limit=1000`);
                const data = await response.json();
                allRecipes = data.recipes;
                filteredRecipes = allRecipes;
                updateCountries();
                displayRecipes();
                updateCounter();
            } catch (error) {
                console.error('Error loading recipes:', error);
            }
        }

        function updateCountries() {
            const countries = [...new Set(allRecipes.map(r => r.country))].sort();
            const select = document.getElementById('countryFilter');
            countries.forEach(country => {
                const option = document.createElement('option');
                option.value = country;
                option.textContent = country;
                select.appendChild(option);
            });
        }

        function filterRecipes() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const country = document.getElementById('countryFilter').value;
            const category = document.getElementById('categoryFilter').value;

            filteredRecipes = allRecipes.filter(recipe => {
                const matchSearch = recipe.name.toLowerCase().includes(search) ||
                    (recipe.description && recipe.description.toLowerCase().includes(search));
                const matchCountry = !country || recipe.country === country;
                const matchCategory = !category || recipe.category === category;
                return matchSearch && matchCountry && matchCategory;
            });

            currentIndex = 0;
            displayRecipes();
            updateCounter();
        }

        function displayRecipes() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            const start = currentIndex;
            const end = Math.min(start + recipesPerPage, filteredRecipes.length);

            for (let i = start; i < end; i++) {
                const recipe = filteredRecipes[i];
                container.appendChild(createRecipeCard(recipe));
            }

            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = end >= filteredRecipes.length;
        }

        function createRecipeCard(recipe) {
            const card = document.createElement('div');
            card.className = 'recipe-card';

            const ingredientsHTML = recipe.ingredients
                .slice(0, 5)
                .map(ing => `<li>${ing}</li>`)
                .join('');

            const adaptOptions = [
                { name: '+Protein', description: 'Add more protein sources' },
                { name: '+Fiber', description: 'Increase fiber content' },
                { name: 'Lower Carbs', description: 'Reduce carbohydrates' },
                { name: '+Veggies', description: 'Add more vegetables' }
            ];

            const adaptButtonsHTML = adaptOptions
                .map(opt => `<button class="adapt-btn" onclick="showAdaptModal('${recipe.id}', '${opt.name}', '${recipe.name}')">+${opt.name.split('+')[1] || opt.name}</button>`)
                .join('');

            card.innerHTML = `
                <div class="card-header">
                    <div class="recipe-title">${recipe.name}</div>
                    <div class="recipe-origin">${recipe.country} • ${recipe.region}</div>
                    <div class="recipe-meta">
                        <span class="meta-item">⏱️ ${recipe.prepTime + recipe.cookTime} min</span>
                        <span class="meta-item">📊 ${recipe.difficulty}</span>
                        <span class="meta-item">👥 ${recipe.servings}</span>
                    </div>
                </div>

                <p class="recipe-description">${recipe.description}</p>

                <div class="ingredients-section">
                    <div class="ingredients-title">KEY INGREDIENTS</div>
                    <ul class="ingredients-list">
                        ${ingredientsHTML}
                    </ul>
                </div>

                <div class="pairings-section">
                    <div class="pairings-title">ADAPT RECIPE</div>
                    <div class="card-actions">
                        ${adaptButtonsHTML}
                    </div>
                </div>

                <div class="card-actions">
                    <button class="action-btn" onclick="viewFullRecipe('${recipe.id}')">VIEW STEPS</button>
                    <button class="action-btn" onclick="showMoreInfo('${recipe.id}')">FULL DETAILS</button>
                </div>
            `;

            return card;
        }

        function showAdaptModal(recipeId, adaptType, recipeName) {
            const recipe = filteredRecipes.find(r => r.id === recipeId);
            const modal = document.getElementById('adaptModal');
            const options = document.getElementById('adaptOptions');

            const adaptations = {
                'Protein': {
                    description: 'Add protein-rich ingredients to boost nutritional value',
                    suggestions: ['Add Greek yogurt', 'Include beans or lentils', 'Add nuts or seeds', 'Use protein powder']
                },
                'Fiber': {
                    description: 'Increase fiber content for better digestion',
                    suggestions: ['Add whole grains', 'Include vegetables', 'Use legumes', 'Add nuts and seeds']
                },
                'Carbs': {
                    description: 'Reduce carbohydrates while maintaining taste',
                    suggestions: ['Replace grains with vegetables', 'Use cauliflower rice', 'Reduce sugar', 'Use sugar alternatives']
                },
                'Veggies': {
                    description: 'Add more vegetables for nutrition and volume',
                    suggestions: ['Add leafy greens', 'Include root vegetables', 'Add mushrooms', 'Use seasonal vegetables']
                }
            };

            const type = adaptType.replace(/[+]/g, '');
            const adapt = adaptations[type] || adaptations['Protein'];

            options.innerHTML = `
                <div class="adapt-option">
                    <h3>${adaptType}</h3>
                    <p>${adapt.description}</p>
                    <div class="modify-items">
                        <strong>Recipe: ${recipeName}</strong><br>
                        ${adapt.suggestions.map(s => `✓ ${s}`).join('<br>')}
                    </div>
                    <button class="confirm-btn" onclick="applyAdaptation('${recipeId}', '${adaptType}')">
                        APPLY CHANGES
                    </button>
                </div>
            `;

            modal.classList.add('active');
        }

        function closeAdaptModal() {
            document.getElementById('adaptModal').classList.remove('active');
        }

        function applyAdaptation(recipeId, adaptType) {
            alert(`Applied "${adaptType}" to recipe!\n\nYour customized recipe has been updated. You can now view the modified version with the new ingredients and instructions.`);
            closeAdaptModal();
        }

        function viewFullRecipe(recipeId) {
            const recipe = filteredRecipes.find(r => r.id === recipeId);

            // Store recipe data in sessionStorage for the steps viewer
            sessionStorage.setItem('currentRecipe', JSON.stringify(recipe));

            // Open the steps viewer in a new tab or modal
            const stepsViewerURL = 'recipe-steps-viewer.html';
            window.open(stepsViewerURL, 'RecipeSteps', 'width=1000,height=800,scrollbars=yes');
        }

        function showMoreInfo(recipeId) {
            const recipe = filteredRecipes.find(r => r.id === recipeId);
            alert(`${recipe.name}\n\nFun Fact: ${recipe.fun_fact}\n\nAlternatives:\n${recipe.alternatives.map(a => `• ${a}`).join('\n')}`);
        }

        document.getElementById('searchInput').addEventListener('input', filterRecipes);
        document.getElementById('countryFilter').addEventListener('change', filterRecipes);
        document.getElementById('categoryFilter').addEventListener('change', filterRecipes);
        document.getElementById('randomBtn').addEventListener('click', () => {
            currentIndex = Math.floor(Math.random() * Math.max(0, filteredRecipes.length - recipesPerPage));
            displayRecipes();
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            currentIndex = Math.max(0, currentIndex - recipesPerPage);
            displayRecipes();
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentIndex = Math.min(currentIndex + recipesPerPage, filteredRecipes.length - recipesPerPage);
            displayRecipes();
        });

        function updateCounter() {
            const start = currentIndex + 1;
            const end = Math.min(currentIndex + recipesPerPage, filteredRecipes.length);
            document.getElementById('recipeCounter').textContent =
                `Showing ${start}-${end} of ${filteredRecipes.length} recipes`;
        }

        loadRecipes();
    </script>
</body>
</html>
