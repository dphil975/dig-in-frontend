<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Cards - Dig In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #667eea;
      --secondary: #764ba2;
      --accent: #FF5C9D;
      --light-bg: #f9f9f9;
      --border-color: #e0e0e0;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      font-family: 'DotGothic16', monospace;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .page-header {
      text-align: center;
      margin-bottom: 40px;
      color: white;
    }

    .page-header h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 36px;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      letter-spacing: 2px;
    }

    .page-header p {
      font-size: 13px;
      opacity: 0.9;
      margin-bottom: 20px;
    }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .recipe-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }

    .recipe-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
    }

    .recipe-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
      padding: 20px;
    }

    .recipe-header h2 {
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }

    .recipe-subtitle {
      font-size: 12px;
      opacity: 0.95;
      margin-bottom: 10px;
    }

    .recipe-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
      font-size: 11px;
    }

    .meta-badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .recipe-body {
      padding: 20px;
    }

    .recipe-description {
      font-size: 12px;
      line-height: 1.6;
      color: #666;
      margin-bottom: 15px;
    }

    .recipe-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 15px;
      font-size: 11px;
    }

    .info-item {
      background: var(--light-bg);
      padding: 8px;
      border-radius: 6px;
      border-left: 3px solid var(--primary);
    }

    .info-label {
      color: var(--primary);
      font-weight: bold;
      display: block;
      font-size: 10px;
      margin-bottom: 2px;
    }

    .ingredients-preview {
      background: var(--light-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 15px;
    }

    .ingredients-preview h4 {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      margin-bottom: 8px;
      color: var(--primary);
      letter-spacing: 0.5px;
    }

    .ingredients-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      font-size: 10px;
    }

    .ingredient-item {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #666;
    }

    .ingredient-item::before {
      content: "•";
      color: var(--accent);
      font-weight: bold;
    }

    .btn-view-steps {
      width: 100%;
      padding: 10px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      cursor: pointer;
      transition: background 0.3s;
      letter-spacing: 0.5px;
    }

    .btn-view-steps:hover {
      background: var(--secondary);
    }

    /* Modal for recipe steps */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.3s;
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: white;
      border-radius: 12px;
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.3s;
    }

    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
      padding: 25px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .modal-header h2 {
      font-family: 'Press Start 2P', monospace;
      font-size: 18px;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .modal-close {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      font-size: 24px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .modal-body {
      padding: 30px;
    }

    .steps-container {
      margin-bottom: 20px;
    }

    .step-card {
      background: white;
      border: 2px solid var(--primary);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      position: relative;
    }

    .step-number {
      position: absolute;
      left: -15px;
      top: -15px;
      background: var(--primary);
      color: white;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      font-weight: bold;
    }

    .step-instruction {
      font-size: 12px;
      line-height: 1.7;
      color: #333;
      margin-bottom: 10px;
      margin-left: 20px;
    }

    .step-meta {
      display: flex;
      gap: 15px;
      font-size: 11px;
      color: #666;
      margin-left: 20px;
    }

    .step-time {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .step-time::before {
      content: "⏱";
    }

    .step-tips {
      background: #FFF9E6;
      border-left: 3px solid #FFB800;
      padding: 10px;
      margin-top: 10px;
      border-radius: 4px;
      font-size: 11px;
      color: #666;
      margin-left: 20px;
    }

    .step-tips::before {
      content: "💡 Tip: ";
      font-weight: bold;
      color: #FFB800;
    }

    .filter-section {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      backdrop-filter: blur(10px);
    }

    .filter-title {
      font-family: 'Press Start 2P', monospace;
      color: white;
      font-size: 12px;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-btn {
      padding: 8px 16px;
      background: white;
      color: var(--primary);
      border: 2px solid white;
      border-radius: 6px;
      font-family: monospace;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: bold;
    }

    .filter-btn:hover {
      background: var(--primary);
      color: white;
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    @media (max-width: 768px) {
      .recipe-grid {
        grid-template-columns: 1fr;
      }

      .modal-content {
        max-width: 95%;
        max-height: 95vh;
      }

      .page-header h1 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="page-header">
      <h1>🌍 Recipe Cards</h1>
      <p>International Cookbook Recipes from Afghanistan, Balkans & More</p>
    </div>

    <!-- Filter Section -->
    <div class="filter-section">
      <div class="filter-title">FILTER BY MEAL TYPE</div>
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All Recipes</button>
        <button class="filter-btn" data-filter="appetizer">Appetizers</button>
        <button class="filter-btn" data-filter="breakfast">Breakfast</button>
        <button class="filter-btn" data-filter="lunch">Lunch</button>
        <button class="filter-btn" data-filter="dinner">Dinner</button>
        <button class="filter-btn" data-filter="dessert">Desserts</button>
      </div>
    </div>

    <!-- Recipe Grid -->
    <div class="recipe-grid" id="recipeGrid">
      <!-- Recipes will be inserted here -->
    </div>
  </div>

  <!-- Modal for Steps -->
  <div class="modal" id="stepsModal">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h2 id="modalTitle"></h2>
          <p id="modalSubtitle" style="opacity: 0.9; font-size: 12px;"></p>
        </div>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="steps-container" id="stepsContainer"></div>
      </div>
    </div>
  </div>

  <script>
    let recipesData = [];
    let currentFilter = 'all';

    // Load recipes from JSON
    async function loadRecipes() {
      try {
        const response = await fetch('data/international-cookbooks-recipes.json');
        const data = await response.json();
        recipesData = data.recipes;
        renderRecipes();
      } catch (error) {
        console.error('Error loading recipes:', error);
      }
    }

    function renderRecipes() {
      const grid = document.getElementById('recipeGrid');
      grid.innerHTML = '';

      const filtered = currentFilter === 'all'
        ? recipesData
        : recipesData.filter(r => r.mealType === currentFilter);

      filtered.forEach(recipe => {
        const card = createRecipeCard(recipe);
        grid.appendChild(card);
      });
    }

    function createRecipeCard(recipe) {
      const div = document.createElement('div');
      div.className = 'recipe-card';

      const ingredientsList = recipe.ingredients
        .slice(0, 4)
        .map(ing => `${ing.item}`)
        .join(', ');

      div.innerHTML = `
        <div class="recipe-header">
          <h2>${recipe.name}</h2>
          <p class="recipe-subtitle">${recipe.subtitle}</p>
          <div class="recipe-meta">
            <span class="meta-badge">🌍 ${recipe.region}</span>
            <span class="meta-badge">📍 ${recipe.cuisine}</span>
            <span class="meta-badge">⏱ ${recipe.totalTime}min</span>
            <span class="meta-badge">👥 ${recipe.servings}</span>
          </div>
        </div>
        <div class="recipe-body">
          <p class="recipe-description">${recipe.description}</p>

          <div class="recipe-info">
            <div class="info-item">
              <span class="info-label">PREP TIME</span>
              ${recipe.prepTime} min
            </div>
            <div class="info-item">
              <span class="info-label">COOK TIME</span>
              ${recipe.cookTime} min
            </div>
            <div class="info-item">
              <span class="info-label">DIFFICULTY</span>
              ${recipe.difficulty}
            </div>
            <div class="info-item">
              <span class="info-label">STEPS</span>
              ${recipe.steps.length} steps
            </div>
          </div>

          <div class="ingredients-preview">
            <h4>KEY INGREDIENTS</h4>
            <div class="ingredients-list">
              ${recipe.ingredients.slice(0, 4).map(ing => `
                <div class="ingredient-item">${ing.item}</div>
              `).join('')}
            </div>
          </div>

          <button class="btn-view-steps" onclick="openModal(${recipe.id})">VIEW RECIPE STEPS →</button>
        </div>
      `;

      return div;
    }

    function openModal(recipeId) {
      const recipe = recipesData.find(r => r.id === recipeId);
      if (!recipe) return;

      document.getElementById('modalTitle').textContent = recipe.name;
      document.getElementById('modalSubtitle').textContent = recipe.subtitle;

      const stepsContainer = document.getElementById('stepsContainer');
      stepsContainer.innerHTML = '';

      recipe.steps.forEach(step => {
        const stepDiv = document.createElement('div');
        stepDiv.className = 'step-card';
        stepDiv.innerHTML = `
          <div class="step-number">${step.step}</div>
          <div class="step-instruction">${step.instruction}</div>
          <div class="step-meta">
            <div class="step-time">${step.time} min</div>
          </div>
          ${step.tips ? `<div class="step-tips">${step.tips}</div>` : ''}
        `;
        stepsContainer.appendChild(stepDiv);
      });

      document.getElementById('stepsModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('stepsModal').classList.remove('active');
    }

    // Filter functionality
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderRecipes();
      });
    });

    // Close modal when clicking outside
    document.getElementById('stepsModal').addEventListener('click', (e) => {
      if (e.target.id === 'stepsModal') {
        closeModal();
      }
    });

    // Load recipes on page load
    loadRecipes();
  </script>
</body>
</html>
